<!DOCTYPE html>
<html>
<head>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #f0f0f0; text-align: center; font-family: sans-serif; }
        .grid { display: grid; grid-template-columns: repeat(5, 50px); gap: 5px; justify-content: center; margin-top: 20px; }
        .cell { width: 50px; height: 50px; border: 1px solid #ccc; background: white; }
        .pink { background: #ffc0cb; }
    </style>
</head>
<body>
    <h1>Pips Clone MVP</h1>
    <div class="grid">
        <div class="cell"></div><div class="cell pink">6</div><div class="cell"></div>
        <div class="cell"></div><div class="cell pink"></div><div class="cell"></div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); // Сообщаем телеге, что приложение загрузилось
    </script>
</body>
</html>

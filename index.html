<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cell-size: 45px; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #faf9f6; margin: 0; display: flex; flex-direction: column; align-items: center; touch-action: manipulation; }
        .header { margin: 20px 0; font-weight: bold; color: #333; }

        /* Сетка */
        .grid { display: grid; grid-template-columns: repeat(7, var(--cell-size)); grid-template-rows: repeat(8, var(--cell-size)); gap: 4px; background: #eee; padding: 10px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cell { width: var(--cell-size); height: var(--cell-size); background: white; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; color: #444; transition: all 0.2s; position: relative; }

        /* Зоны */
        .zone-pink { background: #ffdae9; border: 2px solid #f48fb1; }
        .zone-blue { background: #d1d9e6; border: 2px solid #9fa8da; }
        .target-label { position: absolute; top: -8px; right: -8px; background: #e91e63; color: white; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; z-index: 2; }
        .blue-label { background: #3f51b5; }

        /* Костяшки внизу */
        .hand { margin-top: 25px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 10px; max-width: 350px; }
        .pip-btn { padding: 8px 12px; background: white; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
        .pip-btn.selected { border-color: #007bff; background: #e7f1ff; }

        .status { margin-top: 15px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="header">PIPS DAILY</div>

    <div class="grid" id="grid"></div>

    <div class="status" id="status">Выберите число из списка ниже</div>

    <div class="hand" id="hand"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const config = {
            zones: [
                { id: 'pink_6', target: 6, cells: [[4,5], [4,6]], color: 'zone-pink', labelClass: '' },
                { id: 'blue_9', target: 9, cells: [[2,2], [3,2], [2,3]], color: 'zone-blue', labelClass: 'blue-label' }
            ],
            pips: [1, 5, 3, 3, 2, 4, 0, 6] // упростим пока до одиночных чисел
        };

        const state = {
            board: {}, // "x,y": value
            selectedNumber: null
        };

        // Рендер руки
        const handEl = document.getElementById('hand');
        config.pips.forEach(num => {
            const btn = document.createElement('button');
            btn.className = 'pip-btn';
            btn.innerText = num;
            btn.onclick = () => {
                document.querySelectorAll('.pip-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.selectedNumber = num;
            };
            handEl.appendChild(btn);
        });

        // Рендер сетки
        const gridEl = document.getElementById('grid');
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 7; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const coord = `${x},${y}`;

                const zone = config.zones.find(z => z.cells.some(c => c[0] === x && c[1] === y));
                if (zone) {
                    cell.classList.add(zone.color);
                    // Добавляем метку цели на первую клетку зоны
                    if (zone.cells[0][0] === x && zone.cells[0][1] === y) {
                        const label = document.createElement('div');
                        label.className = 'target-label ' + zone.labelClass;
                        label.innerText = zone.target;
                        cell.appendChild(label);
                    }
                }

                cell.onclick = () => {
                    if (state.selectedNumber !== null) {
                        state.board[coord] = state.selectedNumber;
                        cell.innerText = state.selectedNumber;
                        checkZones();
                    }
                };

                gridEl.appendChild(cell);
            }
        }

        function checkZones() {
            let allOk = true;
            config.zones.forEach(zone => {
                const currentSum = zone.cells.reduce((sum, c) => sum + (state.board[`${c[0]},${c[1]}`] || 0), 0);
                if (currentSum === zone.target) {
                    // Можно добавить анимацию успеха для зоны
                } else {
                    allOk = false;
                }
            });

            if (allOk) {
                document.getElementById('status').innerText = "🎉 ПОБЕДА! Все суммы сошлись!";
                tg.MainButton.setText("ОТПРАВИТЬ РЕЗУЛЬТАТ").show();
            }
        }
    </script>
</body>
</html>

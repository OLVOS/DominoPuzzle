<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Pips</title>
<style>
:root{--cream:#f5efe3;--dark:#1b1208;--gold:#c8963e;--gold2:#f0c060;--wood:#3b1e0c;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;overflow:hidden;touch-action:none;}
body{font-family:'DM Mono',monospace;background:var(--cream);}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:opacity .25s,transform .25s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97);}

/* ══ MENU ══ */
#menu{background:radial-gradient(ellipse at 30% 20%,#2d1a06,#080503);justify-content:flex-start;gap:0;padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.menu-title{font-family:'Playfair Display',serif;font-size:2.6rem;font-weight:900;color:var(--gold2);letter-spacing:6px;text-shadow:0 0 40px rgba(200,150,60,.45);line-height:1;margin-bottom:3px;margin-top:8px;text-align:center;width:100%;}
.menu-sub{font-size:.52rem;letter-spacing:8px;color:#b89060;text-transform:uppercase;margin-bottom:16px;text-align:center;width:100%;}
.divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;}

.menu-btn{width:100%;max-width:300px;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px;transition:all .15s;margin-bottom:10px;}
.menu-btn:active{transform:scale(.97);}
.menu-btn.primary{background:linear-gradient(135deg,#c8963e,#7a4a10);box-shadow:0 4px 0 rgba(0,0,0,.4);}
.menu-btn.secondary{background:rgba(255,255,255,.06);border:1.5px solid rgba(200,150,60,.3);}
.menu-btn.daily-btn{background:rgba(47,120,193,.12);border:1.5px solid rgba(47,120,193,.35);}
.mb-icon{font-size:1.5rem;flex-shrink:0;width:34px;text-align:center;}
.mb-text{text-align:left;flex:1;}
.mb-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--gold2);letter-spacing:1px;display:block;}
.menu-btn.secondary .mb-title,.menu-btn.daily-btn .mb-title{color:#d0c090;}
.mb-sub{font-size:.53rem;letter-spacing:1px;color:#806040;display:block;margin-top:2px;}
.menu-btn.daily-btn .mb-sub{color:#5a88b5;}
.mb-arr{font-size:.8rem;color:#806040;transition:transform .2s;}
.mb-arr.open{transform:rotate(90deg);}

/* Expandable sub-panels */
.sub-panel{width:100%;max-width:300px;overflow:hidden;max-height:0;transition:max-height .35s ease;}
.sub-panel.open{max-height:600px;}
.sub-card{background:rgba(255,255,255,.04);border:1px solid rgba(200,150,60,.18);border-radius:10px;padding:9px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--cream);margin-bottom:6px;transition:background .12s;}
.sub-card:active{background:rgba(200,150,60,.12);}
.sc-badge{width:30px;height:30px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;font-family:'Playfair Display',serif;color:var(--dark);}
.sc-badge.easy{background:linear-gradient(135deg,#4caf50,#2d7a30);}
.sc-badge.med{background:linear-gradient(135deg,#c8963e,#7a4a10);}
.sc-badge.hard{background:linear-gradient(135deg,#c14040,#7a1818);}
.sc-info{flex:1;}.sc-name{font-size:.7rem;letter-spacing:.5px;}.sc-meta{font-size:.53rem;color:#a08050;margin-top:1px;}
.sc-stars{font-size:.7rem;color:var(--gold2);}

/* ══ GAME ══ */
#game{background:var(--cream);justify-content:flex-start;padding:0 10px 6px;overflow:hidden;}
.game-header{width:100%;display:flex;align-items:center;gap:8px;padding:8px 0 4px;flex-shrink:0;}
.btn-back{background:var(--dark);color:var(--gold2);border:none;font-size:.62rem;letter-spacing:2px;padding:6px 11px;border-radius:7px;cursor:pointer;flex-shrink:0;}
.gh-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;}
.game-title{font-family:'Playfair Display',serif;font-size:.92rem;font-weight:700;color:var(--dark);letter-spacing:2px;}
.game-timer{font-size:.82rem;color:var(--gold);letter-spacing:4px;}
.game-badge{font-size:.58rem;flex-shrink:0;padding:3px 8px;border-radius:6px;font-weight:600;letter-spacing:1px;}
.game-badge.easy{background:#e8f5e9;color:#2d7a30;}
.game-badge.med{background:#fff3e0;color:#7a4a10;}
.game-badge.hard{background:#fce8e8;color:#7a1818;}
.game-badge.rnd{background:rgba(0,0,0,.07);color:#555;}

#legend{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:4px;flex-shrink:0;}
.lg{display:flex;align-items:center;gap:4px;background:white;border:1px solid #ddd;border-radius:7px;padding:2px 7px;font-size:.58rem;color:#444;font-weight:500;}
.lg-dot{width:10px;height:10px;border-radius:2px;border:2px solid;flex-shrink:0;}

/* Grid — horizontal scroll when too wide, static vertically */
#grid-outer{flex-shrink:0;margin-bottom:4px;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;width:100%;display:flex;align-items:flex-start;justify-content:center;}
#grid-wrap{background:var(--wood);padding:7px;border-radius:13px;box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.07);position:relative;display:inline-block;flex-shrink:0;}

/* ══ EDITOR ══ */
#editor{background:var(--cream);justify-content:flex-start;padding:0 10px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.ed-header{width:100%;display:flex;align-items:center;gap:6px;padding:8px 0 4px;flex-shrink:0;}
.ed-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--dark);letter-spacing:2px;flex:1;text-align:center;}
.btn-play-ed{background:linear-gradient(135deg,var(--gold),#7a4a10);color:var(--dark);border:none;font-family:'Playfair Display',serif;font-size:.72rem;font-weight:700;letter-spacing:1px;padding:6px 12px;border-radius:8px;cursor:pointer;}
.ed-size-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;flex-shrink:0;}
.ed-size-lbl{font-size:.6rem;letter-spacing:1px;color:#888;}
.ed-dim{font-size:.8rem;font-weight:700;color:var(--dark);min-width:18px;text-align:center;}
.ed-dim-btn{background:var(--dark);color:var(--gold2);border:none;width:24px;height:24px;border-radius:6px;font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.ed-toolbar{display:flex;gap:4px;margin-bottom:6px;flex-shrink:0;}
.ed-tab{flex:1;border:none;border-radius:8px;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:1px;padding:7px;cursor:pointer;background:rgba(0,0,0,.08);color:#888;transition:all .15s;}
.ed-tab.active{background:var(--dark);color:var(--gold2);}
#zone-panel{flex-shrink:0;margin-bottom:6px;}
.zone-picker{display:flex;gap:6px;margin-bottom:6px;justify-content:center;}
.zp-sw{width:30px;height:30px;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:border-color .1s;}
.zp-sw.sel{border-color:var(--dark);}
.rule-row{display:flex;align-items:center;gap:5px;justify-content:center;flex-wrap:wrap;}
#ed-grid-outer{overflow:auto;-webkit-overflow-scrolling:touch;flex-shrink:0;margin-bottom:6px;display:flex;justify-content:center;}
#ed-grid-wrap{background:var(--wood);padding:6px;border-radius:12px;display:inline-block;}
#ed-grid{display:grid;gap:3px;touch-action:none;}
.ed-cell{border-radius:5px;cursor:pointer;transition:background .08s,border .08s;border:2px solid transparent;}
.ed-cell.ec-inactive{background:rgba(0,0,0,.45);border-color:transparent;}
.ed-cell.ec-free{background:#e8e2d8;border-color:#c0b8a8;}
#ed-status{font-size:.6rem;color:#777;text-align:center;min-height:13px;flex-shrink:0;margin-bottom:4px;}
.ed-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex-shrink:0;}
.btn-regen{background:rgba(200,150,60,.18);color:var(--gold);border:1.5px solid rgba(200,150,60,.4);font-family:'DM Mono',monospace;font-size:.58rem;letter-spacing:1px;padding:5px 10px;border-radius:7px;cursor:pointer;}
#grid{display:grid;position:relative;z-index:1;}
.cell{border-radius:6px;cursor:pointer;position:relative;flex-shrink:0;transition:background .08s;}
.cell.active{background:#e8e2d8;border:2px solid #c0b8a8;}
.cell.inactive{background:transparent!important;border:none!important;pointer-events:none;}
.cell.hl-ok{background:#d0e8f8!important;border-color:#3a80d9!important;}
.cell.hl-bad{background:#f8d8d8!important;border-color:#c03030!important;}
.cell.win-c{animation:winpulse .65s ease infinite alternate;}
@keyframes winpulse{from{box-shadow:0 0 0 2px #3a9c55 inset;}to{box-shadow:0 0 0 3px #3a9c55 inset,0 0 10px rgba(58,156,85,.3);}}

#dom-layer{position:absolute;left:7px;top:7px;z-index:8;pointer-events:none;}
#zone-overlay{position:absolute;left:7px;top:7px;z-index:15;pointer-events:none;}
.zo{position:absolute;border-radius:5px;border:2px solid;pointer-events:none;background:transparent;transition:background .2s;}
.zo.err{background:rgba(200,50,50,.2);animation:zpulse 1.2s ease infinite;}
@keyframes zpulse{0%,100%{opacity:1}50%{opacity:.4}}
#rule-overlay{position:absolute;left:7px;top:7px;z-index:25;pointer-events:none;}
.rb{position:absolute;transform:translate(-50%,-50%);font-family:'DM Mono',monospace;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;border:2px solid;box-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap;backdrop-filter:blur(4px);}

#status{font-size:.6rem;color:#777;min-height:13px;text-align:center;margin-bottom:4px;flex-shrink:0;padding:0 8px;}
#controls{display:flex;gap:5px;margin-bottom:5px;flex-wrap:wrap;justify-content:center;flex-shrink:0;align-items:center;}
.ctrl{background:var(--dark);color:var(--gold2);border:none;font-family:'DM Mono',monospace;font-size:.6rem;letter-spacing:1px;padding:6px 12px;border-radius:8px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:all .1s;}
.ctrl:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.ctrl:disabled{background:#c0c0c0;color:#888;box-shadow:none;cursor:default;}
.ctrl.warn{background:#7a1818;}.ctrl.lite{background:#e4dcd0;color:var(--wood);}
.opill{background:rgba(0,0,0,.1);border-radius:8px;padding:4px 9px;font-size:.85rem;font-weight:700;color:var(--dark);min-width:26px;text-align:center;}

#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:100%;padding:2px 4px;flex-shrink:0;overflow-y:auto;max-height:200px;-webkit-overflow-scrolling:touch;}
.hand-slot{flex-shrink:0;width:60px;height:60px;display:flex;align-items:center;justify-content:center;border-radius:9px;cursor:pointer;border:2px solid transparent;background:rgba(0,0,0,.05);transition:border-color .15s,background .15s;touch-action:none;position:relative;}
.hand-slot.sel{border-color:var(--gold2);background:rgba(240,192,96,.12);}
.hand-slot.used{opacity:.18;pointer-events:none;}
.hand-slot.sel::after{content:'↻';position:absolute;top:-13px;right:2px;font-size:10px;color:var(--gold2);animation:hf 2.5s ease .4s both;pointer-events:none;}
@keyframes hf{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}

.dom-tile{background:var(--dark);border:2px solid var(--gold);border-radius:7px;box-shadow:2px 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);overflow:hidden;flex-shrink:0;}
.dom-tile.placed{position:absolute;pointer-events:auto;cursor:pointer;transition:border-color .12s,box-shadow .12s;}
.dom-tile.placed.gsel{border-color:var(--gold2);box-shadow:0 0 0 2.5px rgba(240,192,96,.65),2px 3px 0 rgba(0,0,0,.5);}
#ghost{position:fixed;z-index:9999;pointer-events:none;visibility:hidden;opacity:.88;transform:rotate(-5deg) scale(1.1);}
#ghost.on{visibility:visible;}
.pip-face{background:#f0e8d8;border-radius:4px;position:relative;overflow:hidden;flex-shrink:0;}
.dom-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.dom-inner.h{flex-direction:row;}.dom-inner.v{flex-direction:column;}
.dom-sep{background:var(--gold);border-radius:2px;flex-shrink:0;}
.dom-inner.h .dom-sep{width:2px;align-self:stretch;margin:0 4px;}
.dom-inner.v .dom-sep{height:2px;align-self:stretch;margin:4px 0;}

.hold-ring{position:absolute;inset:-4px;border-radius:inherit;pointer-events:none;z-index:5;border:3px solid var(--gold2);opacity:0;transform:scale(.7);}
.hold-ring.go{animation:hs .22s ease-out forwards;}
@keyframes hs{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}

#win-ov{position:fixed;inset:0;z-index:1000;background:rgba(8,5,2,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .4s;}
#win-ov.on{opacity:1;pointer-events:all;}
#pause-ov{position:fixed;inset:0;z-index:999;background:rgba(8,5,2,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;opacity:0;pointer-events:none;transition:opacity .3s;}
#pause-ov.on{opacity:1;pointer-events:all;}
.pause-t{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;color:var(--gold2);letter-spacing:6px;}
.pause-sub{font-size:.58rem;letter-spacing:3px;color:#b89060;}
.win-t{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;color:var(--gold2);letter-spacing:4px;animation:wf 2s ease infinite;}
@keyframes wf{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.win-time{font-size:1.2rem;color:var(--gold);letter-spacing:4px;}
.win-s{font-size:.58rem;letter-spacing:3px;color:#b89060;text-align:center;}
.win-row{display:flex;gap:10px;}
.win-btn{background:var(--gold);color:var(--dark);border:none;font-family:'Playfair Display',serif;font-size:.82rem;font-weight:700;letter-spacing:2px;padding:10px 20px;border-radius:10px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.3);}
.win-btn.sec{background:rgba(255,255,255,.08);color:var(--gold2);border:1.5px solid rgba(200,150,60,.3);}
</style>
</head>
<body>

<!-- ══ MENU ══ -->
<div class="screen" id="menu">
  <div class="menu-title">PIPS</div>
  <div class="menu-sub">Domino Puzzle</div>

  <button class="menu-btn secondary" onclick="toggleSub('tut')">
    <div class="mb-icon">🎓</div>
    <div class="mb-text">
      <span class="mb-title">ОБУЧЕНИЕ</span>
      <span class="mb-sub">4 уровня · easy → hard</span>
    </div>
    <span class="mb-arr" id="tut-arr">›</span>
  </button>
  <div class="sub-panel" id="tut-panel"></div>

  <button class="menu-btn daily-btn" onclick="toggleSub('day')">
    <div class="mb-icon">📅</div>
    <div class="mb-text">
      <span class="mb-title">ЕЖЕДНЕВНЫЕ</span>
      <span class="mb-sub" id="day-date">загрузка...</span>
    </div>
    <span class="mb-arr" id="day-arr">›</span>
  </button>
  <div class="sub-panel" id="day-panel"></div>

  <div class="divider"></div>

  <button class="menu-btn primary" onclick="toggleSub('rnd')">
    <div class="mb-icon">⚄</div>
    <div class="mb-text">
      <span class="mb-title">СЛУЧАЙНЫЙ</span>
      <span class="mb-sub">easy / medium / hard</span>
    </div>
    <span class="mb-arr" id="rnd-arr">›</span>
  </button>
  <div class="sub-panel" id="rnd-panel"></div>

  <button class="menu-btn secondary" onclick="openEditor()">
    <div class="mb-icon">✏️</div>
    <div class="mb-text">
      <span class="mb-title">РЕДАКТОР</span>
      <span class="mb-sub">создай свой уровень</span>
    </div>
  </button>
</div>

<!-- ══ GAME ══ -->
<div class="screen hidden" id="game">
  <div class="game-header">
    <button class="btn-back" onclick="pauseGame()">⏸ ПАУЗА</button>
    <div class="gh-center">
      <div class="game-title" id="gtitle">PIPS</div>
      <div class="game-timer" id="timer">00:00</div>
    </div>
    <div style="display:flex;align-items:center;gap:5px">
      <button class="btn-regen" id="btn-regen" onclick="regenRandom()" style="display:none">⟳</button>
      <div class="game-badge rnd" id="gbadge"></div>
    </div>
  </div>
  <div id="legend"></div>
  <div id="grid-outer">
    <div id="grid-wrap">
      <div id="grid"></div>
      <div id="dom-layer"></div>
      <div id="zone-overlay"></div>
      <div id="rule-overlay"></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="controls">
    <button class="ctrl" id="btn-rot" onclick="doRotate()" disabled>🔄 ПОВЕРНУТЬ</button>
    <div class="opill" id="opill">—</div>
    <button class="ctrl warn" id="btn-lift" onclick="doLift()" style="display:none">↑ В РУКУ</button>
    <button class="ctrl lite" onclick="resetPuzzle()">↺ СБРОС</button>
  </div>
  <div id="hand"></div>
</div>

<!-- ══ EDITOR ══ -->
<div class="screen hidden" id="editor">
  <div class="ed-header">
    <button class="btn-back" onclick="showScreen('menu')">← МЕНЮ</button>
    <div class="ed-title">РЕДАКТОР</div>
    <button class="btn-play-ed" onclick="edPlay()">▶ ИГРАТЬ</button>
  </div>

  <!-- Grid size -->
  <div class="ed-size-row" style="justify-content:center">
    <span class="ed-size-lbl">КОЛОНКИ</span>
    <button class="ed-dim-btn" onclick="edResize(-1,0)">−</button>
    <span class="ed-dim" id="ed-cols-lbl">6</span>
    <button class="ed-dim-btn" onclick="edResize(1,0)">+</button>
    <span class="ed-size-lbl" style="margin-left:8px">СТРОКИ</span>
    <button class="ed-dim-btn" onclick="edResize(0,-1)">−</button>
    <span class="ed-dim" id="ed-rows-lbl">4</span>
    <button class="ed-dim-btn" onclick="edResize(0,1)">+</button>
  </div>

  <!-- Mode tabs -->
  <div class="ed-toolbar">
    <button class="ed-tab active" id="tab-cells" onclick="edMode('cells')">☐ КЛЕТКИ</button>
    <button class="ed-tab" id="tab-zones" onclick="edMode('zones')">◈ ЗОНЫ</button>
  </div>

  <!-- Zone panel -->
  <div id="zone-panel" style="display:none">
    <div class="zone-picker" id="zone-picker"></div>
    <div class="rule-row" id="rule-row"></div>
  </div>

  <!-- Editor grid -->
  <div id="ed-grid-outer">
    <div id="ed-grid-wrap">
      <div id="ed-grid"></div>
    </div>
  </div>

  <div id="ed-status">Тапай клетки чтобы активировать / деактивировать</div>

  <div class="ed-actions">
    <button class="ctrl" onclick="edGenerate()">⚙ ГЕНЕРИРОВАТЬ</button>
    <button class="ctrl" onclick="edPlay()">▶ ИГРАТЬ</button>
    <button class="ctrl lite" onclick="edSave()">💾 СОХРАНИТЬ</button>
    <button class="ctrl lite" onclick="edShare()">🔗 ПОДЕЛИТЬСЯ</button>
  </div>
  <div class="ed-actions" style="margin-top:4px">
    <button class="ctrl lite" onclick="edFill()">▪ ВСЕ</button>
    <button class="ctrl lite" onclick="edClear()">○ ОЧИСТИТЬ</button>
    <button class="ctrl lite" onclick="edUndo()" id="btn-undo" disabled>↩ ОТМЕНА</button>
    <button class="ctrl lite" onclick="edRedo()" id="btn-redo" disabled>↪ ПОВТОР</button>
    <button class="ctrl lite" onclick="edReset()">✕ НОВЫЙ</button>
  </div>

  <!-- Saved levels -->
  <div style="width:100%;max-width:360px;margin-top:8px;overflow-y:auto;max-height:180px">
    <div style="font-size:.58rem;letter-spacing:2px;color:#888;margin-bottom:6px;text-align:center">МОИ УРОВНИ</div>
    <div id="saved-panel"></div>
  </div>
</div><!-- /editor -->

<div id="ghost" class="dom-tile"></div>

<div id="pause-ov">
  <div class="pause-t">⏸ ПАУЗА</div>
  <div class="pause-sub" id="pause-sub">Прогресс сохранён</div>
  <button class="win-btn" onclick="resumeGame()">▶ ПРОДОЛЖИТЬ</button>
  <button class="win-btn sec" onclick="goMenu()">← В МЕНЮ</button>
  <button class="win-btn sec" id="pause-reset-btn" onclick="confirmResetPuzzle()" style="font-size:.7rem">↺ НАЧАТЬ ЗАНОВО</button>
</div>

<div id="win-ov">
  <div class="win-t">✦ ПОБЕДА ✦</div>
  <div class="win-time" id="wtime"></div>
  <div class="win-s" id="wsub"></div>

/* ══════════════════════════════════════════
   SEEDED RNG — mulberry32
   Same seed → same puzzle for all users on same day
══════════════════════════════════════════ */
function mkRng(seed){
  let s=seed>>>0;
  return()=>{s+=0x6D2B79F5;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/2**32;};
}
function dateSeed(offsetDays=0,diffIdx=0){
  const d=new Date();d.setDate(d.getDate()+offsetDays);
  // Use LOCAL date, not UTC, so midnight = new daily for everyone in their timezone
  const y=d.getFullYear(),m=d.getMonth()+1,day=d.getDate();
  const str=`${y}${String(m).padStart(2,'0')}${String(day).padStart(2,'0')}`;
  return (parseInt(str,10)*7+diffIdx*137+42)>>>0;
}

/* ══ RULES ══
   gt/lt compare TOTAL SUM of pip values in zone (strictly > or <)
   eq = every value equal  |  neq = all distinct  |  sum = total equals v
*/
const rS=r=>({sum:`=${r.v}`,eq:'=',neq:'≠',gt:`>${r.v}`,lt:`<${r.v}`,none:''}[r.type]||'');
const rT=r=>({sum:`сумма=${r.v}`,eq:'все равны',neq:'все разные',gt:`сумма>${r.v}`,lt:`сумма<${r.v}`,none:''}[r.type]||'');
function chk(rule,vals){
  if(!vals.length)return true;
  const sum=vals.reduce((s,v)=>s+v,0);
  switch(rule.type){
    case'sum': return sum===rule.v;
    case'eq':  return vals.every(v=>v===vals[0]);
    case'neq': return new Set(vals).size===vals.length;
    case'gt':  return sum>rule.v;
    case'lt':  return sum<rule.v;
    default:   return true;
  }
}

/* ══════════════════════════════════════════

  {name:'УРОК 3',diff:'med',cols:6,rows:4,

/* ══════════════════════════════════════════
   PUZZLE GENERATOR
   rng: pass mkRng(seed) for daily, ()=>Math.random() for random
══════════════════════════════════════════ */
function allC(cols,rows){
  const a=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)a.push([c,r]);return a;
}
function shu(a,rng){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function rInt(lo,hi,rng){return lo+Math.floor(rng()*(hi-lo+1));}

/* ═══════════════════════════════════════════════════════
   SHAPE GENERATORS — 7 creative archetypes
   Each returns {cells, cols, rows} or null.
   Shapes are built from rectangular segments (addRect),
   producing pipes, frames, crosses, combs, snakes, stairs, blobs.
═══════════════════════════════════════════════════════ */

// Add cells of a rectangle into a Set
function addRect(S,x,y,w,h){
  for(let r=y;r<y+h;r++)for(let c=x;c<x+w;c++)if(c>=0&&r>=0)S.add(`${c},${r}`);
}

// Normalise Set: shift so min col/row = 0, ensure even count, reject if too blob-like
function finishShape(S,maxCells){
  const pairs=[...S].map(k=>k.split(',').map(Number));
  if(!pairs.length)return null;
  const minC=Math.min(...pairs.map(([c])=>c));
  const minR=Math.min(...pairs.map(([,r])=>r));
  const S2=new Set(pairs.map(([c,r])=>`${c-minC},${r-minR}`));
  // Hard cell limit
  if(maxCells&&S2.size>maxCells){
    // Trim to maxCells by removing leaves
    const arr2=[...S2].map(k=>k.split(',').map(Number));
    while(S2.size>maxCells){
      let removed=false;
      for(let i=arr2.length-1;i>=0&&S2.size>maxCells;i--){
        if(!S2.has(`${arr2[i][0]},${arr2[i][1]}`))continue;
        const[c,r]=arr2[i];
        const nbCount=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([nc,nr])=>S2.has(`${nc},${nr}`)).length;
        if(nbCount<=1){S2.delete(`${c},${r}`);removed=true;}
      }
      if(!removed)break; // can't trim further
    }
  }
  if(S2.size%2!==0){
    const arr2=[...S2].map(k=>k.split(',').map(Number));
    for(let i=arr2.length-1;i>=0;i--){
      const[c,r]=arr2[i];
      if([[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([nc,nr])=>S2.has(`${nc},${nr}`)).length<=1)
        {S2.delete(`${c},${r}`);break;}
    }
  }
  const cells=[...S2].map(k=>k.split(',').map(Number));
  if(cells.length<6)return null;
  const cols=Math.max(...cells.map(([c])=>c))+1;
  const rows=Math.max(...cells.map(([,r])=>r))+1;
  // Reject shapes that fill too much of their bounding box (too blob-like)
  // Structured shapes should leave at least 20% of bbox empty
  const bboxFill=cells.length/(cols*rows);
  if(bboxFill>0.88&&cells.length>12)return null;
  return{cells,cols,rows};
}

/* 1. PIPE ──────────────────────────────────────────────
   Horizontal (or vertical) main bar + branches at random positions. */
function shapePipe(diff,rng,maxC){
  const horiz=rng()<0.6;
  const W=horiz?rInt(5,9,rng):rInt(2,4,rng);
  const H=horiz?rInt(2,5,rng):rInt(5,9,rng);
  const barThick=rInt(1,2,rng);
  const barMax=horiz?H-barThick-1:W-barThick-1;
  if(barMax<1)return null;
  const barPos=rInt(1,barMax,rng);
  const S=new Set();
  if(horiz) addRect(S,0,barPos,W,barThick);
  else       addRect(S,barPos,0,barThick,H);
  const nArms=rInt(2,4,rng);
  const usedSlots=new Set();
  for(let b=0;b<nArms;b++){
    const slotMax=horiz?W-1:H-1;
    let slot,t=0;
    do{slot=rInt(0,slotMax-1,rng);t++;}while(usedSlots.has(slot)&&t<20);
    usedSlots.add(slot);
    const armThick=rng()<0.2?2:1;
    const goNeg=rng()<0.5;
    if(horiz){
      if(goNeg&&barPos>0)       addRect(S,slot,barPos-rInt(1,barPos,rng),armThick,rInt(1,barPos,rng));
      else if(barPos+barThick<H) addRect(S,slot,barPos+barThick,armThick,rInt(1,H-barPos-barThick,rng));
    } else {
      if(goNeg&&barPos>0)       addRect(S,barPos-rInt(1,barPos,rng),slot,rInt(1,barPos,rng),armThick);
      else if(barPos+barThick<W) addRect(S,barPos+barThick,slot,rInt(1,W-barPos-barThick,rng),armThick);
    }
  }
  return finishShape(S,maxC);
}

/* 2. FRAME ─────────────────────────────────────────────
   Top bar + two side columns. Bracket/U shapes. */
function shapeFrame(diff,rng,maxC){
  const W=rInt(4,8,rng), H=rInt(4,8,rng);
  const colW=rInt(1,2,rng);
  const topH=rInt(1,2,rng);
  const S=new Set();
  addRect(S,0,0,W,topH);
  addRect(S,0,topH,colW,H-topH);
  addRect(S,W-colW,topH,colW,H-topH);
  if(rng()<0.4&&H>4){const midR=rInt(topH+1,H-2,rng);addRect(S,0,midR,W,1);}
  if(rng()<0.3){addRect(S,0,H-1,W,1);}
  return finishShape(S,maxC);
}

/* 3. CROSS ─────────────────────────────────────────────
   Two bars crossing at offset. */
function shapeCross(diff,rng,maxC){
  const W=rInt(4,9,rng), H=rInt(4,8,rng);
  if(H<4||W<4)return null;
  const hRow=rInt(1,H-3,rng), hH=rInt(1,2,rng);
  const vCol=rInt(1,W-3,rng), vW=rInt(1,2,rng);
  const S=new Set();
  addRect(S,0,hRow,W,hH);
  addRect(S,vCol,0,vW,H);
  return finishShape(S,maxC);
}

/* 4. COMB ──────────────────────────────────────────────
   Spine + teeth. */
function shapeComb(diff,rng,maxC){
  const W=rInt(5,9,rng), H=rInt(3,6,rng);
  const spineH=rInt(1,2,rng);
  const atTop=rng()<0.5;
  const toothLen=Math.max(1,rInt(1,H-spineH,rng));
  const gap=rInt(1,2,rng);
  const S=new Set();
  const spineRow=atTop?0:H-spineH;
  addRect(S,0,spineRow,W,spineH);
  for(let c=0;c<W;c+=1+gap){
    if(atTop) addRect(S,c,spineH,1,toothLen);
    else       addRect(S,c,H-spineH-toothLen,1,toothLen);
  }
  return finishShape(S,maxC);
}

/* 5. SNAKE ─────────────────────────────────────────────
   Alternating segments connected at ends. */
function shapeSnake(diff,rng,maxC){
  const segLen=rInt(3,6,rng), segH=rInt(1,2,rng), nSegs=rInt(3,5,rng);
  const S=new Set();
  let x=0,y=0;
  for(let s=0;s<nSegs;s++){
    const W2=segLen+rInt(0,2,rng);
    addRect(S,x,y,W2,segH);
    if(s<nSegs-1){
      const atRight=(s%2===0);
      const connX=atRight?x+W2-1:x;
      const connH=rInt(1,3,rng);
      addRect(S,connX,y+segH,1,connH);
      y+=segH+connH;
      x=atRight?Math.max(0,connX-rInt(segLen-2,segLen,rng)+1):connX;
    }
  }
  return finishShape(S,maxC);
}

/* 6. STAIRCASE ──────────────────────────────────────────
   Diagonal descending steps. */
function shapeStair(diff,rng,maxC){
  const steps=rInt(3,4,rng), sw=rInt(2,3,rng), sh=rInt(2,3,rng);
  const S=new Set();
  for(let s=0;s<steps;s++) addRect(S,s*sw,s*sh,(steps-s)*sw,sh);
  return finishShape(S,maxC);
}

/* 7. BLOB ───────────────────────────────────────────────
   Organic BFS — capped at maxCells. */
function shapeBlob(diff,rng,maxC){
  const szByDiff={easy:[4,6,2,4],med:[5,7,3,5],hard:[5,8,4,6]}[diff]||[5,7,3,5];
  const cols=rInt(szByDiff[0],szByDiff[1],rng), rows=rInt(szByDiff[2],szByDiff[3],rng);
  const density={easy:.75,med:.65,hard:.58}[diff]||.65;
  let target=Math.floor(cols*rows*density);if(target%2!==0)target--;
  if(target<6)return null;
  const active=new Set(),front=[];
  const sc=Math.floor(cols/2),sr=Math.floor(rows/2);
  active.add(`${sc},${sr}`);front.push([sc,sr]);
  while(active.size<target&&front.length){
    const idx=Math.floor(rng()*Math.min(front.length,5));
    const[c,r]=front.splice(idx,1)[0];
    const nbrs=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([nc,nr])=>nc>=0&&nc<cols&&nr>=0&&nr<rows&&!active.has(`${nc},${nr}`));
    shu(nbrs,rng);for(const nb of nbrs){if(active.size>=target)break;active.add(`${nb[0]},${nb[1]}`);front.push(nb);}
  }
  return finishShape(active,maxC);
}

/* ── Cell limits per difficulty ── */
const MAX_CELLS={easy:14,med:22,hard:30};
const MAX_COLS={easy:9,med:11,hard:13};
const MAX_ROWS={easy:7,med:9,hard:11};

/* ── Main entry: pick archetype, retry until valid ── */
function genPuzzle(diff,rng){
  const maxC=MAX_CELLS[diff]||22;
  const maxCols=MAX_COLS[diff]||11;
  const maxRows=MAX_ROWS[diff]||9;
  const fns=[shapePipe,shapeFrame,shapeCross,shapeComb,shapeSnake,shapeStair,shapeBlob];
  for(let attempt=0;attempt<120;attempt++){
    const fn=fns[Math.floor(rng()*fns.length)];
    const sh=fn(diff,rng,maxC);
    if(!sh||sh.cells.length<6||sh.cells.length%2!==0)continue;
    if(sh.cols>maxCols||sh.rows>maxRows)continue;
    const lv=buildPuzzle(sh.cells,sh.cols,sh.rows,rng);
    if(lv)return lv;
  }
  return buildPuzzle(allC(4,3),4,3,rng)||TUTORIAL[0];
}

function buildPuzzle(ac,cols,rows,rng){
  const setA=new Set(ac.map(([c,r])=>`${c},${r}`));
  const sorted=[...ac].sort((a,b)=>a[1]!==b[1]?a[1]-b[1]:a[0]-b[0]);
  const tOf={},placed=[];
  function tile(i){
    if(i>=sorted.length)return true;
    const[c,r]=sorted[i];const k=`${c},${r}`;if(tOf[k]!==undefined)return tile(i+1);
    const dirs=shu([[1,0],[0,1]],rng);
    for(const[dc,dr]of dirs){
      const k2=`${c+dc},${r+dr}`;if(!setA.has(k2)||tOf[k2]!==undefined)continue;
      const di=placed.length;tOf[k]=di;tOf[k2]=di;placed.push([[c,r],[c+dc,r+dr]]);
      if(tile(i+1))return true;
      placed.pop();delete tOf[k];delete tOf[k2];
    }
    return false;
  }
  if(!tile(0))return null;

  /* ── Zone BFS: small zones, 2–4 cells each ─────────────────
     Target ~n/2 zones so each zone ≈ 1 domino (2 cells).
     Cap at 5 zones for readability. */
  const nDom=placed.length;
  const zCount=Math.max(2,Math.min(5,Math.round(ac.length/3)));
  const zOf={};const sh2=shu([...ac],rng);const seeds=[];
  for(const cell of sh2){
    if(seeds.length>=zCount)break;
    if(seeds.every(s=>Math.abs(s[0]-cell[0])+Math.abs(s[1]-cell[1])>=3))seeds.push(cell);
  }
  if(seeds.length<2)return null;
  seeds.forEach(([c,r],i)=>{zOf[`${c},${r}`]=i;});
  const q=seeds.map(([c,r],i)=>({c,r,z:i}));let bi=0;
  while(bi<q.length){
    const{c,r,z}=q[bi++];
    for(const[nc,nr]of[[c+1,r],[c-1,r],[c,r+1],[c,r-1]]){
      const k2=`${nc},${nr}`;
      if(setA.has(k2)&&zOf[k2]===undefined){zOf[k2]=z;q.push({c:nc,r:nr,z});}
    }
  }
  ac.forEach(([c,r])=>{if(zOf[`${c},${r}`]===undefined)zOf[`${c},${r}`]=0;});

  /* ── Collect zone cells ── */
  const rCells=Array.from({length:zCount},()=>[]);
  ac.forEach(([c,r])=>rCells[zOf[`${c},${r}`]].push([c,r]));

  /* ── Helper: set pip value for a cell ── */
  const dVals=placed.map(()=>[0,0]);
  function setCell(c,r,v){
    const di=tOf[`${c},${r}`];const[[c0,r0]]=placed[di];
    dVals[di][(c===c0&&r===r0)?0:1]=v;
  }
  function getCell(c,r){
    const di=tOf[`${c},${r}`];const[[c0,r0]]=placed[di];
    return dVals[di][(c===c0&&r===r0)?0:1];
  }

  /* ── Assign pip values + rules together ─────────────────────
     Rule distribution (target): 30% eq · 20% neq · 25% sum · 12.5% gt · 12.5% lt
     We pick the rule FIRST then set values to match. */
  const RULE_WEIGHTS=[
    {type:'eq',  w:30},
    {type:'neq', w:20},
    {type:'sum', w:25},
    {type:'gt',  w:12},
    {type:'lt',  w:13},
  ];
  function pickType(){
    const total=RULE_WEIGHTS.reduce((s,x)=>s+x.w,0);
    let r2=rng()*total;
    for(const{type,w}of RULE_WEIGHTS){r2-=w;if(r2<=0)return type;}
    return'sum';
  }

  const regions=[];
  for(const cells of rCells){
    if(cells.length<2)continue;
    // Use all zone cells — no artificial cap
    const zoneCells=cells;
    const n=zoneCells.length;
    const type=pickType();

    if(type==='eq'){
      const v=rInt(1,5,rng);
      zoneCells.forEach(([c,r])=>setCell(c,r,v));
      regions.push({rule:{type:'eq'},cells:zoneCells});

    } else if(type==='neq'){
      // neq needs all distinct — only feasible for ≤6 cells (values 0-5)
      if(n>6){
        // fallback to sum for large zones
        const minS=n*1, maxS=n*4, target=rInt(minS,maxS,rng);
        let rem=target;
        zoneCells.forEach(([c,r],i)=>{
          const left=n-i-1;
          const lo=Math.max(0,rem-left*5),hi=Math.min(5,rem);
          const v=rInt(lo,hi,rng);setCell(c,r,v);rem-=v;
        });
        const realSum=zoneCells.reduce((a,[c,r])=>a+getCell(c,r),0);
        regions.push({rule:{type:'sum',v:realSum},cells:zoneCells});
      } else {
        const pool=shu([0,1,2,3,4,5].slice(0,Math.max(n,4)),rng).slice(0,n);
        zoneCells.forEach(([c,r],i)=>setCell(c,r,pool[i]));
        regions.push({rule:{type:'neq'},cells:zoneCells});
      }

    } else if(type==='sum'){
      const minS=n*1, maxS=n*4;
      const target=rInt(minS,maxS,rng);
      let rem=target;
      zoneCells.forEach(([c,r],i)=>{
        const left=n-i-1;
        const lo=Math.max(0,rem-left*5),hi=Math.min(5,rem);
        const v=rInt(lo,hi,rng);setCell(c,r,v);rem-=v;
      });
      const realSum=zoneCells.reduce((a,[c,r])=>a+getCell(c,r),0);
      regions.push({rule:{type:'sum',v:realSum},cells:zoneCells});

    } else if(type==='gt'){
      const target=rInt(Math.max(1,n*1),n*4,rng);
      let rem=target;
      zoneCells.forEach(([c,r],i)=>{
        const left=n-i-1;
        const lo=Math.max(0,rem-left*5),hi=Math.min(5,rem);
        const v=rInt(lo,hi,rng);setCell(c,r,v);rem-=v;
      });
      const realSum=zoneCells.reduce((a,[c,r])=>a+getCell(c,r),0);
      const thresh=Math.max(0,realSum-rInt(1,2,rng));
      regions.push({rule:{type:'gt',v:thresh},cells:zoneCells});

    } else { // lt
      const target=rInt(n*1,n*4,rng);
      let rem=target;
      zoneCells.forEach(([c,r],i)=>{
        const left=n-i-1;
        const lo=Math.max(0,rem-left*5),hi=Math.min(5,rem);
        const v=rInt(lo,hi,rng);setCell(c,r,v);rem-=v;
      });
      const realSum=zoneCells.reduce((a,[c,r])=>a+getCell(c,r),0);
      const thresh=Math.min(n*5,realSum+rInt(1,2,rng));
      regions.push({rule:{type:'lt',v:thresh},cells:zoneCells});
    }
  }
  if(regions.length<2)return null;

  // Fill any remaining cells not covered by a region with random values
  const coveredCells=new Set(regions.flatMap(r=>r.cells).map(([c,r])=>`${c},${r}`));
  placed.forEach(([[c1,r1],[c2,r2]],di)=>{
    if(!coveredCells.has(`${c1},${r1}`))dVals[di][0]=rInt(0,5,rng);
    if(!coveredCells.has(`${c2},${r2}`))dVals[di][1]=rInt(0,5,rng);
  });

  return{cols,rows,activeCells:ac.length===cols*rows?undefined:ac,dominoes:dVals,regions};
}

/* ══════════════════════════════════════════
   DAILY — seed from today's date + difficulty index
   Same date+diff → same seed → same puzzle for ALL users
══════════════════════════════════════════ */
const DIFFS=['easy','med','hard'];
const DIFF_LABELS={easy:'EASY',med:'MEDIUM',hard:'HARD'};
const DIFF_STARS={easy:'★☆☆',med:'★★☆',hard:'★★★'};

function getDailyLevel(diff){
  const idx=DIFFS.indexOf(diff);
  const rng=mkRng(dateSeed(0,idx));
  const lv=genPuzzle(diff,rng);
  lv.name='DAILY '+(DIFF_LABELS[diff]||diff);
  lv.diff=diff;lv.isDaily=true;lv.dailyDiff=diff;
  return lv;
}

let openSub=null;
function toggleSub(id){
  if(openSub&&openSub!==id){
    $(openSub+'-panel').classList.remove('open');
    $(openSub+'-arr').classList.remove('open');
  }
  const panel=$(id+'-panel'),arr=$(id+'-arr');
  const isOpen=panel.classList.toggle('open');
  arr.classList.toggle('open',isOpen);
  openSub=isOpen?id:null;
  if(isOpen){
    if(id==='tut'&&!panel.children.length)buildTutPanel();

function buildTutPanel(){

function buildDayPanel(){
  const p=$('day-panel');
  DIFFS.forEach(diff=>{

    const inProgress=!!prog&&prog.usedDom.length>0;
    const card=document.createElement('div');card.className='sub-card';
    let meta,bg,border,badgeTxt,starsTxt='';
    if(done){
      meta=`пройдено · ✓ ${fmtT(record.secs)}`;
      bg='rgba(60,150,60,.12)';border='rgba(60,150,60,.3)';badgeTxt='✓';
    } else if(inProgress){
      meta=`в процессе · ${prog.usedDom.length}/${JSON.parse(JSON.stringify(getDailyLevel(diff))).dominoes.length} · ⏱ ${fmtT(prog.secs)}`;
      bg='rgba(200,150,60,.1)';border='rgba(200,150,60,.4)';badgeTxt='▶';starsTxt=DIFF_STARS[diff];
    } else {
      meta='одинаков для всех · сменится завтра';
      bg='';border='rgba(200,150,60,.18)';badgeTxt=DIFF_LABELS[diff][0];starsTxt=DIFF_STARS[diff];
    }
    card.style.cssText=`background:${bg};border-color:${border};`;
    card.innerHTML=`<div class="sc-badge ${diff}">${badgeTxt}</div>
      <div class="sc-info"><div class="sc-name">${DIFF_LABELS[diff]}</div>
      <div class="sc-meta">${meta}</div></div>
      <span class="sc-stars">${starsTxt}</span>`;

/* ══ DAILY PROGRESS (pause/resume) ══ */
function progressKey(diff){const dk=dailyKey(diff);return`pips_prog_${diff}_${dk.slice(dk.lastIndexOf('_')+1)}`;}
function saveGameProgress(){
  if(!puzzle?.isDaily||puzzle.viewOnly)return;
  try{
    localStorage.setItem(progressKey(puzzle.dailyDiff),JSON.stringify({
      board,placements,usedDom:[...usedDom],secs:timerSecs
    }));
  }catch(e){}
}
function loadGameProgress(diff){
  try{return JSON.parse(localStorage.getItem(progressKey(diff)))||null;}catch(e){return null;}
}
function clearGameProgress(diff){
  try{localStorage.removeItem(progressKey(diff));}catch(e){}
}
function restoreGameProgress(state){
  board=state.board;
  placements={};
  Object.entries(state.placements).forEach(([k,v])=>{placements[+k]=v;});
  usedDom=new Set(state.usedDom.map(Number));
  timerSecs=state.secs;
  $('timer').textContent=fmtT(timerSecs);
  renderBoard();
  puzzle.dominoes.forEach((_,di)=>{
    slotEls[di]?.classList.toggle('used',usedDom.has(di));
    if(!usedDom.has(di))refreshHT(di);
  });
  updateCtrl();
  setSt(`${usedDom.size}/${puzzle.dominoes.length} размещено · прогресс восстановлен`);
}

function pauseGame(){
  tStop();saveGameProgress();
  const sub=puzzle?.isDaily?`${usedDom.size}/${puzzle.dominoes.length} домино · ⏱ ${fmtT(timerSecs)}`:'';
  $('pause-sub').textContent=sub||'Прогресс сохранён';
  $('pause-ov').classList.add('on');
}
function resumeGame(){
  $('pause-ov').classList.remove('on');
  if(usedDom.size>0&&!timerOn)tStart();
}
function confirmResetPuzzle(){
  if(puzzle?.isDaily)clearGameProgress(puzzle.dailyDiff);
  resetPuzzle();
  $('pause-ov').classList.remove('on');
}
function goMenu(){
  saveGameProgress();
  $('win-ov').classList.remove('on');$('pause-ov').classList.remove('on');
  tStop();showScreen('menu');
}
function startRandom(diff){
  diff=diff||(DIFFS[Math.floor(Math.random()*3)]);
  const lv=genPuzzle(diff,()=>Math.random());
  lv.name='СЛУЧАЙНЫЙ';lv.diff=diff;lv.isRandom=true;lv.randomDiff=diff;
  startLevel(lv);
}
function regenRandom(){
  const diff=puzzle?.randomDiff||'med';
  $('win-ov').classList.remove('on');
  tReset();
  startRandom(diff);
}
function winNext(){
  $('win-ov').classList.remove('on');
  if(puzzle.isDaily)goMenu();
  else startRandom(puzzle.randomDiff);
}
let editorInitialized=false;
function openEditor(){
  if(!editorInitialized){initEditor();editorInitialized=true;}
  else{buildSavedPanel();} // refresh saved list only
  showScreen('editor');
}
function startLevel(lv){
  puzzle=JSON.parse(JSON.stringify(lv));
  board={};placements={};usedDom=new Set();
  selMode=null;selDi=null;orientIdx=0;
  tReset();buildGame();showScreen('game');
  // Auto-restore daily progress if exists
  if(puzzle.isDaily&&!puzzle.viewOnly){
    const prog=loadGameProgress(puzzle.dailyDiff);
    if(prog&&prog.usedDom&&prog.usedDom.length>0){
      restoreGameProgress(prog);
      // don't auto-start timer — user resumes manually or by placing a piece
    }
  }
}
function showScreen(n){
  ['menu','game','editor'].forEach(s=>$(s).classList.toggle('hidden',s!==n));
}

/* ══════════════════════════════════════════
   GAME STATE
══════════════════════════════════════════ */
let puzzle=null,board={},placements={},usedDom=new Set();
let selMode=null,selDi=null,orientIdx=0;
let CELL=46,GAP=4,STEP=50;
let cellEls={},cellReg={},zOvEls={},activeSet=new Set(),slotEls=[],tileEls=[];
let timerSecs=0,timerIv=null,timerOn=false;
function tStart(){if(timerOn)return;timerOn=true;timerIv=setInterval(()=>{timerSecs++;$('timer').textContent=fmtT(timerSecs);},1000);}
function tStop(){clearInterval(timerIv);timerIv=null;}
function tReset(){tStop();timerSecs=0;timerOn=false;$('timer').textContent='00:00';}

/* ══ BUILD GAME — fits grid to screen, scroll if needed ══ */
function buildGame(){
  $('gtitle').textContent=puzzle.name||'PIPS';
  const b=$('gbadge');b.className='game-badge '+(puzzle.diff||'rnd');
  b.textContent=puzzle.viewOnly?'✓ ПРОЙДЕНО':(DIFF_LABELS[puzzle.diff]||'RANDOM');
  // Show regen button only for random levels
  $('btn-regen').style.display=puzzle.isRandom?'':'none';

  // VIEW-ONLY mode for already-completed dailies
  if(puzzle.viewOnly){
    const rec=getDailyRecord(puzzle.dailyDiff);
    $('win-ov').classList.remove('on');
    // Show completed overlay after brief delay so layout renders
    setTimeout(()=>{
      $('wtime').textContent=rec?fmtT(rec.secs):'—';
      $('wsub').textContent=`${puzzle.name} · уже пройден ✓`;
      $('wshare-btn').style.display='';
      const d=new Date();
      const mo=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
      $('wshare-btn').dataset.report=`Pips Daily ${DIFF_LABELS[puzzle.dailyDiff]} · ${d.getDate()} ${mo}\n⏱ ${rec?fmtT(rec.secs):'—'}\n✦ ${puzzle.dominoes.length} костяшек`;
      $('win-ov').classList.add('on');
    },200);
  }

  // ── Screen fit: compute CELL to fit height; allow horizontal scroll ──
  const nDom=puzzle.dominoes.length;
  const handRows=Math.ceil(nDom/5);
  const slotPx=64;
  const handH=Math.min(handRows*slotPx+8,200); // match CSS max-height:200px
  const headerH=50,legendH=puzzle.regions.length>0?30:0;
  const statusH=16,controlsH=38,padH=20,gridBorder=14;
  const reservedH=headerH+legendH+statusH+controlsH+handH+padH+gridBorder;
  const availH=window.innerHeight-reservedH;
  const availW=Math.min(window.innerWidth,500)-20-gridBorder;

  // Scale by height primarily; allow width to scroll
  const cellByH=availH>60?Math.floor((availH+GAP)/puzzle.rows)-GAP:40;
  const cellByW=Math.floor((availW+GAP)/puzzle.cols)-GAP;
  CELL=Math.max(24,Math.min(58,Math.min(cellByH,cellByW)));
  STEP=CELL+GAP;

  activeSet.clear();
  const ac=puzzle.activeCells||allC(puzzle.cols,puzzle.rows);
  ac.forEach(([c,r])=>activeSet.add(`${c},${r}`));
  cellReg={};puzzle.regions.forEach((rg,i)=>rg.cells.forEach(([c,r])=>{cellReg[`${c},${r}`]=i;}));

  // Legend
  const lg=$('legend');lg.innerHTML='';
  puzzle.regions.forEach((rg,i)=>{
    if(rg.rule.type==='none')return;
    const col=ZC[i%ZC.length];const d=document.createElement('div');d.className='lg';
    d.innerHTML=`<div class="lg-dot" style="background:${col.bg};border-color:${col.bd}"></div><span>${rT(rg.rule)}</span>`;
    lg.appendChild(d);
  });

  // Grid
  const grid=$('grid');grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${puzzle.cols},${CELL}px)`;
  grid.style.gridTemplateRows=`repeat(${puzzle.rows},${CELL}px)`;
  grid.style.gap=GAP+'px';cellEls={};
  for(let r=0;r<puzzle.rows;r++){
    for(let c=0;c<puzzle.cols;c++){
      const key=`${c},${r}`;const cell=document.createElement('div');
      cell.style.width=CELL+'px';cell.style.height=CELL+'px';cell.dataset.c=c;cell.dataset.r=r;
      if(activeSet.has(key)){
        cell.className='cell active';const ri2=cellReg[key];
        if(ri2!==undefined){const col=ZC[ri2%ZC.length];cell.style.background=col.bg;cell.style.borderColor=col.bd;cell.style.borderStyle='solid';cell.style.borderWidth='2px';}
        cell.onclick=()=>onCellClick(c,r);cellEls[key]=cell;
      } else cell.className='cell inactive';
      grid.appendChild(cell);
    }
  }
  buildZoneOv();buildRuleOv();buildHand();
  $('dom-layer').innerHTML='';renderBoard();updateCtrl();
  setSt('Тап = выбрать/повернуть  ·  удержание = перетащить');
}

function buildZoneOv(){
  const ov=$('zone-overlay');ov.innerHTML='';zOvEls={};const M=3;
  puzzle.regions.forEach((rg,i)=>{
    const col=ZC[i%ZC.length];
    rg.cells.forEach(([c,r])=>{
      const key=`${c},${r}`;const div=document.createElement('div');div.className='zo';
      div.style.cssText=`left:${c*STEP+M}px;top:${r*STEP+M}px;width:${CELL-M*2}px;height:${CELL-M*2}px;border-color:${col.bd};`;
      ov.appendChild(div);zOvEls[key]=div;
    });
  });
}
function buildRuleOv(){
  const ov=$('rule-overlay');ov.innerHTML='';
  const gridW=puzzle.cols*STEP-GAP;
  puzzle.regions.forEach((rg,i)=>{
    const s=rS(rg.rule);if(!s)return;
    // Position badge at top-right corner of the zone's bounding box, clamped inside grid
    const maxC=Math.max(...rg.cells.map(([c])=>c));
    const minR=Math.min(...rg.cells.map(([,r])=>r));
    const badge=document.createElement('div');badge.className='rb';badge.textContent=s;
    const col=ZC[i%ZC.length];badge.style.borderColor=col.bd;badge.style.color=col.bd;badge.style.background=col.bg;
    // Temporarily append to measure width
    badge.style.visibility='hidden';ov.appendChild(badge);
    const bw=badge.offsetWidth||30;badge.style.visibility='';
    // Right-align to the right edge of maxC cell, but clamp so badge doesn't overflow grid
    let left=(maxC+1)*STEP-GAP/2;
    left=Math.min(left,gridW-bw/2);
    left=Math.max(bw/2,left);
    badge.style.left=left+'px';
    badge.style.top=(minR*STEP+2)+'px';
    badge.style.transform='translate(-50%,0)';
  });
}

/* ══ HAND ══ */
const H_SZ=20; // smaller base pip size for hand slots
function domSz(oi,sz){const isV=oi===1||oi===3,pd=Math.max(3,Math.round(sz*.18)),long=sz*2+2+6+pd*2+2,thin=sz+pd*2+4;return isV?{w:thin,h:long}:{w:long,h:thin};}
function buildHand(){
  const hand=$('hand');hand.innerHTML='';slotEls=[];tileEls=[];
  puzzle.dominoes.forEach(([a,b],di)=>{
    const slot=document.createElement('div');slot.className='hand-slot';if(usedDom.has(di))slot.classList.add('used');
    const tile=document.createElement('div');tile.className='dom-tile';
    const{w,h}=domSz(0,H_SZ);fillTile(tile,a,b,0,H_SZ,w,h);
    slot.appendChild(tile);attachGesture(slot,di,'hand');hand.appendChild(slot);slotEls.push(slot);tileEls.push(tile);
  });
}
function refreshHT(di){
  if(usedDom.has(di))return;
  const[a,b]=puzzle.dominoes[di];const oi=selDi===di?orientIdx:0;const{w,h}=domSz(oi,H_SZ);
  fillTile(tileEls[di],a,b,oi,H_SZ,w,h);
}

/* ══ GESTURES — tap=select/rotate · swipe=drag immediately ══ */
const HOLD_MS=250,MOVE_PX=6;let pSt=null;
function makeHoldRing(el){const r=document.createElement('div');r.className='hold-ring';el.appendChild(r);requestAnimationFrame(()=>r.classList.add('go'));return r;}
function removeHoldRing(el){el.querySelectorAll('.hold-ring').forEach(r=>r.remove());}
function attachGesture(el,di,src){el.addEventListener('pointerdown',e=>{if(src==='hand'&&usedDom.has(di))return;e.preventDefault();startPress(e,di,src);},{passive:false});}
function startPress(e,di,src){
  cancelPress();
  const ring=makeHoldRing(e.currentTarget);
  const startX=e.clientX,startY=e.clientY,startE=e;
  let drag=false;
  const tmr=setTimeout(()=>{
    if(drag)return;drag=true;ring.remove();
    if(src==='grid'&&!(selMode==='grid'&&selDi===di))selGridTile(di);
    else if(src==='hand'&&!(selMode==='hand'&&selDi===di))selHandTile(di);
    startDrag(startE,di);
  },HOLD_MS);
  pSt={di,src,tmr,drag:()=>drag,setDrag:(v)=>{drag=v;},startX,startY,startE,el:e.currentTarget};
  document.addEventListener('pointermove',onPM,{passive:false});
  document.addEventListener('pointerup',onPU,{once:true});
  document.addEventListener('pointercancel',onPC,{once:true});
}
function onPM(e){
  if(!pSt||pSt.drag())return;
  if(Math.hypot(e.clientX-pSt.startX,e.clientY-pSt.startY)>MOVE_PX){
    clearTimeout(pSt.tmr);pSt.setDrag(true);removeHoldRing(pSt.el);
    const{di,src}=pSt;
    if(src==='grid'&&!(selMode==='grid'&&selDi===di))selGridTile(di);
    else if(src==='hand'&&!(selMode==='hand'&&selDi===di))selHandTile(di);
    startDrag({clientX:e.clientX,clientY:e.clientY},di);
  }
}
function onPU(){
  if(!pSt)return;
  document.removeEventListener('pointermove',onPM);
  document.removeEventListener('pointercancel',onPC);
  const wasDrag=pSt.drag();
  const{di,src}=pSt;
  clearTimeout(pSt.tmr);removeHoldRing(pSt.el);pSt=null;
  if(!wasDrag)onTap(di,src);
}
function onPC(){cancelPress();if(isDrag)endDrag();}
function cancelPress(){
  if(!pSt)return;
  clearTimeout(pSt.tmr);removeHoldRing(pSt.el);
  document.removeEventListener('pointermove',onPM);
  document.removeEventListener('pointerup',onPU);
  document.removeEventListener('pointercancel',onPC);
  pSt=null;
}
function onTap(di,src){
  if(src==='hand'){if(usedDom.has(di))return;if(selDi===di&&selMode==='hand')doRotate();else selHandTile(di);}
  else{if(selDi===di&&selMode==='grid')doRotate();else selGridTile(di);}
}

/* ══ SELECTION ══ */
function selHandTile(di){clearSelVis();selMode='hand';selDi=di;slotEls[di].classList.add('sel');refreshHT(di);updateCtrl();setSt('Выбрано · тап ещё раз = повернуть · тащи = разместить');}
function selGridTile(di){clearSelVis();selMode='grid';selDi=di;orientIdx=placements[di].oi;slotEls[di].classList.add('sel');renderBoard();updateCtrl();setSt('Выбрано · тап = повернуть · ↑ В РУКУ · тащи = переместить');}
function clearSelVis(){if(selDi!==null){slotEls[selDi]?.classList.remove('sel');if(!usedDom.has(selDi))refreshHT(selDi);}}
function clearSel(){clearSelVis();selMode=null;selDi=null;clearHL();updateCtrl();setSt('Тап = выбрать/повернуть · удержание = перетащить');}

/* ══ ROTATE ══ */
function doRotate(){
  if(selDi===null)return;const newOi=(orientIdx+1)%4;
  if(selMode==='hand'){orientIdx=newOi;refreshHT(selDi);updateCtrl();}
  else{
    const{c,r,oi:oldOi}=placements[selDi];
    const oldK1=`${c},${r}`,oldK2=`${c+ORI[oldOi].dc},${r+ORI[oldOi].dr}`,newK2=`${c+ORI[newOi].dc},${r+ORI[newOi].dr}`;
    if(activeSet.has(newK2)&&(!board[newK2]||board[newK2].di===selDi)){
      const di=selDi;const{h1,h2}=halves(newOi);
      delete board[oldK1];delete board[oldK2];board[oldK1]={di,half:h1};board[newK2]={di,half:h2};
      placements[di]={c,r,oi:newOi};orientIdx=newOi;updateCtrl();renderBoard();validate();
    } else {
      // Lift to hand with new orientation
      const di=selDi;delete board[oldK1];delete board[oldK2];delete placements[di];usedDom.delete(di);
      orientIdx=newOi;clearSelVis();selMode='hand';selDi=di;
      slotEls[di].classList.remove('used');slotEls[di].classList.add('sel');
      refreshHT(di);updateCtrl();renderBoard();setSt('Повёрнуто — выбери новое место');
    }
  }
}
function doLift(){
  if(selMode!=='grid'||selDi===null)return;const di=selDi;const{c,r,oi}=placements[di];
  delete board[`${c},${r}`];delete board[`${c+ORI[oi].dc},${r+ORI[oi].dr}`];delete placements[di];usedDom.delete(di);clearSelVis();
  selMode='hand';selDi=di;slotEls[di].classList.remove('used');slotEls[di].classList.add('sel');refreshHT(di);updateCtrl();renderBoard();setSt('В руку');
}

/* ══ PLACEMENT ══ */
function onCellClick(c,r){
  const key=`${c},${r}`;if(board[key]){onTap(board[key].di,'grid');return;}
  if(selDi===null){setSt('Нажмите на костяшку — она выделится');return;}
  const[c2,r2]=sec2(c,r,orientIdx);if(!canPlace(c,r,c2,r2))return;
  if(selMode==='hand')placeFromHand(selDi,c,r);else moveGridTile(selDi,c,r);
}
function canPlace(c,r,c2,r2,msg=true){
  const k=`${c},${r}`,k2=`${c2},${r2}`;
  if(!activeSet.has(k)){if(msg)setSt('Клетка неактивна');return false;}
  if(!activeSet.has(k2)){if(msg)setSt('Нет соседней клетки — повернуть?');return false;}
  const src=selMode==='grid'?new Set(Object.keys(board).filter(bk=>board[bk].di===selDi)):new Set();
  if(board[k]&&!src.has(k)){if(msg)setSt('Клетка занята');return false;}
  if(board[k2]&&!src.has(k2)){if(msg)setSt('Соседняя занята');return false;}
  return true;
}
function placeFromHand(di,c,r){
  const oi=orientIdx;const{dc,dr}=ORI[oi];const{h1,h2}=halves(oi);
  board[`${c},${r}`]={di,half:h1};board[`${c+dc},${r+dr}`]={di,half:h2};placements[di]={c,r,oi};usedDom.add(di);
  const[a,b]=puzzle.dominoes[di];const{w,h}=domSz(0,H_SZ);fillTile(tileEls[di],a,b,0,H_SZ,w,h);
  slotEls[di].classList.remove('sel');slotEls[di].classList.add('used');
  selMode=null;selDi=null;clearHL();updateCtrl();tStart();renderBoard();validate();
}
function moveGridTile(di,c,r){
  const old=placements[di];delete board[`${old.c},${old.r}`];delete board[`${old.c+ORI[old.oi].dc},${old.r+ORI[old.oi].dr}`];
  const oi=orientIdx;const{dc,dr}=ORI[oi];const{h1,h2}=halves(oi);
  board[`${c},${r}`]={di,half:h1};board[`${c+dc},${r+dr}`]={di,half:h2};placements[di]={c,r,oi};
  clearSelVis();selMode=null;selDi=null;clearHL();updateCtrl();renderBoard();validate();
}
function resetPuzzle(){
  board={};placements={};usedDom.clear();tReset();selMode=null;selDi=null;orientIdx=0;
  puzzle.dominoes.forEach(([a,b],di)=>{slotEls[di]?.classList.remove('sel','used');const{w,h}=domSz(0,H_SZ);fillTile(tileEls[di],a,b,0,H_SZ,w,h);});
  clearHL();updateCtrl();renderBoard();setSt('Сброс.');
}
function updateCtrl(){$('btn-rot').disabled=selDi===null;$('btn-lift').style.display=selMode==='grid'?'':'none';$('opill').textContent=selDi!==null?ORI[orientIdx].l:'—';}

/* ══ RENDER ══ */
function renderBoard(){
  const layer=$('dom-layer');layer.innerHTML='';Object.values(cellEls).forEach(el=>el.classList.remove('win-c'));
  const M=Math.max(2,Math.round(CELL*.06));
  const gPip=Math.max(14,Math.min(36,Math.round(CELL*.52))); // scale pip to cell
  Object.entries(placements).forEach(([di_s,{c,r,oi}])=>{
    const di=+di_s;const[a,b]=puzzle.dominoes[di];const isV=oi===1||oi===3;
    const tW=isV?CELL-M*2:CELL*2+GAP-M*2,tH=isV?CELL*2+GAP-M*2:CELL-M*2;
    const tile=document.createElement('div');tile.className='dom-tile placed'+(selMode==='grid'&&selDi===di?' gsel':'');
    tile.dataset.di=di;tile.style.left=(c*STEP+M)+'px';tile.style.top=(r*STEP+M)+'px';
    tile.style.pointerEvents='auto';fillTile(tile,a,b,oi,gPip,tW,tH);attachGesture(tile,di,'grid');layer.appendChild(tile);
  });
}

let hlKeys=[];
function clearHL(){hlKeys.forEach(k=>cellEls[k]?.classList.remove('hl-ok','hl-bad'));hlKeys=[];}
function hlPrev(c,r){
  clearHL();if(selDi===null)return;const k=`${c},${r}`;const[c2,r2]=sec2(c,r,orientIdx);const k2=`${c2},${r2}`;
  const src=selMode==='grid'?new Set(Object.keys(board).filter(bk=>board[bk].di===selDi)):new Set();
  const ok=activeSet.has(k)&&activeSet.has(k2)&&(!board[k]||src.has(k))&&(!board[k2]||src.has(k2));
  cellEls[k]?.classList.add(ok?'hl-ok':'hl-bad');if(ok)cellEls[k2]?.classList.add('hl-ok');hlKeys=[k,k2];
}
$('grid').addEventListener('pointermove',e=>{if(isDrag||!selDi)return;const el=e.target.closest?.('.cell.active');if(el)hlPrev(+el.dataset.c,+el.dataset.r);},{passive:true});
$('grid-wrap').addEventListener('pointerleave',()=>{if(!isDrag)clearHL();});

/* ══ DAILY TRACKING ══ */
function dailyKey(diff){const d=new Date();return`pips_daily_${d.getFullYear()}_${String(d.getMonth()+1).padStart(2,'0')}_${String(d.getDate()).padStart(2,'0')}_${diff}`;}
function getDailyRecord(diff){try{return JSON.parse(localStorage.getItem(dailyKey(diff)))||null;}catch(e){return null;}}
function saveDailyRecord(diff,secs){
  try{localStorage.setItem(dailyKey(diff),JSON.stringify({secs,ts:Date.now()}));}catch(e){}
}

/* ══ VALIDATE ══ */
function validate(){
  if(puzzle.viewOnly)return; // already-completed daily — don't validate
  Object.values(zOvEls).forEach(el=>el.classList.remove('err'));
  if(usedDom.size<puzzle.dominoes.length){setSt(`${usedDom.size}/${puzzle.dominoes.length} размещено`);return;}
  const errs=[];
  puzzle.regions.forEach((rg,i)=>{
    if(rg.rule.type==='none')return;
    const vals=rg.cells.map(([c,r])=>{const info=board[`${c},${r}`];if(!info)return null;const[a,b]=puzzle.dominoes[info.di];return info.half==='a'?a:b;}).filter(v=>v!==null);
    if(!chk(rg.rule,vals))errs.push(i);
  });
  if(!errs.length){
    Object.values(cellEls).forEach(el=>el.classList.add('win-c'));tStop();
    const t=fmtT(timerSecs);
    $('wtime').textContent=t;
    $('wsub').textContent=`${puzzle.name} · ${puzzle.dominoes.length} костяшек`;
    // Save daily record if this is a daily level
    if(puzzle.isDaily){
      saveDailyRecord(puzzle.dailyDiff,timerSecs);
      $('wshare-btn').style.display='';
      const d=new Date();
      const mo=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'][d.getMonth()];
      $('wshare-btn').dataset.report=`Pips Daily ${DIFF_LABELS[puzzle.dailyDiff]} · ${d.getDate()} ${mo}\n⏱ ${t}\n✦ ${puzzle.dominoes.length} костяшек`;
    } else {
      $('wshare-btn').style.display='none';
    }
    $('win-ov').classList.add('on');
    tg?.HapticFeedback?.notificationOccurred('success');
  } else {
    errs.forEach(i=>{puzzle.regions[i].cells.forEach(([c,r])=>{const el=zOvEls[`${c},${r}`];if(el)el.classList.add('err');});});
    $('status').innerHTML=`❌ ${errs.map(i=>`<span style="color:${ZC[i%ZC.length].bd}">${rS(puzzle.regions[i].rule)}</span>`).join(' · ')}`;
  }
}
function shareReport(){
  const txt=$('wshare-btn').dataset.report||'';
  if(tg?.shareText)tg.shareText(txt);
  else if(navigator.share)navigator.share({text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>{$('wsub').textContent='✓ Скопировано!';});
}
function setSt(msg){$('status').textContent=msg;}

/* ══ DRAG ══ */
let isDrag=false,dragDi=-1;const ghost=$('ghost');
function startDrag(e,di){
  isDrag=true;dragDi=di;const[a,b]=puzzle.dominoes[di];const gSz=H_SZ+4;const{w,h}=domSz(orientIdx,gSz);
  fillTile(ghost,a,b,orientIdx,gSz,w,h);ghost.classList.add('on');mghost(e.clientX,e.clientY);
  document.addEventListener('pointermove',onDM,{passive:true});document.addEventListener('pointerup',onDU,{once:true});
}
function mghost(x,y){ghost.style.left=(x-50)+'px';ghost.style.top=(y-30)+'px';}
function onDM(e){if(!isDrag)return;mghost(e.clientX,e.clientY);ghost.style.visibility='hidden';const el=document.elementFromPoint(e.clientX,e.clientY);ghost.style.visibility='';const cell=el?.closest?.('.cell.active');if(cell)hlPrev(+cell.dataset.c,+cell.dataset.r);else clearHL();}
function onDU(e){
  if(!isDrag)return;clearHL();ghost.style.visibility='hidden';const el=document.elementFromPoint(e.clientX,e.clientY);ghost.style.visibility='';
  const cell=el?.closest?.('.cell.active');
  if(cell){
    const c=+cell.dataset.c,r=+cell.dataset.r;const[c2,r2]=sec2(c,r,orientIdx);
    const src=selMode==='grid'?new Set(Object.keys(board).filter(bk=>board[bk].di===dragDi)):new Set();
    const k=`${c},${r}`,k2=`${c2},${r2}`;
    if(activeSet.has(k)&&activeSet.has(k2)&&(!board[k]||src.has(k))&&(!board[k2]||src.has(k2))){
      if(selMode==='grid')moveGridTile(dragDi,c,r);else placeFromHand(dragDi,c,r);
    } else setSt('Нельзя — другое место или поверни');
  }
  endDrag();cancelPress();
}
function endDrag(){isDrag=false;ghost.classList.remove('on');document.removeEventListener('pointermove',onDM);}

/* ══ EDITOR STATE ══ */
let edCols=6,edRows=4,edActive=new Set(),edZones=[],edSelZone=0,edEditMode='cells',edGeneratedLevel=null;
let edHistory=[],edHistoryIdx=-1; // undo/redo stack

/* ── Snapshot helpers ── */
function edSnapshot(){
  // Save current state; trim redo tail
  const snap={
    active:new Set(edActive),
    zones:edZones.map(z=>({cells:new Set(z.cells),rule:{...z.rule}})),
    cols:edCols,rows:edRows
  };
  edHistory=edHistory.slice(0,edHistoryIdx+1);
  edHistory.push(snap);
  if(edHistory.length>60)edHistory.shift();
  edHistoryIdx=edHistory.length-1;
  edUpdateUndoRedo();
}
function edRestoreSnap(snap){
  edCols=snap.cols;edRows=snap.rows;
  edActive=new Set(snap.active);
  edZones=snap.zones.map(z=>({cells:new Set(z.cells),rule:{...z.rule}}));
  if(edSelZone>=edZones.length)edSelZone=edZones.length-1;
  $('ed-cols-lbl').textContent=edCols;$('ed-rows-lbl').textContent=edRows;
  edGeneratedLevel=null;renderEdGrid();renderZonePicker();
}
function edUndo(){
  if(edHistoryIdx<=0)return;
  edHistoryIdx--;edRestoreSnap(edHistory[edHistoryIdx]);edUpdateUndoRedo();
}
function edRedo(){
  if(edHistoryIdx>=edHistory.length-1)return;
  edHistoryIdx++;edRestoreSnap(edHistory[edHistoryIdx]);edUpdateUndoRedo();
}
function edUpdateUndoRedo(){
  $('btn-undo').disabled=edHistoryIdx<=0;
  $('btn-redo').disabled=edHistoryIdx>=edHistory.length-1;
}

function initEditor(){
  edCols=6;edRows=4;edEditMode='cells';edSelZone=0;edGeneratedLevel=null;
  edHistory=[];edHistoryIdx=-1;
  edActive=new Set(allC(edCols,edRows).map(([c,r])=>`${c},${r}`));
  edZones=[
    {cells:new Set(),rule:{type:'sum',v:4}},
    {cells:new Set(),rule:{type:'eq'}},
    {cells:new Set(),rule:{type:'sum',v:6}},
  ];
  $('ed-cols-lbl').textContent=edCols;$('ed-rows-lbl').textContent=edRows;
  $('tab-cells').classList.add('active');$('tab-zones').classList.remove('active');
  $('zone-panel').style.display='none';
  edSnapshot(); // initial snapshot
  renderEdGrid();renderZonePicker();buildSavedPanel();
  $('ed-status').textContent='Тап = вкл/выкл · удержи = рисовать · Зоны → раскрась области';
}

function edResize(dc,dr){
  edCols=Math.max(2,Math.min(12,edCols+dc));
  edRows=Math.max(2,Math.min(8,edRows+dr));
  $('ed-cols-lbl').textContent=edCols;$('ed-rows-lbl').textContent=edRows;
  const prune=k=>{const[c,r]=k.split(',').map(Number);return c>=edCols||r>=edRows;};
  for(const k of [...edActive])if(prune(k))edActive.delete(k);
  edZones.forEach(z=>{for(const k of [...z.cells])if(prune(k))z.cells.delete(k);});
  edGeneratedLevel=null;edSnapshot();renderEdGrid();
}

function edMode(m){
  edEditMode=m;
  $('tab-cells').classList.toggle('active',m==='cells');
  $('tab-zones').classList.toggle('active',m==='zones');
  $('zone-panel').style.display=m==='zones'?'':'none';
  $('ed-status').textContent=m==='cells'?'Тап/удержи = рисовать/стирать клетки':'Выбери зону → тап/рисуй клетки';
}

/* Paint mode */
let edPaintActive=false,edPaintVal=null;
function renderEdGrid(){
  const edCell=Math.max(26,Math.min(46,Math.floor((window.innerWidth-48)/edCols)));
  const g=$('ed-grid');
  g.style.gridTemplateColumns=`repeat(${edCols},${edCell}px)`;
  g.style.gridTemplateRows=`repeat(${edRows},${edCell}px)`;
  g.style.gap='3px';g.innerHTML='';

  // Build pip value map from generated level (for preview)
  const pipMap={};
  if(edGeneratedLevel){
    const lv=edGeneratedLevel;
    const ac2=lv.activeCells||allC(lv.cols,lv.rows);
    const placed2=[];
    const tOf2={};
    // reconstruct placements from domino list (same order as buildPuzzleWithZones)
    const sorted2=[...ac2].sort((a,b)=>a[1]!==b[1]?a[1]-b[1]:a[0]-b[0]);
    // We can't re-derive placements easily; use region cells to show pip values
    lv.regions.forEach(rg=>{
      // we don't have per-cell values here easily without re-running generation
    });
    // Alternative: show pip values from dominoes if we stored them
    if(lv._cellVals){
      Object.entries(lv._cellVals).forEach(([k,v])=>{pipMap[k]=v;});
    }
  }

  for(let r=0;r<edRows;r++){
    for(let c=0;c<edCols;c++){
      const k=`${c},${r}`;
      const el=document.createElement('div');el.className='ed-cell';
      el.style.width=el.style.height=edCell+'px';
      el.dataset.c=c;el.dataset.r=r;
      const isActive=edActive.has(k);
      const zi=edZones.findIndex(z=>z.cells.has(k));
      if(!isActive){el.classList.add('ec-inactive');}
      else if(zi>=0){
        const col=ZC[zi%ZC.length];
        el.style.background=col.bg;el.style.borderColor=col.bd;
        el.style.borderStyle='solid';el.style.borderWidth='2px';
        // Show pip value if preview available
        if(pipMap[k]!==undefined){
          const pip=document.createElement('div');
          pip.style.cssText=`font-size:${Math.max(9,edCell*.28)}px;font-weight:700;color:${col.bd};position:absolute;bottom:2px;right:3px;`;
          pip.textContent=pipMap[k];el.style.position='relative';el.appendChild(pip);
        }
      } else {el.classList.add('ec-free');}
      g.appendChild(el);
    }
  }

  // Pointer events — paint mode
  g.onpointerdown=e=>{
    e.preventDefault();
    const el=e.target.closest('.ed-cell');if(!el)return;
    const c=+el.dataset.c,r=+el.dataset.r,k=`${c},${r}`;
    edPaintActive=true;
    if(edEditMode==='cells'){edPaintVal=!edActive.has(k);}
    else{edPaintVal=!edZones[edSelZone]?.cells.has(k);}
    edApplyPaint(c,r,false); // false = don't snapshot yet
  };
  g.onpointermove=e=>{
    if(!edPaintActive)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const cell=el?.closest?.('.ed-cell');if(!cell)return;
    edApplyPaint(+cell.dataset.c,+cell.dataset.r,false);
  };
  g.onpointerup=g.onpointercancel=()=>{
    if(edPaintActive){edPaintActive=false;edPaintVal=null;edSnapshot();}
  };
}

function edApplyPaint(c,r,snap=true){
  const k=`${c},${r}`;
  if(edEditMode==='cells'){
    if(edPaintVal){edActive.add(k);}
    else{edActive.delete(k);edZones.forEach(z=>z.cells.delete(k));}
  } else {
    if(!edActive.has(k))return;
    const z=edZones[edSelZone];if(!z)return;
    if(edPaintVal){edZones.forEach((oz,i)=>{if(i!==edSelZone)oz.cells.delete(k);});z.cells.add(k);}
    else{z.cells.delete(k);}
  }
  // Update just this cell visually
  const cell=$('ed-grid').querySelector(`[data-c="${c}"][data-r="${r}"]`);
  if(cell){
    const sz=cell.style.width;
    cell.className='ed-cell';cell.style.cssText=`width:${sz};height:${sz}`;
    cell.dataset.c=c;cell.dataset.r=r;
    const isActive=edActive.has(k);
    const zi=edZones.findIndex(z=>z.cells.has(k));
    if(!isActive){cell.classList.add('ec-inactive');}
    else if(zi>=0){const col=ZC[zi%ZC.length];cell.style.background=col.bg;cell.style.borderColor=col.bd;cell.style.borderStyle='solid';cell.style.borderWidth='2px';}
    else{cell.classList.add('ec-free');}
  }
  edGeneratedLevel=null;
  if(snap)edSnapshot();
  if(edEditMode==='zones')renderZonePicker();
}

function renderZonePicker(){
  const p=$('zone-picker');p.innerHTML='';
  const ruleLabel=z=>{
    const r=z.rule;
    const cnt=z.cells.size;
    const suffix=cnt>0?` (${cnt})`:'';
    switch(r.type){
      case'eq':  return`= ${suffix}`;
      case'neq': return`≠ ${suffix}`;
      case'sum': return`Σ${r.v}${suffix}`;
      case'gt':  return`>${r.v}${suffix}`;
      case'lt':  return`<${r.v}${suffix}`;
      default:   return`?${suffix}`;
    }
  };
  edZones.forEach((z,i)=>{
    const col=ZC[i%ZC.length];
    const sw=document.createElement('div');sw.className='zp-sw'+(i===edSelZone?' sel':'');
    sw.style.cssText=`background:${col.bg};border:3px solid ${i===edSelZone?'var(--dark)':col.bd};position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1px;min-width:36px;width:auto;padding:2px 6px;flex-shrink:0;`;
    sw.onclick=()=>{edSelZone=i;renderZonePicker();renderRuleRow();};
    const lbl=document.createElement('div');
    lbl.style.cssText=`font-size:.52rem;font-weight:700;color:${col.bd};white-space:nowrap;line-height:1.1`;
    lbl.textContent=ruleLabel(z);sw.appendChild(lbl);
    if(edZones.length>1){
      const del=document.createElement('div');
      del.style.cssText='position:absolute;top:-6px;right:-4px;width:14px;height:14px;background:#c04;color:#fff;border-radius:50%;font-size:.55rem;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:5';
      del.textContent='×';del.onclick=e=>{e.stopPropagation();deleteZone(i);};
      sw.appendChild(del);
    }
    p.appendChild(sw);
  });
  if(edZones.length<ZC.length){
    const add=document.createElement('div');add.className='zp-sw';
    add.style.cssText='background:rgba(0,0,0,.05);border:2px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#999;cursor:pointer;min-width:30px;';
    add.textContent='+';add.onclick=addZone;p.appendChild(add);
  }
  renderRuleRow();
}
function addZone(){edZones.push({cells:new Set(),rule:{type:'sum',v:4}});edSelZone=edZones.length-1;edSnapshot();renderZonePicker();}
function deleteZone(i){edZones.splice(i,1);if(edSelZone>=edZones.length)edSelZone=edZones.length-1;edSnapshot();renderEdGrid();renderZonePicker();}

function renderRuleRow(){
  const z=edZones[edSelZone];if(!z){$('rule-row').innerHTML='';return;}
  const rr=$('rule-row');rr.innerHTML='';
  const types=['eq','neq','sum','gt','lt'];
  const lbls={eq:'= одинак.',neq:'≠ разные',sum:'Σ=N',gt:'>N',lt:'<N'};
  const typeBtn=document.createElement('button');typeBtn.className='ctrl lite';typeBtn.style.fontSize='.6rem';
  typeBtn.textContent=lbls[z.rule.type]||'?';
  typeBtn.onclick=()=>{
    const idx=types.indexOf(z.rule.type);z.rule.type=types[(idx+1)%types.length];
    if(!['sum','gt','lt'].includes(z.rule.type)){delete z.rule.v;}
    else if(z.rule.v===undefined){z.rule.v=4;}
    edSnapshot();renderZonePicker();
  };
  rr.appendChild(typeBtn);
  if(['sum','gt','lt'].includes(z.rule.type)){
    const m=document.createElement('button');m.className='ed-dim-btn';m.textContent='−';
    m.onclick=()=>{z.rule.v=Math.max(0,(z.rule.v||0)-1);edSnapshot();renderZonePicker();};
    const vEl=document.createElement('div');vEl.className='opill';vEl.textContent=z.rule.v??0;
    const pl=document.createElement('button');pl.className='ed-dim-btn';pl.textContent='+';
    pl.onclick=()=>{z.rule.v=Math.min(60,(z.rule.v||0)+1);edSnapshot();renderZonePicker();};
    rr.appendChild(m);rr.appendChild(vEl);rr.appendChild(pl);
  }
}

function edGenerate(){
  const ac=[...edActive].map(k=>k.split(',').map(Number));
  if(ac.length<4){$('ed-status').textContent='Нужно минимум 4 активные клетки';return;}
  if(ac.length%2!==0){$('ed-status').textContent='Число клеток должно быть чётным (сейчас '+ac.length+')';return;}
  const zones=edZones.filter(z=>z.cells.size>=1).map(z=>({cells:[...z.cells].map(k=>k.split(',').map(Number)),rule:{...z.rule}}));
  const lv=buildPuzzleWithZones(ac,edCols,edRows,zones,()=>Math.random());
  if(!lv){$('ed-status').textContent='Не удалось разбить на домино — измени форму';return;}
  lv.name='МОЙ УРОВЕНЬ';lv.diff='rnd';lv.isCustom=true;
  // Store per-cell pip values for visual preview
  const cellVals={};
  lv.regions.forEach(rg=>rg.cells.forEach(([c,r],ci)=>{
    // value is stored in domino — find which domino covers this cell
  }));
  // Attach cell value map for preview: reconstruct from dominoes+activeCells
  // We'll pass this through the level object itself
  edGeneratedLevel=lv;
  // Visual preview: re-render grid showing zone colors PLUS pip values
  renderEdGridWithPreview(lv);
  $('ed-status').textContent=`✓ ${lv.dominoes.length} домино · ${lv.regions.length} зон · нажми ▶ ИГРАТЬ или 💾 СОХРАНИТЬ`;
}

function renderEdGridWithPreview(lv){
  // Re-render editor grid showing the generated pip values
  const edCell=Math.max(26,Math.min(46,Math.floor((window.innerWidth-48)/edCols)));
  const g=$('ed-grid');
  // Keep grid structure, just update cell visuals
  // We need cell→pipvalue map. Reconstruct from domino tiling.
  // activeCells sorted same way as buildPuzzleWithZones
  const ac=lv.activeCells||(()=>{const a=[];for(let r=0;r<lv.rows;r++)for(let c=0;c<lv.cols;c++)a.push([c,r]);return a;})();
  const setA=new Set(ac.map(([c,r])=>`${c},${r}`));
  const sorted=[...ac].sort((a,b)=>a[1]!==b[1]?a[1]-b[1]:a[0]-b[0]);
  // Re-tile deterministically using same greedy order to find cell→domino mapping
  const tOf={};let placed2=[];
  const rng2=mkRng(12345); // fixed seed just for tiling reconstruction
  function tile2(i){
    if(i>=sorted.length)return true;
    const[c,r]=sorted[i];const k=`${c},${r}`;if(tOf[k]!==undefined)return tile2(i+1);
    for(const[dc,dr]of shu([[1,0],[0,1]],rng2)){
      const k2=`${c+dc},${r+dr}`;if(!setA.has(k2)||tOf[k2]!==undefined)continue;
      const di=placed2.length;tOf[k]=di;tOf[k2]=di;placed2.push([[c,r],[c+dc,r+dr]]);
      if(tile2(i+1))return true;placed2.pop();delete tOf[k];delete tOf[k2];
    }
    return false;
  }
  tile2(0);
  // Build cell→value map
  const cellVal={};
  placed2.forEach(([[c1,r1],[c2,r2]],di)=>{
    if(di<lv.dominoes.length){
      cellVal[`${c1},${r1}`]=lv.dominoes[di][0];
      cellVal[`${c2},${r2}`]=lv.dominoes[di][1];
    }
  });
  // Re-render cells with pip values
  Array.from(g.children).forEach(el=>{
    const c=+el.dataset.c,r=+el.dataset.r,k=`${c},${r}`;
    if(!edActive.has(k))return;
    const v=cellVal[k];
    if(v===undefined)return;
    // Add value badge
    el.querySelectorAll('.ed-pip').forEach(x=>x.remove());
    const pip=document.createElement('div');pip.className='ed-pip';
    const zi=edZones.findIndex(z=>z.cells.has(k));
    const col=zi>=0?ZC[zi%ZC.length]:{bd:'#888'};
    pip.style.cssText=`font-size:${Math.max(9,edCell*.3)}px;font-weight:900;color:${col.bd};position:absolute;bottom:1px;right:3px;line-height:1;pointer-events:none;`;
    pip.textContent=v;el.style.position='relative';el.appendChild(pip);
  });
}

function edPlay(){
  if(!edGeneratedLevel)edGenerate();
  if(edGeneratedLevel)startLevel(edGeneratedLevel);
}
function edSave(){
  if(!edGeneratedLevel)edGenerate();
  if(!edGeneratedLevel)return;
  try{
    const saves=JSON.parse(localStorage.getItem('pips_saved')||'[]');
    const entry={...edGeneratedLevel,savedAt:Date.now(),saveName:edGeneratedLevel.name,
      // Store editor state for re-editing
      _edState:{
        active:[...edActive],cols:edCols,rows:edRows,
        zones:edZones.map(z=>({cells:[...z.cells],rule:{...z.rule}}))
      }
    };
    saves.unshift(entry);if(saves.length>20)saves.pop();
    localStorage.setItem('pips_saved',JSON.stringify(saves));
    $('ed-status').textContent='✓ Сохранено!';buildSavedPanel();
  }catch(e){$('ed-status').textContent='Ошибка: '+e.message;}
}
function edShare(){
  if(!edGeneratedLevel)edGenerate();
  if(!edGeneratedLevel)return;
  try{
    const enc=btoa(unescape(encodeURIComponent(JSON.stringify(edGeneratedLevel))));
    const url=shareBase()+'?level='+enc;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(
        ()=>$('ed-status').textContent='✓ Ссылка скопирована!',
        ()=>prompt('Ссылка:',url)
      );
    } else prompt('Ссылка:',url);
  }catch(e){$('ed-status').textContent='Ошибка: '+e.message;}
}
function edFill(){
  edActive=new Set(allC(edCols,edRows).map(([c,r])=>`${c},${r}`));
  edGeneratedLevel=null;edSnapshot();renderEdGrid();
  $('ed-status').textContent='Все клетки активны';
}
function edClear(){
  edActive=new Set();
  edZones=edZones.map(z=>({...z,cells:new Set()}));
  edGeneratedLevel=null;edSnapshot();renderEdGrid();renderZonePicker();
  $('ed-status').textContent='Очищено';
}
function edReset(){
  editorInitialized=false;initEditor();editorInitialized=true;
}

/* Load saved level back into editor for re-editing */
function edLoadSaved(idx){
  try{
    const saves=JSON.parse(localStorage.getItem('pips_saved')||'[]');
    const lv=saves[idx];if(!lv)return;
    // Restore editor state if stored, otherwise reconstruct from level
    if(lv._edState){
      const s=lv._edState;
      edCols=s.cols;edRows=s.rows;
      edActive=new Set(s.active);
      edZones=s.zones.map(z=>({cells:new Set(z.cells),rule:{...z.rule}}));
    } else {
      // Reconstruct from level structure
      edCols=lv.cols;edRows=lv.rows;
      const ac=lv.activeCells||allC(lv.cols,lv.rows);
      edActive=new Set(ac.map(([c,r])=>`${c},${r}`));
      edZones=lv.regions.map(rg=>({cells:new Set(rg.cells.map(([c,r])=>`${c},${r}`)),rule:{...rg.rule}}));
    }
    if(edSelZone>=edZones.length)edSelZone=0;
    edGeneratedLevel={...lv};
    $('ed-cols-lbl').textContent=edCols;$('ed-rows-lbl').textContent=edRows;
    edHistory=[];edHistoryIdx=-1;edSnapshot();
    renderEdGrid();renderZonePicker();
    $('ed-status').textContent=`Загружено: ${lv.saveName||'Уровень'} · можно редактировать`;
    $('ed-status').scrollIntoView({behavior:'smooth',block:'nearest'});
  }catch(e){$('ed-status').textContent='Ошибка загрузки: '+e.message;}
}

/* ── Saved levels panel in editor ── */

  const p=$('saved-panel');p.innerHTML='';
  let saves=[];try{saves=JSON.parse(localStorage.getItem('pips_saved')||'[]');}catch(e){}
  if(!saves.length){p.innerHTML='<div style="color:#888;font-size:.6rem;text-align:center;padding:8px">Нет сохранённых уровней</div>';return;}
  saves.forEach((lv,idx)=>{
    const d=new Date(lv.savedAt||0);
    const ds=`${d.getDate()}.${d.getMonth()+1}`;
    const card=document.createElement('div');card.className='sub-card';
    card.style.cssText='background:rgba(0,0,0,.04);border:1px solid rgba(0,0,0,.1);margin-bottom:5px;gap:5px;flex-wrap:nowrap;';
    const name=lv.saveName||'Уровень';
    card.innerHTML=`
      <div class="sc-badge med" style="font-size:.55rem;flex-shrink:0">✏️</div>
      <div class="sc-info" style="flex:1;min-width:0">
        <div class="sc-name" style="color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div>
        <div class="sc-meta" style="color:#888">${lv.dominoes?.length||0} д · ${lv.regions?.length||0} зон · ${ds}</div>
      </div>
      <button class="sv-edit" style="background:rgba(47,120,193,.15);border:1px solid rgba(47,120,193,.3);border-radius:6px;font-size:.6rem;padding:3px 6px;cursor:pointer;color:#1a5a9a;flex-shrink:0">✏</button>
      <button class="sv-share" style="background:rgba(200,150,60,.15);border:1px solid rgba(200,150,60,.3);border-radius:6px;font-size:.6rem;padding:3px 6px;cursor:pointer;color:var(--wood);flex-shrink:0">🔗</button>
      <button class="sv-del" style="background:none;border:none;color:#c04;font-size:.85rem;cursor:pointer;padding:0 2px;flex-shrink:0">✕</button>`;
    card.querySelector('.sv-edit').onclick=e=>{e.stopPropagation();edLoadSaved(idx);};
    card.querySelector('.sv-share').onclick=e=>{
      e.stopPropagation();
      try{
        const enc=btoa(unescape(encodeURIComponent(JSON.stringify(lv))));
        const url=shareBase()+'?level='+enc;
        if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>$('ed-status').textContent='✓ Ссылка скопирована!');
        else prompt('Ссылка:',url);
      }catch(err){$('ed-status').textContent='Ошибка';}
    };
    card.querySelector('.sv-del').onclick=e=>{e.stopPropagation();deleteSaved(idx);};
    card.onclick=()=>startLevel(lv);
    p.appendChild(card);
  });
}
function deleteSaved(idx){
  try{const saves=JSON.parse(localStorage.getItem('pips_saved')||'[]');saves.splice(idx,1);localStorage.setItem('pips_saved',JSON.stringify(saves));buildSavedPanel();}catch(e){}
}

/* ── Build puzzle from editor zones ── */
function buildPuzzleWithZones(ac,cols,rows,zones,rng){
  const setA=new Set(ac.map(([c,r])=>`${c},${r}`));
  const sorted=[...ac].sort((a,b)=>a[1]!==b[1]?a[1]-b[1]:a[0]-b[0]);
  const tOf={},placed=[];
  function tile(i){
    if(i>=sorted.length)return true;
    const[c,r]=sorted[i];const k=`${c},${r}`;if(tOf[k]!==undefined)return tile(i+1);
    const dirs=shu([[1,0],[0,1]],rng);
    for(const[dc,dr]of dirs){
      const k2=`${c+dc},${r+dr}`;if(!setA.has(k2)||tOf[k2]!==undefined)continue;
      const di=placed.length;tOf[k]=di;tOf[k2]=di;placed.push([[c,r],[c+dc,r+dr]]);
      if(tile(i+1))return true;placed.pop();delete tOf[k];delete tOf[k2];
    }
    return false;
  }
  if(!tile(0))return null;
  const dVals=placed.map(()=>[0,0]);
  function setCell(c,r,v){const di=tOf[`${c},${r}`];const[[c0,r0]]=placed[di];dVals[di][(c===c0&&r===r0)?0:1]=v;}
  function getCell(c,r){const di=tOf[`${c},${r}`];const[[c0,r0]]=placed[di];return dVals[di][(c===c0&&r===r0)?0:1];}

  const regions=[];
  for(const z of zones){
    const cells=z.cells.filter(([c,r])=>setA.has(`${c},${r}`));
    if(cells.length<1)continue;
    const n=cells.length,rule=z.rule;
    // neq needs ≥2 distinct cells; others work with 1+
    if(rule.type==='neq'&&n<2)continue;
    if(rule.type==='eq'){
      const v=rInt(1,5,rng);cells.forEach(([c,r])=>setCell(c,r,v));
      regions.push({rule:{type:'eq'},cells});
    } else if(rule.type==='neq'){
      const pool=shu([0,1,2,3,4,5].slice(0,Math.max(n,4)),rng).slice(0,n);
      cells.forEach(([c,r],i)=>setCell(c,r,pool[i]));
      regions.push({rule:{type:'neq'},cells});
    } else if(rule.type==='sum'){
      const target=rule.v!=null?rule.v:n*2;
      const clampedTarget=Math.max(0,Math.min(n*5,target));
      let rem=clampedTarget;
      cells.forEach(([c,r],i)=>{const left=n-i-1;const v=rInt(Math.max(0,rem-left*5),Math.min(5,rem),rng);setCell(c,r,v);rem-=v;});
      regions.push({rule:{type:'sum',v:cells.reduce((a,[c,r])=>a+getCell(c,r),0)},cells});
    } else if(rule.type==='gt'){
      const thresh=rule.v??0;
      const maxPossible=n*5;
      if(thresh>=maxPossible){cells.forEach(([c,r])=>setCell(c,r,5));regions.push({rule:{type:'gt',v:thresh-1},cells});}
      else{
        let target=rInt(thresh+1,Math.min(maxPossible,thresh+Math.max(2,n*2)),rng);
        let rem=target;
        cells.forEach(([c,r],i)=>{const left=n-i-1;const v=rInt(Math.max(0,rem-left*5),Math.min(5,rem),rng);setCell(c,r,v);rem-=v;});
        regions.push({rule:{type:'gt',v:thresh},cells});
      }
    } else { // lt
      const thresh=rule.v??n*5;
      if(thresh<=0){cells.forEach(([c,r])=>setCell(c,r,0));regions.push({rule:{type:'lt',v:1},cells});}
      else{
        let target=rInt(0,Math.max(0,thresh-1),rng);
        let rem=target;
        cells.forEach(([c,r],i)=>{const left=n-i-1;const v=rInt(Math.max(0,rem-left*5),Math.min(5,rem),rng);setCell(c,r,v);rem-=v;});
        regions.push({rule:{type:'lt',v:thresh},cells});
      }
    }
  }
  // Fill unzoned cells randomly
  const zonedSet=new Set(zones.flatMap(z=>z.cells).map(([c,r])=>`${c},${r}`));
  placed.forEach(([[c1,r1],[c2,r2]],di)=>{
    if(!zonedSet.has(`${c1},${r1}`))dVals[di][0]=rInt(0,5,rng);
    if(!zonedSet.has(`${c2},${r2}`))dVals[di][1]=rInt(0,5,rng);
  });
  if(regions.length===0){
    // No zones - auto-assign like normal generator
    const autoLv=buildPuzzle(ac,cols,rows,rng);
    return autoLv;
  }
  return{cols,rows,activeCells:ac.length===cols*rows?undefined:ac,dominoes:dVals,regions};
}

/* ══ LOAD FROM URL ══
   Telegram appends #tgWebAppData=... to the hash, so ?level= may appear:
   a) in location.search (normal browser) → URLSearchParams works
   b) inside location.hash after the tg data (Telegram WebApp) → need regex in hash
══════════════════════════════════════════ */
function getURLLevel(){
  // Try normal query string first
  const qs=new URLSearchParams(location.search).get('level');
  if(qs)return qs;
  // Try inside hash (Telegram appends #...?level=... or #...&level=...)
  const h=location.hash||'';
  const m=h.match(/[?&]level=([A-Za-z0-9+/=_-]+)/);
  return m?m[1]:null;
}
function loadFromURL(){
  try{
    const p=getURLLevel();
    if(!p)return false;
    // Support both standard base64 and url-safe base64
    const b64=p.replace(/-/g,'+').replace(/_/g,'/');
    const lv=JSON.parse(decodeURIComponent(escape(atob(b64))));
    if(lv&&lv.dominoes&&lv.regions){
      lv.name=lv.name||'УРОВЕНЬ';lv.fromURL=true;
      startLevel(lv);return true;
    }
  }catch(e){console.warn('loadFromURL error:',e);}
  return false;
}
/* Clean share base: strip Telegram hash and any existing ?level= */
function shareBase(){
  return location.protocol+'//'+location.host+location.pathname;
}

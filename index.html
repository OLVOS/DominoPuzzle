<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>Pips Professional</title>
    <style>
        :root{--cream:#f5efe3;--dark:#1b1208;--gold:#c8963e;--gold2:#f0c060;--wood:#3b1e0c;}
        *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
        html,body{height:100%;overflow:hidden;touch-action:none;}
        body{font-family:'DM Mono',monospace;background:var(--cream);}
        .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;overflow:hidden;transition:opacity .25s,transform .25s;}
        .screen.hidden{opacity:0;pointer-events:none;transform:scale(.97);}

        /* ══ MENU ══ */
        #menu{background:radial-gradient(ellipse at 30% 20%,#2d1a06,#080503);justify-content:center;padding:24px 20px;}
        .menu-title{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold2);letter-spacing:6px;text-shadow:0 0 40px rgba(200,150,60,.45);line-height:1;margin-bottom:4px;}
        .menu-sub{font-size:.55rem;letter-spacing:8px;color:#b89060;text-transform:uppercase;margin-bottom:22px;}
        .divider{width:80px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto;}
        .menu-btn{width:100%;max-width:300px;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 18px;transition:all .15s;margin-bottom:10px;}
        .menu-btn:active{transform:scale(.97);}
        .menu-btn.primary{background:linear-gradient(135deg,#c8963e,#7a4a10);box-shadow:0 4px 0 rgba(0,0,0,.4);}
        .menu-btn.secondary{background:rgba(255,255,255,.06);border:1.5px solid rgba(200,150,60,.3);}
        .mb-icon{font-size:1.5rem;flex-shrink:0;width:34px;text-align:center;}
        .mb-text{text-align:left;flex:1;}
        .mb-title{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--gold2);letter-spacing:1px;display:block;}
        .mb-sub{font-size:.53rem;letter-spacing:1px;color:#806040;display:block;}

        /* ══ EDITOR ══ */
        #editor{background:#0d0a05;padding:15px;color:var(--cream);overflow-y:auto;}
        .ed-toolbar{width:100%;display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap;justify-content:center;}
        .ed-grid{display:grid;gap:4px;background:rgba(255,255,255,0.03);padding:10px;border-radius:12px;}
        .ed-cell{width:45px;height:45px;background:rgba(255,255,255,0.1);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#666;border:1px solid transparent;}
        .ed-cell.active{background:var(--gold2);color:var(--dark);border-color:var(--cream);}
        .ed-controls{margin-top:15px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:10px;}
        .ed-status{font-size:11px;color:var(--gold);text-align:center;min-height:24px;}
        .ed-btn{background:var(--gold);color:var(--dark);border:none;padding:10px;border-radius:8px;font-weight:700;cursor:pointer;}
        .ed-btn.sec{background:rgba(255,255,255,0.1);color:var(--cream);}

        /* ══ GAME ══ */
        #game{background:var(--cream);justify-content:flex-start;padding:0 10px 6px;}
        .game-header{width:100%;display:flex;align-items:center;padding:8px 0;flex-shrink:0;}
        .btn-back{background:var(--dark);color:var(--gold2);border:none;font-size:.65rem;padding:6px 12px;border-radius:7px;cursor:pointer;}
        .gh-center{flex:1;text-align:center;}
        .game-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--dark);}
        .game-timer{font-size:.8rem;color:var(--gold);letter-spacing:2px;}

        #grid-outer{margin:10px 0;display:flex;justify-content:center;}
        #grid-wrap{background:var(--wood);padding:7px;border-radius:13px;position:relative;}
        #grid{display:grid;gap:4px;position:relative;z-index:1;}
        .cell{border-radius:6px;cursor:pointer;transition:background .1s;}
        .cell.active{background:#e8e2d8;border:2px solid #c0b8a8;}
        .cell.inactive{pointer-events:none;opacity:0;}

        #dom-layer{position:absolute;left:7px;top:7px;z-index:8;pointer-events:none;}
        #zone-overlay{position:absolute;left:7px;top:7px;z-index:15;pointer-events:none;}
        .zo{position:absolute;border-radius:5px;border:2px solid;pointer-events:none;}
        .zo.err{background:rgba(200,50,50,.2);animation:zpulse 1.2s infinite;}
        @keyframes zpulse{0%,100%{opacity:1}50%{opacity:.4}}

        #rule-overlay{position:absolute;left:7px;top:7px;z-index:25;pointer-events:none;}
        .rb{position:absolute;transform:translate(-50%,-50%);font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;border:2px solid;white-space:nowrap;backdrop-filter:blur(4px);}

        #hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:10px 0;}
        .hand-slot{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:rgba(0,0,0,.05);border:2px solid transparent;}
        .hand-slot.sel{border-color:var(--gold2);background:rgba(240,192,96,.12);}
        .hand-slot.used{opacity:.15;pointer-events:none;}

        .dom-tile{background:var(--dark);border:2px solid var(--gold);border-radius:7px;overflow:hidden;position:relative;}
        .dom-tile.placed{position:absolute;pointer-events:auto;}
        .dom-tile.placed.gsel{border-color:var(--gold2);box-shadow:0 0 8px var(--gold2);}

        .pip-face{background:#f0e8d8;border-radius:4px;position:relative;}
        .dom-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
        .dom-inner.v{flex-direction:column;}.dom-inner.h{flex-direction:row;}
        .dom-sep{background:var(--gold);border-radius:1px;}
        .dom-inner.v .dom-sep{height:2px;width:80%;margin:4px 0;}
        .dom-inner.h .dom-sep{width:2px;height:80%;margin:0 4px;}

        #win-ov{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:var(--gold2);}
        #win-ov.on{display:flex;}
    </style>
</head>
<body>

<div class="screen" id="menu">
    <div class="menu-title">PIPS</div>
    <div class="menu-sub">Architect Edition</div>
    <button class="menu-btn primary" onclick="startRandom()">
        <div class="mb-icon">⚄</div>
        <div class="mb-text"><span class="mb-title">СЛУЧАЙНЫЙ</span><span class="mb-sub">генерация на лету</span></div>
    </button>
    <button class="menu-btn secondary" onclick="openEditor()">
        <div class="mb-icon">🛠</div>
        <div class="mb-text"><span class="mb-title">РЕДАКТОР</span><span class="mb-sub">создать свой уровень</span></div>
    </button>
    <div class="divider"></div>
</div>

<div class="screen hidden" id="editor">
    <div class="game-header">
        <button class="btn-back" onclick="goMenu()">← МЕНЮ</button>
        <div class="gh-center"><div class="game-title">РЕДАКТОР</div></div>
    </div>
    <div class="ed-status" id="ed-status">Выберите четное число клеток</div>
    <div id="ed-grid" class="ed-grid"></div>
    <div class="ed-controls">
        <button class="ed-btn" onclick="exportLevel()">ПОЛУЧИТЬ ССЫЛКУ (BASE64)</button>
        <button class="ed-btn sec" onclick="resetEditor()">ОЧИСТИТЬ СЕТКУ</button>
    </div>
</div>

<div class="screen hidden" id="game">
    <div class="game-header">
        <button class="btn-back" onclick="goMenu()">← МЕНЮ</button>
        <div class="gh-center">
            <div class="game-title" id="gtitle">PIPS</div>
            <div class="game-timer" id="timer">00:00</div>
        </div>
    </div>
    <div id="grid-outer">
        <div id="grid-wrap">
            <div id="grid"></div>
            <div id="dom-layer"></div>
            <div id="zone-overlay"></div>
            <div id="rule-overlay"></div>
        </div>
    </div>
    <div id="hand"></div>
    <div style="display:flex; gap:10px; margin-top:5px;">
        <button class="ed-btn" id="btn-rot" onclick="doRotate()" disabled>🔄 ПОВЕРНУТЬ</button>
        <button class="ed-btn sec" onclick="resetLevel()">↺ СБРОС</button>
    </div>
</div>

<div id="win-ov">
    <h1 style="font-family:'Playfair Display'; font-size:3rem;">ПОБЕДА!</h1>
    <p id="win-time" style="margin:20px 0; letter-spacing:3px;"></p>
    <button class="ed-btn" onclick="goMenu()">ВЕРНУТЬСЯ В МЕНЮ</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg) { tg.ready(); tg.expand(); }

const $ = id => document.getElementById(id);
const ZC = [{bg:'#f7d6e0',bd:'#c8457a'},{bg:'#cfe3f7',bd:'#2f78c1'},{bg:'#d0f0d8',bd:'#2f9c50'},{bg:'#ead6f5',bd:'#7a38c0'},{bg:'#fde8cc',bd:'#c07028'}];
const ORI = [{dc:1,dr:0},{dc:0,dr:1},{dc:-1,dr:0},{dc:0,dr:-1}];

let puzzle, board, placements, usedDom, selDi, orientIdx, timerIv, timerSecs;
let editorCells = new Set();

/* ══ CORE ENGINE ══ */

function initApp() {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('p');
    if (p) {
        try {
            const decoded = atob(p);
            const lv = JSON.parse(decoded);
            if (lv.dominoes && lv.regions) startLevel(lv);
        } catch (e) {
            console.error("Payload corruption:", e);
            if(tg) tg.showAlert("Ошибка загрузки уровня. Ссылка повреждена.");
            goMenu();
        }
    }
}

function startLevel(lv) {
    puzzle = JSON.parse(JSON.stringify(lv));
    board = {}; placements = {}; usedDom = new Set();
    selDi = null; orientIdx = 0; timerSecs = 0;
    clearInterval(timerIv);
    showScreen('game');
    buildGame();
    timerIv = setInterval(() => { timerSecs++; $('timer').textContent = fmtT(timerSecs); }, 1000);
}

function showScreen(id) {
    ['menu', 'editor', 'game'].forEach(s => $(s).classList.toggle('hidden', s !== id));
}

function goMenu() {
    clearInterval(timerIv);
    window.history.replaceState({}, '', window.location.pathname);
    showScreen('menu');
}

/* ══ EDITOR LOGIC ══ */

function openEditor() {
    editorCells.clear();
    showScreen('editor');
    const g = $('ed-grid');
    g.innerHTML = '';
    const size = 6;
    g.style.gridTemplateColumns = `repeat(${size}, 45px)`;
    for(let i=0; i<size*size; i++) {
        let c = i % size, r = Math.floor(i / size);
        let d = document.createElement('div');
        d.className = 'ed-cell';
        d.textContent = `${c},${r}`;
        d.onclick = () => {
            let k = `${c},${r}`;
            if(editorCells.has(k)) { editorCells.delete(k); d.classList.remove('active'); }
            else { editorCells.add(k); d.classList.add('active'); }
            $('ed-status').textContent = `Клеток: ${editorCells.size} (${editorCells.size % 2 === 0 ? 'OK' : 'нужно четное'})`;
        };
        g.appendChild(d);
    }
}

function exportLevel() {
    if (editorCells.size < 4 || editorCells.size % 2 !== 0) {
        if(tg) tg.showAlert("Выберите четное количество клеток (минимум 4)");
        return;
    }
    const ac = Array.from(editorCells).map(k => k.split(',').map(Number));
    const lv = buildPuzzleLogic(ac, 6, 6, Math.random);
    if (!lv) {
        if(tg) tg.showAlert("Не удалось разместить домино на этой фигуре. Попробуйте другую форму.");
        return;
    }
    const code = btoa(JSON.stringify(lv));
    const url = window.location.origin + window.location.pathname + "?p=" + code;

    if (tg) {
        tg.showPopup({
            title: 'Уровень готов!',
            message: 'Ссылка скопирована. Отправьте её друзьям.',
            buttons: [{type: 'ok'}]
        });
        navigator.clipboard.writeText(url);
    } else {
        prompt("Скопируйте ссылку:", url);
    }
}

function resetEditor() {
    editorCells.clear();
    document.querySelectorAll('.ed-cell').forEach(c => c.classList.remove('active'));
    $('ed-status').textContent = "Сетка очищена";
}

/* ══ GENERATOR (SOURCE LOGIC) ══ */

function buildPuzzleLogic(ac, cols, rows, rngFunc) {
    const setA = new Set(ac.map(([c,r]) => `${c},${r}`));
    const sorted = [...ac].sort((a,b) => a[1] !== b[1] ? a[1]-b[1] : a[0]-b[0]);
    const tOf = {}, placed = [];

    function tile(i) {
        if (i >= sorted.length) return true;
        const [c, r] = sorted[i]; if (tOf[`${c},${r}`] !== undefined) return tile(i+1);
        const dirs = [[1,0],[0,1],[0,-1],[-1,0]].sort(() => rngFunc() - 0.5);
        for (const [dc, dr] of dirs) {
            const k2 = `${c+dc},${r+dr}`;
            if (setA.has(k2) && tOf[k2] === undefined) {
                const di = placed.length;
                tOf[`${c},${r}`] = di; tOf[k2] = di;
                placed.push([[c,r], [c+dc,r+dr]]);
                if (tile(i+1)) return true;
                placed.pop(); delete tOf[`${c},${r}`]; delete tOf[k2];
            }
        }
        return false;
    }

    if (!tile(0)) return null;

    const dVals = placed.map(() => [Math.floor(rngFunc()*6), Math.floor(rngFunc()*6)]);
    const getVal = (c,r) => {
        const di = tOf[`${c},${r}`];
        const [[ac1, ar1]] = placed[di];
        return dVals[di][(ac1===c && ar1===r) ? 0 : 1];
    };

    // BFS Partitioning for Regions
    const zCount = Math.max(2, Math.min(5, Math.ceil(ac.length/4)));
    const zOf = {};
    const seeds = ac.sort(() => rngFunc()-0.5).slice(0, zCount);
    seeds.forEach(([c,r], i) => zOf[`${c},${r}`] = i);

    let q = seeds.map(([c,r], i) => ({c, r, z: i}));
    let head = 0;
    while(head < q.length) {
        const {c, r, z} = q[head++];
        [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dc, dr]) => {
            const nk = `${c+dc},${r+dr}`;
            if (setA.has(nk) && zOf[nk] === undefined) {
                zOf[nk] = z; q.push({c: c+dc, r: r+dr, z});
            }
        });
    }

    const regions = Array.from({length: zCount}, () => []);
    ac.forEach(([c,r]) => {
        const z = zOf[`${c},${r}`] ?? 0;
        regions[z].push([c,r]);
    });

    return {
        cols, rows,
        activeCells: ac,
        dominoes: dVals,
        regions: regions.filter(r => r.length > 0).map(cells => ({
            cells,
            rule: pickRule(cells.map(([c,r]) => getVal(c,r)), rngFunc)
        }))
    };
}

function pickRule(vals, rng) {
    const sum = vals.reduce((a,b) => a+b, 0);
    const opts = [{type:'sum', v:sum}];
    if(vals.length >= 2) {
        if(vals.every(v => v === vals[0])) opts.push({type:'eq'});
        if(new Set(vals).size === vals.length) opts.push({type:'neq'});
    }
    if(sum > 2) opts.push({type:'gt', v: sum - 1});
    return (opts.length > 1 && rng() > 0.4) ? opts[Math.floor(rng()*(opts.length-1))+1] : opts[0];
}

/* ══ GAME ENGINE ══ */

function buildGame() {
    const g = $('grid'); g.innerHTML = '';
    const cellSz = 46, gap = 4;
    g.style.gridTemplateColumns = `repeat(${puzzle.cols}, ${cellSz}px)`;

    puzzle.activeCells.forEach(([c, r]) => {
        let d = document.createElement('div');
        d.className = 'cell active';
        d.style.gridColumnStart = c + 1;
        d.style.gridRowStart = r + 1;
        d.style.width = cellSz + 'px'; d.style.height = cellSz + 'px';
        d.onclick = () => onGridClick(c, r);
        g.appendChild(d);
    });

    const h = $('hand'); h.innerHTML = '';
    puzzle.dominoes.forEach(([a, b], i) => {
        let slot = document.createElement('div');
        slot.className = 'hand-slot';
        let tile = document.createElement('div');
        tile.className = 'dom-tile';
        renderTile(tile, a, b, 0, 24);
        slot.onclick = () => selectHand(i);
        slot.appendChild(tile);
        h.appendChild(slot);
    });

    renderRules();
}

function onGridClick(c, r) {
    if (selDi === null) {
        const k = `${c},${r}`;
        if (board[k]) selectPlaced(board[k].di);
        return;
    }
    const {dc, dr} = ORI[orientIdx];
    const c2 = c + dc, r2 = r + dr;

    const isAvailable = (tx, ty) => {
        if (!puzzle.activeCells.some(([ac, ar]) => ac === tx && ar === ty)) return false;
        const occupier = board[`${tx},${ty}`];
        return !occupier || occupier.di === selDi;
    };

    if (isAvailable(c, r) && isAvailable(c2, r2)) {
        placeDomino(selDi, c, r, orientIdx);
    }
}

function placeDomino(di, c, r, oi) {
    // Cleanup old pos
    if (placements[di]) {
        const old = placements[di];
        delete board[`${old.c},${old.r}`];
        delete board[`${old.c + ORI[old.oi].dc},${old.r + ORI[old.oi].dr}`];
    }

    board[`${c},${r}`] = {di, side: 0};
    board[`${c + ORI[oi].dc},${r + ORI[oi].dr}`] = {di, side: 1};
    placements[di] = {c, r, oi};
    usedDom.add(di);

    $('hand').children[di].classList.add('used');
    renderPlaced();
    checkWin();
    deselect();
}

function doRotate() {
    if (selDi === null) return;
    orientIdx = (orientIdx + 1) % 4;

    if (placements[selDi]) {
        const p = placements[selDi];
        placeDomino(selDi, p.c, p.r, orientIdx);
    } else {
        const tile = $('hand').children[selDi].querySelector('.dom-tile');
        const [a, b] = puzzle.dominoes[selDi];
        renderTile(tile, a, b, orientIdx, 24);
    }
}

function renderPlaced() {
    const layer = $('dom-layer'); layer.innerHTML = '';
    Object.keys(placements).forEach(di => {
        const {c, r, oi} = placements[di];
        const [a, b] = puzzle.dominoes[di];
        const tile = document.createElement('div');
        tile.className = 'dom-tile placed' + (selDi == di ? ' gsel' : '');
        tile.style.left = (c * 50) + 'px';
        tile.style.top = (r * 50) + 'px';
        renderTile(tile, a, b, oi, 20);
        tile.onclick = (e) => { e.stopPropagation(); selectPlaced(Number(di)); };
        layer.appendChild(tile);
    });
}

function selectHand(di) {
    deselect();
    selDi = di;
    orientIdx = 0;
    $('hand').children[di].classList.add('sel');
    $('btn-rot').disabled = false;
}

function selectPlaced(di) {
    deselect();
    selDi = di;
    orientIdx = placements[di].oi;
    renderPlaced();
    $('btn-rot').disabled = false;
}

function deselect() {
    selDi = null;
    document.querySelectorAll('.hand-slot').forEach(s => s.classList.remove('sel'));
    $('btn-rot').disabled = true;
    renderPlaced();
}

function renderTile(el, a, b, oi, sz) {
    el.innerHTML = '';
    const isV = oi % 2 !== 0;
    const [p1, p2] = (oi < 2) ? [a, b] : [b, a];
    el.style.width = isV ? (sz + 14) + 'px' : (sz * 2 + 20) + 'px';
    el.style.height = isV ? (sz * 2 + 20) + 'px' : (sz + 14) + 'px';

    const inner = document.createElement('div');
    inner.className = 'dom-inner ' + (isV ? 'v' : 'h');
    inner.appendChild(drawFace(p1, sz));
    const sep = document.createElement('div'); sep.className = 'dom-sep';
    inner.appendChild(sep);
    inner.appendChild(drawFace(p2, sz));
    el.appendChild(inner);
}

function drawFace(n, sz) {
    const f = document.createElement('div');
    f.className = 'pip-face';
    f.style.width = sz + 'px'; f.style.height = sz + 'px';
    const dots = {0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]}[n];
    dots.forEach(([x, y]) => {
        let d = document.createElement('div');
        d.style.cssText = `position:absolute; width:20%; height:20%; background:#1b1208; border-radius:50%; left:${x*33+15}%; top:${y*33+15}%;`;
        f.appendChild(d);
    });
    return f;
}

function renderRules() {
    const ov = $('zone-overlay'); ov.innerHTML = '';
    const rv = $('rule-overlay'); rv.innerHTML = '';
    puzzle.regions.forEach((rg, i) => {
        const col = ZC[i % ZC.length];
        rg.cells.forEach(([c, r]) => {
            let z = document.createElement('div');
            z.className = 'zo';
            z.style.cssText = `left:${c*50+4}px; top:${r*50+4}px; width:42px; height:42px; border-color:${col.bd};`;
            z.id = `zo-${c}-${r}`;
            ov.appendChild(z);
        });
        const [mc, mr] = rg.cells[0];
        let rb = document.createElement('div');
        rb.className = 'rb';
        rb.style.cssText = `left:${mc*50+25}px; top:${mr*50}px; border-color:${col.bd}; background:${col.bg}; color:${col.bd};`;
        rb.textContent = formatRule(rg.rule);
        rv.appendChild(rb);
    });
}

function checkWin() {
    if (usedDom.size < puzzle.dominoes.length) return;

    let allOk = true;
    document.querySelectorAll('.zo').forEach(z => z.classList.remove('err'));

    puzzle.regions.forEach((rg, i) => {
        const vals = rg.cells.map(([c, r]) => {
            const data = board[`${c},${r}`];
            if (!data) return null;
            return puzzle.dominoes[data.di][data.side];
        });

        if (!validateRule(rg.rule, vals)) {
            allOk = false;
            rg.cells.forEach(([c, r]) => $(`zo-${c}-${r}`).classList.add('err'));
        }
    });

    if (allOk) {
        if(tg) tg.HapticFeedback.notificationOccurred('success');
        $('win-time').textContent = `Время: ${fmtT(timerSecs)}`;
        $('win-ov').classList.add('on');
    }
}

function validateRule(rule, vals) {
    if (vals.includes(null)) return false;
    const sum = vals.reduce((a, b) => a + b, 0);
    switch(rule.type) {
        case 'sum': return sum === rule.v;
        case 'eq': return vals.every(v => v === vals[0]);
        case 'neq': return new Set(vals).size === vals.length;
        case 'gt': return sum > rule.v;
        case 'lt': return sum < rule.v;
        default: return true;
    }
}

function formatRule(r) {
    return {sum: `=${r.v}`, eq: '=', neq: '≠', gt: `>${r.v}`, lt: `<${r.v}`}[r.type] || '';
}

function startRandom() {
    const ac = [];
    const r = Math.random();
    if (r < 0.3) { // Spiral logic
        let c = 3, r = 3, steps = 1, d = 0;
        const dirs = [[1,0],[0,1],[-1,0],[0,-1]];
        for(let i=0; i<18; i++) {
            ac.push([c, r]);
            if (ac.length % steps === 0) d = (d+1)%4;
            if (d % 2 === 0) steps++;
            c += dirs[d][0]; r += dirs[d][1];
        }
    } else { // Islands
        for(let i=0; i<2; i++) {
            let bc = Math.floor(Math.random()*4), br = Math.floor(Math.random()*4);
            [[0,0],[1,0],[0,1],[1,1],[2,1],[1,2]].forEach(([dc, dr]) => ac.push([bc+dc, br+dr]));
        }
    }
    const filtered = [...new Set(ac.map(p => p.join(',')))].map(s => s.split(',').map(Number)).slice(0, 16);
    const lv = buildPuzzleLogic(filtered, 7, 7, Math.random);
    if (lv) startLevel(lv); else startRandom();
}

function resetLevel() {
    board = {}; placements = {}; usedDom.clear();
    document.querySelectorAll('.hand-slot').forEach(s => s.classList.remove('used','sel'));
    deselect();
}

const fmtT = s => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;

initApp();
</script>

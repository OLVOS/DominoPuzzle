<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>Pips: Domino Puzzle & Editor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #f5efe3;
            --dark: #1b1208;
            --gold: #c8963e;
            --gold2: #f0c060;
            --wood: #3b1e0c;
            --sel-glow: 0 0 15px rgba(240, 192, 96, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { height: 100%; overflow: hidden; touch-action: none; font-family: 'DM Mono', monospace; background: var(--cream); }

        .screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; transition: opacity .25s, transform .25s; }
        .screen.hidden { opacity: 0; pointer-events: none; transform: scale(.97); }

        /* ══ MENU ══ */
        #menu { background: radial-gradient(ellipse at 30% 20%, #2d1a06, #080503); justify-content: center; padding: 24px 20px; }
        .menu-title { font-family: 'Playfair Display', serif; font-size: 3.5rem; font-weight: 900; color: var(--gold2); letter-spacing: 6px; text-shadow: 0 0 40px rgba(200, 150, 60, .45); line-height: 1; margin-bottom: 8px; }
        .menu-sub { font-size: .6rem; letter-spacing: 8px; color: #b89060; text-transform: uppercase; margin-bottom: 30px; }
        .menu-btn { width: 100%; max-width: 300px; border: none; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 14px; padding: 14px 18px; transition: all .15s; margin-bottom: 10px; color: var(--cream); }
        .menu-btn:active { transform: scale(.97); }
        .menu-btn.primary { background: linear-gradient(135deg, #c8963e, #7a4a10); box-shadow: 0 4px 0 rgba(0,0,0,.4); }
        .menu-btn.editor-btn { background: rgba(200, 150, 60, .15); border: 1.5px solid var(--gold); }
        .mb-icon { font-size: 1.5rem; width: 34px; text-align: center; }
        .mb-text { text-align: left; flex: 1; }
        .mb-title { font-family: 'Playfair Display', serif; font-size: .9rem; font-weight: 700; color: var(--gold2); display: block; }
        .mb-sub { font-size: .55rem; color: #806040; margin-top: 2px; }

        /* ══ GAMEPLAY ══ */
        #game, #editor { background: var(--cream); padding: 0 10px 10px; }
        .header { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 10px 0; flex-shrink: 0; }
        .btn-ui { background: var(--dark); color: var(--gold2); border: none; font-size: .65rem; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-family: 'DM Mono'; font-weight: bold; }

        #grid-outer { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden; }
        #grid-wrap { background: var(--wood); padding: 8px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); position: relative; }
        #grid { display: grid; position: relative; z-index: 1; }

        .cell { border-radius: 6px; cursor: pointer; transition: background 0.1s; position: relative; }
        .cell.active { background: #e8e2d8; border: 2px solid #c0b8a8; }
        .cell.inactive { background: transparent; border: 1px dashed rgba(0,0,0,0.1); }
        .cell.sel-ed { outline: 3px solid var(--gold2); outline-offset: -3px; box-shadow: var(--sel-glow); z-index: 5; }

        /* ══ DOMINOES ══ */
        .dom-tile { position: absolute; background: var(--dark); border: 2px solid var(--gold); border-radius: 8px; box-shadow: 3px 4px 0 rgba(0,0,0,0.4); transform-origin: center center; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), left 0.2s, top 0.2s, border-color 0.2s; z-index: 10; pointer-events: auto; }
        .dom-tile.gsel { border-color: var(--gold2); box-shadow: var(--sel-glow), 3px 4px 0 rgba(0,0,0,0.4); outline: 2px solid var(--gold2); z-index: 15; }
        .hand-slot { width: 72px; height: 72px; background: rgba(0,0,0,0.05); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; border: 2px solid transparent; flex-shrink: 0; }
        .hand-slot.sel { border-color: var(--gold2); background: rgba(240, 192, 96, 0.15); box-shadow: var(--sel-glow); }
        .hand-slot.used { opacity: 0.15; pointer-events: none; }

        /* ══ OVERLAYS ══ */
        .rb { position: absolute; transform: translate(-50%, -50%); font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; border: 2px solid; z-index: 20; pointer-events: none; background: white; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        #status { font-size: 0.7rem; color: #666; height: 20px; text-align: center; margin-bottom: 5px; }

        .tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 10px 0; flex-shrink: 0; }
        .t-btn { padding: 8px 12px; font-size: 0.65rem; background: var(--dark); color: var(--gold2); border: none; border-radius: 8px; cursor: pointer; font-family: 'DM Mono'; }
        .t-btn.act { background: var(--gold); color: var(--dark); }

        #win-ov { position: fixed; inset: 0; background: rgba(8,5,2,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 2000; color: var(--gold2); opacity: 0; pointer-events: none; transition: 0.3s; }
        #win-ov.on { opacity: 1; pointer-events: all; }
    </style>
</head>
<body>

<div class="screen" id="menu">
    <div class="menu-title">PIPS</div>
    <div class="menu-sub">Domino Puzzle</div>
    <button class="menu-btn primary" onclick="startRandom()">
        <div class="mb-icon">🎲</div>
        <div class="mb-text"><span class="mb-title">ИГРАТЬ</span><span class="mb-sub">Случайная генерация</span></div>
    </button>
    <button class="menu-btn editor-btn" onclick="openEditor()">
        <div class="mb-icon">🛠️</div>
        <div class="mb-text"><span class="mb-title">РЕДАКТОР</span><span class="mb-sub">Создай свой уровень</span></div>
    </button>
</div>

<div class="screen hidden" id="game">
    <div class="header">
        <button class="btn-ui" onclick="goMenu()">← МЕНЮ</button>
        <div id="timer" style="color:var(--gold); letter-spacing: 2px;">00:00</div>
        <button class="btn-ui" onclick="shareLevel()">ПОДЕЛИТЬСЯ</button>
    </div>
    <div id="grid-outer">
        <div id="grid-wrap">
            <div id="grid"></div>
            <div id="dom-layer" style="position:absolute; inset:0; pointer-events:none;"></div>
            <div id="rule-layer" style="position:absolute; inset:0; pointer-events:none;"></div>
        </div>
    </div>
    <div id="status"></div>
    <div class="tools">
        <button class="t-btn" onclick="doRotate()">🔄 ПОВЕРНУТЬ</button>
        <button class="t-btn" id="btn-lift" onclick="doLift()" style="display:none">↑ В РУКУ</button>
        <button class="t-btn" onclick="resetPuzzle()">↺ СБРОС</button>
    </div>
    <div id="hand" style="display:flex; gap:8px; padding-bottom:10px; width:100%; justify-content:center; flex-wrap:wrap;"></div>
</div>

<div class="screen hidden" id="editor">
    <div class="header">
        <button class="btn-ui" onclick="goMenu()">← МЕНЮ</button>
        <div style="font-weight:900; color:var(--dark); font-size:0.8rem;">EDITOR MODE</div>
        <button class="btn-ui" style="background:var(--gold); color:var(--dark)" onclick="testEditor()">ТЕСТ ▶</button>
    </div>
    <div id="grid-outer">
        <div id="editor-grid-wrap" class="grid-wrap">
            <div id="e-grid" style="display:grid; background:var(--wood); padding:8px; border-radius:12px;"></div>
        </div>
    </div>
    <div class="tools">
        <button class="t-btn act" id="t-toggle" onclick="setTool('toggle')">КЛЕТКИ ±</button>
        <button class="t-btn" id="t-rule" onclick="setTool('rule')">ЗОНЫ</button>
        <div style="width:100%; height:1px; background:rgba(0,0,0,0.1); margin:4px 0;"></div>
        <button class="t-btn" onclick="applyRule('sum')">SUM</button>
        <button class="t-btn" onclick="applyRule('eq')">=</button>
        <button class="t-btn" onclick="applyRule('neq')">≠</button>
        <button class="t-btn" onclick="applyRule('gt')">&gt;</button>
        <button class="t-btn" onclick="applyRule('lt')">&lt;</button>
        <button class="t-btn" style="background:#7a1818" onclick="clearRegions()">RESET ZONES</button>
    </div>
</div>

<div id="win-ov">
    <h1 style="font-family:'Playfair Display'; font-size:2.5rem; margin-bottom:10px;">✦ ПОБЕДА ✦</h1>
    <div id="win-meta" style="font-size:0.8rem; margin-bottom:20px;"></div>
    <div style="display:flex; gap:10px;">
        <button class="btn-ui" style="padding:12px 24px" onclick="goMenu()">МЕНЮ</button>
        <button class="btn-ui" style="background:var(--gold); color:var(--dark); padding:12px 24px" onclick="shareLevel()">SHARE</button>
    </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let puzzle = null;
let board = {}; // "c,r" -> {di, half}
let placements = {}; // di -> {c, r, oi}
let usedDom = new Set();
let selDi = null, selMode = null, orientIdx = 0;
let timerIv = null, seconds = 0;

const ZC = [
    {bg:'#f7d6e0', bd:'#c8457a'}, {bg:'#cfe3f7', bd:'#2f78c1'},
    {bg:'#d0f0d8', bd:'#2f9c50'}, {bg:'#ead6f5', bd:'#7a38c0'},
    {bg:'#fde8cc', bd:'#c07028'}
];
const ORI = [{dc:1, dr:0}, {dc:0, dr:1}, {dc:-1, dr:0}, {dc:0, dr:-1}];

/* ══ RNG ══ */
function mkRng(seed) {
    let s = seed >>> 0;
    return () => {
        s = (s + 0x6D2B79F5) | 0;
        let t = Math.imul(s ^ s >>> 15, 1 | s);
        t = t ^ (t + Math.imul(t ^ t >>> 7, 61 | t)) | 0;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

/* ══ CORE RENDER ══ */
const PIPS = { 0:[], 1:[[1,1]], 2:[[0,0],[2,2]], 3:[[0,0],[1,1],[2,2]], 4:[[0,0],[2,0],[0,2],[2,2]], 5:[[0,0],[2,0],[1,1],[0,2],[2,2]], 6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]] };

function makePip(n, sz) {
    const f = document.createElement('div');
    f.style.cssText = `position:relative; background:#f0e8d8; border-radius:4px; width:${sz}px; height:${sz}px; flex-shrink:0;`;
    const r = sz * 0.12, step = sz / 3;
    (PIPS[n] || []).forEach(([gx, gy]) => {
        const d = document.createElement('div');
        d.style.cssText = `position:absolute; width:${r*2}px; height:${r*2}px; background:var(--dark); border-radius:50%; left:${gx*step+step/2-r}px; top:${gy*step+step/2-r}px;`;
        f.appendChild(d);
    });
    return f;
}

function fillTile(el, a, b, oi, sz) {
    el.innerHTML = '';
    const isV = oi % 2 !== 0, flip = oi >= 2, p1 = flip ? b : a, p2 = flip ? a : b;
    const w = isV ? sz + 10 : sz * 2 + 15, h = isV ? sz * 2 + 15 : sz + 10;
    el.style.width = w + 'px'; el.style.height = h + 'px';
    const inner = document.createElement('div');
    inner.style.cssText = `display:flex; align-items:center; justify-content:center; gap:4px; padding:5px; height:100%; width:100%; flex-direction:${isV?'column':'row'}`;
    inner.appendChild(makePip(p1, sz));
    const sep = document.createElement('div');
    sep.style.cssText = `background:var(--gold); ${isV ? 'width:80%; height:2px' : 'height:80%; width:2px'}`;
    inner.appendChild(sep);
    inner.appendChild(makePip(p2, sz));
    el.appendChild(inner);
}

/* ══ GRID SCALING ══ */
function getCellSize(cols, rows) {
    const reservedH = 42 + 20 + 20 + 40 + 80 + 20; // Exact offsets for header/UI
    const availW = window.innerWidth - 40;
    const availH = window.innerHeight - reservedH;
    const cw = Math.floor(availW / cols) - 4;
    const ch = Math.floor(availH / rows) - 4;
    return Math.max(25, Math.min(55, Math.min(cw, ch)));
}

/* ══ ENGINE ══ */
function startLevel(lv) {
    puzzle = JSON.parse(JSON.stringify(lv));
    board = {}; placements = {}; usedDom.clear(); selDi = null; selMode = null;
    seconds = 0; clearInterval(timerIv);
    timerIv = setInterval(() => { seconds++; document.getElementById('timer').textContent = `${Math.floor(seconds/60).toString().padStart(2,'0')}:${(seconds%60).toString().padStart(2,'0')}`; }, 1000);
    document.getElementById('win-ov').classList.remove('on');
    showScreen('game');
    renderGame();
}

function renderGame() {
    const sz = getCellSize(puzzle.cols, puzzle.rows);
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = `repeat(${puzzle.cols}, ${sz}px)`;
    grid.innerHTML = '';

    const activeSet = new Set(puzzle.activeCells.map(c => `${c[0]},${c[1]}`));
    for (let r = 0; r < puzzle.rows; r++) {
        for (let c = 0; c < puzzle.cols; c++) {
            const cell = document.createElement('div');
            const key = `${c},${r}`;
            const isActive = activeSet.has(key);
            cell.className = 'cell ' + (isActive ? 'active' : 'inactive');
            cell.style.width = sz + 'px'; cell.style.height = sz + 'px';

            if (isActive) {
                const regIdx = puzzle.regions.findIndex(rg => rg.cells.some(cc => cc[0] === c && cc[1] === r));
                if (regIdx !== -1) {
                    cell.style.background = ZC[regIdx % ZC.length].bg;
                    cell.style.borderColor = ZC[regIdx % ZC.length].bd;
                }
                cell.onclick = () => onCellClick(c, r);
            }
            grid.appendChild(cell);
        }
    }
    renderRules(sz);
    renderHand();
    syncBoardUI();
}

function renderRules(sz) {
    const layer = document.getElementById('rule-layer');
    layer.innerHTML = '';
    const step = sz + 4;
    puzzle.regions.forEach((rg, i) => {
        const text = {sum: `=${rg.rule.v}`, eq: '=', neq: '≠', gt: `>${rg.rule.v}`, lt: `<${rg.rule.v}`}[rg.rule.type];
        if (!text) return;
        const minR = Math.min(...rg.cells.map(c => c[1]));
        const cellsInMinR = rg.cells.filter(c => c[1] === minR);
        const maxC = Math.max(...cellsInMinR.map(c => c[0]));
        const badge = document.createElement('div');
        badge.className = 'rb'; badge.textContent = text;
        badge.style.left = (maxC * step + sz) + 'px';
        badge.style.top = (minR * step) + 'px';
        badge.style.borderColor = ZC[i % ZC.length].bd;
        badge.style.color = ZC[i % ZC.length].bd;
        layer.appendChild(badge);
    });
}

function renderHand() {
    const hand = document.getElementById('hand');
    hand.innerHTML = '';
    puzzle.dominoes.forEach(([a, b], di) => {
        const slot = document.createElement('div');
        slot.className = 'hand-slot' + (usedDom.has(di) ? ' used' : '') + (selDi === di && selMode === 'hand' ? ' sel' : '');
        const tile = document.createElement('div');
        fillTile(tile, a, b, 0, 18);
        slot.appendChild(tile);
        slot.onclick = () => { if (!usedDom.has(di)) { selDi = di; selMode = 'hand'; orientIdx = 0; syncBoardUI(); renderHand(); } };
        hand.appendChild(slot);
    });
}

function syncBoardUI() {
    const layer = document.getElementById('dom-layer');
    layer.innerHTML = '';
    const sz = getCellSize(puzzle.cols, puzzle.rows);
    const step = sz + 4;
    for (const di in placements) {
        const p = placements[di];
        const [a, b] = puzzle.dominoes[di];
        const tile = document.createElement('div');
        tile.className = 'dom-tile' + (selDi == di && selMode === 'grid' ? ' gsel' : '');
        tile.style.left = (p.c * step + 5) + 'px';
        tile.style.top = (p.r * step + 5) + 'px';
        fillTile(tile, a, b, p.oi, Math.floor(sz * 0.45));
        tile.onclick = (e) => { e.stopPropagation(); selDi = parseInt(di); selMode = 'grid'; orientIdx = p.oi; syncBoardUI(); renderHand(); };
        layer.appendChild(tile);
    }
    document.getElementById('btn-lift').style.display = (selMode === 'grid') ? 'block' : 'none';
    document.getElementById('status').textContent = `Размещено: ${usedDom.size} / ${puzzle.dominoes.length}`;
}

function onCellClick(c, r) {
    if (selDi === null) return;
    const [a, b] = puzzle.dominoes[selDi];
    const dc = ORI[orientIdx].dc, dr = ORI[orientIdx].dr;
    const c2 = c + dc, r2 = r + dr;
    const k1 = `${c},${r}`, k2 = `${c2},${r2}`;
    const activeSet = new Set(puzzle.activeCells.map(cc => `${cc[0]},${cc[1]}`));

    if (!activeSet.has(k1) || !activeSet.has(k2)) return;

    const existing1 = board[k1], existing2 = board[k2];
    if ((existing1 && existing1.di !== selDi) || (existing2 && existing2.di !== selDi)) return;

    if (selMode === 'grid') {
        const old = placements[selDi];
        delete board[`${old.c},${old.r}`];
        delete board[`${old.c + ORI[old.oi].dc},${old.r + ORI[old.oi].dr}`];
    }

    const h1 = orientIdx >= 2 ? 'b' : 'a', h2 = orientIdx >= 2 ? 'a' : 'b';
    board[k1] = { di: selDi, half: h1 };
    board[k2] = { di: selDi, half: h2 };
    placements[selDi] = { c, r, oi: orientIdx };
    usedDom.add(selDi);
    selDi = null; selMode = null;
    renderHand(); syncBoardUI(); validate();
}

function doRotate() {
    if (selDi === null) return;
    const nextOri = (orientIdx + 1) % 4;
    if (selMode === 'grid') {
        const p = placements[selDi];
        const dc = ORI[nextOri].dc, dr = ORI[nextOri].dr;
        const k1 = `${p.c},${p.r}`, k2 = `${p.c+dc},${p.r+dr}`;
        const activeSet = new Set(puzzle.activeCells.map(cc => `${cc[0]},${cc[1]}`));

        // Atomic check
        const tempBoard = {...board};
        delete tempBoard[k1]; delete tempBoard[`${p.c + ORI[p.oi].dc},${p.r + ORI[p.oi].dr}`];

        if (activeSet.has(k2) && !tempBoard[k2]) {
            delete board[`${p.c + ORI[p.oi].dc},${p.r + ORI[p.oi].dr}`];
            orientIdx = nextOri;
            const h1 = orientIdx >= 2 ? 'b' : 'a', h2 = orientIdx >= 2 ? 'a' : 'b';
            board[k1] = { di: selDi, half: h1 };
            board[k2] = { di: selDi, half: h2 };
            placements[selDi].oi = orientIdx;
        } else {
            doLift(); // Fallback if rotation blocked
        }
    } else {
        orientIdx = nextOri;
    }
    syncBoardUI();
}

function doLift() {
    if (selDi === null || selMode !== 'grid') return;
    const p = placements[selDi];
    delete board[`${p.c},${p.r}`];
    delete board[`${p.c + ORI[p.oi].dc},${p.r + ORI[p.oi].dr}`];
    delete placements[selDi];
    usedDom.delete(selDi);
    selMode = 'hand'; renderHand(); syncBoardUI();
}

function validate() {
    if (usedDom.size < puzzle.dominoes.length) return;
    const errs = [];
    puzzle.regions.forEach((rg, idx) => {
        const vals = rg.cells.map(cc => {
            const b = board[`${cc[0]},${cc[1]}`];
            return b ? (b.half === 'a' ? puzzle.dominoes[b.di][0] : puzzle.dominoes[b.di][1]) : null;
        }).filter(v => v !== null);
        if (!chkRule(rg.rule, vals)) errs.push(idx);
    });
    if (errs.length === 0) {
        clearInterval(timerIv);
        document.getElementById('win-meta').textContent = `Время: ${document.getElementById('timer').textContent} | Костяшек: ${puzzle.dominoes.length}`;
        document.getElementById('win-ov').classList.add('on');
    }
}

function chkRule(r, v) {
    if (!v.length) return true;
    const sum = v.reduce((a, b) => a + b, 0);
    switch(r.type) {
        case 'sum': return sum === r.v;
        case 'eq': return v.every(x => x === v[0]);
        case 'neq': return new Set(v).size === v.length;
        case 'gt': return sum > r.v;
        case 'lt': return sum < r.v;
        default: return true;
    }
}

/* ══ PROCEDURAL GENERATION ══ */
function startRandom() {
    const rng = mkRng(Date.now());
    const cols = 6, rows = 6;
    let ac = [];
    const type = Math.floor(rng() * 4);
    if (type === 0) { // Cross
        for(let i=1; i<5; i++) { ac.push([i, 2]); ac.push([2, i]); }
    } else if (type === 1) { // S-shape
        for(let i=1; i<4; i++) ac.push([i, 1]);
        ac.push([3,2]);
        for(let i=3; i<6; i++) ac.push([i, 3]);
    } else if (type === 2) { // Islands (Procedural)
        const clusters = [[1,1], [4,4]];
        clusters.forEach(c => {
            ac.push([c[0], c[1]], [c[0]+1, c[1]], [c[0], c[1]+1], [c[0]+1, c[1]+1]);
        });
    } else { // Blob
        ac = [[1,1],[2,1],[3,1],[1,2],[2,2],[3,2],[2,3],[2,4]];
    }

    const unique = []; const seen = new Set();
    ac.forEach(c => { const k = `${c[0]},${c[1]}`; if(!seen.has(k)){ unique.push(c); seen.add(k); }});

    // Parity Fix with Leaf Node removal
    if (unique.length % 2 !== 0) {
        const findLeaf = () => {
            for(let i=0; i<unique.length; i++) {
                const [cx, cy] = unique[i];
                const n = [[cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]].filter(nb => seen.has(`${nb[0]},${nb[1]}`));
                if (n.length <= 1) return i;
            }
            return 0;
        };
        unique.splice(findLeaf(), 1);
    }

    const dominoes = Array.from({length: unique.length/2}, () => [Math.floor(rng()*7), Math.floor(rng()*7)]);
    const regions = [];
    for(let i=0; i<unique.length; i+=2) {
        const sumVal = dominoes[i/2][0] + dominoes[i/2][1]; // Guarantee solvable
        regions.push({ rule: {type:'sum', v: sumVal}, cells: [unique[i], unique[i+1]] });
    }
    startLevel({ cols, rows, activeCells: unique, dominoes, regions });
}

/* ══ EDITOR ══ */
let edState = { active: new Set(), regions: [], sel: new Set(), tool: 'toggle' };

function openEditor() { showScreen('editor'); renderEditor(); }

function renderEditor() {
    const grid = document.getElementById('e-grid');
    const sz = 40;
    grid.style.gridTemplateColumns = `repeat(8, ${sz}px)`;
    grid.innerHTML = '';
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            const key = `${c},${r}`;
            const cell = document.createElement('div');
            cell.className = 'cell ' + (edState.active.has(key) ? 'active' : 'inactive');
            if (edState.sel.has(key)) cell.classList.add('sel-ed');
            cell.style.width = sz + 'px'; cell.style.height = sz + 'px';

            const regIdx = edState.regions.findIndex(rg => rg.cells.some(cc => cc[0] === c && cc[1] === r));
            if (regIdx !== -1 && edState.active.has(key)) {
                cell.style.background = ZC[regIdx % ZC.length].bg;
                cell.style.border = `2px solid ${ZC[regIdx % ZC.length].bd}`;
                const rule = edState.regions[regIdx].rule.type;
                cell.innerHTML = `<span style="font-size:8px; position:absolute; top:2px; left:2px; color:${ZC[regIdx % ZC.length].bd}">${rule}</span>`;
            }

            cell.onclick = () => {
                if (edState.tool === 'toggle') {
                    if (edState.active.has(key)) edState.active.delete(key); else edState.active.add(key);
                } else {
                    if (edState.sel.has(key)) edState.sel.delete(key); else if (edState.active.has(key)) edState.sel.add(key);
                }
                renderEditor();
            };
            grid.appendChild(cell);
        }
    }
}

function setTool(t) {
    edState.tool = t;
    document.getElementById('t-toggle').classList.toggle('act', t === 'toggle');
    document.getElementById('t-rule').classList.toggle('act', t === 'rule');
    edState.sel.clear(); renderEditor();
}

function applyRule(type) {
    if (edState.sel.size === 0) return;
    let v = 0;
    if (['sum','gt','lt'].includes(type)) v = parseInt(prompt("Значение для правила:", "5")) || 0;
    edState.regions.push({ rule: {type, v}, cells: Array.from(edState.sel).map(k => k.split(',').map(Number)) });
    edState.sel.clear(); renderEditor();
}

function clearRegions() { edState.regions = []; renderEditor(); }

function testEditor() {
    if (edState.active.size % 2 !== 0) { alert("Нечетное кол-во клеток!"); return; }
    const lv = {
        cols: 8, rows: 8,
        activeCells: Array.from(edState.active).map(k => k.split(',').map(Number)),
        dominoes: Array.from({length: edState.active.size/2}, () => [Math.floor(Math.random()*7), Math.floor(Math.random()*7)]),
        regions: edState.regions
    };
    startLevel(lv);
}

/* ══ SHARING ══ */
function serializePuzzle() {
    const data = {
        c: puzzle.cols, r: puzzle.rows,
        a: puzzle.activeCells,
        d: puzzle.dominoes,
        rg: puzzle.regions
    };
    return btoa(JSON.stringify(data));
}

function shareLevel() {
    const b64 = serializePuzzle();
    const url = `${window.location.origin}${window.location.pathname}?p=${b64}`;
    navigator.clipboard.writeText(url).then(() => alert("Ссылка скопирована!"));
}

/* ══ INIT ══ */
window.onload = () => {
    const params = new URLSearchParams(window.location.search);
    const p = params.get('p');
    if (p) {
        try {
            const d = JSON.parse(atob(p));
            startLevel({cols: d.c, rows: d.r, activeCells: d.a, dominoes: d.d, regions: d.rg});
            window.history.replaceState({}, document.title, window.location.pathname);
        } catch(e) { startRandom(); }
    }
};

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
}

function goMenu() { clearInterval(timerIv); showScreen('menu'); }
function resetPuzzle() { startLevel(puzzle); }

</script>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <title>Pips Daily</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf9f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 8px;
      touch-action: manipulation;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 4px;
      color: #222;
      margin-bottom: 10px;
      font-weight: 900;
    }

    /* ── Легенда зон ───────────────────────────────── */
    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      max-width: 380px;
      margin-bottom: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      color: #444;
      background: white;
      padding: 3px 7px;
      border-radius: 10px;
      border: 1px solid #ddd;
    }
    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 3px;
      border: 2px solid;
      flex-shrink: 0;
    }

    /* ── Сетка ─────────────────────────────────────── */
    #grid-wrap {
      background: #bbb;
      padding: 7px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    #grid {
      display: grid;
      gap: 3px;
    }

    .cell {
      width: 58px; height: 58px;
      background: #f0f0f0;
      border: 2px solid #ccc;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: filter 0.1s, box-shadow 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .cell:active { filter: brightness(0.9); }
    .cell.can-place { box-shadow: 0 0 0 3px #007bff inset; }
    .cell.occupied { cursor: pointer; }
    .cell.win { box-shadow: 0 0 0 3px #28a745 inset; }

    .rule-lbl {
      position: absolute;
      top: 2px; right: 3px;
      font-size: 9px;
      font-weight: 800;
      color: #444;
      background: rgba(255,255,255,0.75);
      padding: 0 2px;
      border-radius: 3px;
      line-height: 14px;
      pointer-events: none;
    }

    .pip-circle {
      width: 30px; height: 30px;
      background: rgba(255,255,255,0.92);
      border: 2.5px solid #333;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      font-weight: bold;
      color: #222;
      pointer-events: none;
      position: absolute;
    }

    /* ── Статус + кнопки ───────────────────────────── */
    #status {
      margin: 10px 0 6px;
      font-size: 13px;
      color: #555;
      text-align: center;
      min-height: 18px;
    }

    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }

    .ctrl-btn {
      padding: 7px 14px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      background: #007bff;
      color: white;
    }
    .ctrl-btn:disabled { background: #ccc; color: #888; cursor: default; }
    .ctrl-btn.secondary { background: #f0f0f0; color: #444; border: 1px solid #ccc; }

    #orient-lbl {
      font-size: 12px;
      color: #666;
      min-width: 80px;
    }

    /* ── Рука (домино) ─────────────────────────────── */
    #hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      max-width: 380px;
      padding: 4px;
    }

    .domino {
      display: flex;
      align-items: center;
      background: white;
      border: 2.5px solid #aaa;
      border-radius: 8px;
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .domino:active { transform: scale(0.96); }
    .domino.selected {
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0,123,255,0.35);
    }
    .domino.used { opacity: 0.25; pointer-events: none; }

    .d-half {
      width: 36px; height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: bold;
      color: #222;
    }
    .d-sep {
      width: 2px; height: 28px;
      background: #aaa;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<h1>🁣 PIPS DAILY</h1>
<div id="legend"></div>
<div id="grid-wrap"><div id="grid"></div></div>
<div id="status">Выберите костяшку снизу, затем нажмите на клетку</div>
<div id="controls">
  <button class="ctrl-btn" id="btn-rotate" disabled onclick="rotateSelected()">🔄 Повернуть</button>
  <span id="orient-lbl"></span>
  <button class="ctrl-btn secondary" onclick="resetGame()">↺ Сброс</button>
</div>
<div id="hand"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ═══════════════════════════════════════════
   КОНФИГУРАЦИЯ ПАЗЛА
   Здесь можно менять любой пазл.
   ═══════════════════════════════════════════ */
const PUZZLE = {
  cols: 4,
  rows: 3,

  /*
    Правила зон:
      { type: 'sum',  value: N }   — сумма половинок в зоне = N
      { type: 'eq'              }   — все половинки одинаковые
      { type: 'neq'             }   — все половинки разные
      { type: 'gt',  value: N }    — каждая половинка > N
      { type: 'lt',  value: N }    — каждая половинка < N
      { type: 'none'            }   — без правила (серая)
  */
  regions: [
    {
      id: 0,
      name: 'Красная (сумма)',
      rule: { type: 'sum', value: 6 },
      cells: [[0,0],[1,0],[0,1],[1,1]]
    },
    {
      id: 1,
      name: 'Синяя (=)',
      rule: { type: 'eq' },
      cells: [[2,0],[3,0]]
    },
    {
      id: 2,
      name: 'Зелёная (>1)',
      rule: { type: 'gt', value: 1 },
      cells: [[2,1],[3,1]]
    },
    {
      id: 3,
      name: 'Свободная',
      rule: { type: 'none' },
      cells: [[0,2],[1,2],[2,2],[3,2]]
    }
  ],

  /*
    Домино: каждое — пара [a, b].
    Решение этого пазла (одно из возможных):
      [1,2] горизонтально → (0,0)+(1,0)  } в красной: 1+2+0+3=6 ✓
      [0,3] горизонтально → (0,1)+(1,1)  }
      [2,2] горизонтально → (2,0)+(3,0)    в синей:   2=2 ✓
      [3,2] горизонтально → (2,1)+(3,1)    в зелёной: 3>1 и 2>1 ✓
      [1,4] горизонтально → (0,2)+(1,2)  } свободная
      [2,1] горизонтально → (2,2)+(3,2)  }
  */
  dominoes: [
    [1, 2],
    [0, 3],
    [2, 2],
    [3, 2],
    [1, 4],
    [2, 1],
  ]
};

/* ── Цвета зон ─────────────────────────────────────── */
const COLORS = [
  { bg: '#ffd6d6', border: '#e05050' },
  { bg: '#d6e8ff', border: '#4a7edd' },
  { bg: '#d6ffd9', border: '#4baa55' },
  { bg: '#f9d6ff', border: '#b44bcf' },
  { bg: '#fff4d6', border: '#d4962a' },
];

/* ── Вспомогательные функции ───────────────────────── */
function ruleShort(rule) {
  switch (rule.type) {
    case 'sum':  return `=${rule.value}`;
    case 'eq':   return `=`;
    case 'neq':  return `≠`;
    case 'gt':   return `>${rule.value}`;
    case 'lt':   return `<${rule.value}`;
    default:     return '';
  }
}
function ruleText(rule) {
  switch (rule.type) {
    case 'sum':  return `сумма = ${rule.value}`;
    case 'eq':   return `все одинаковые`;
    case 'neq':  return `все разные`;
    case 'gt':   return `каждый > ${rule.value}`;
    case 'lt':   return `каждый < ${rule.value}`;
    default:     return 'без правила';
  }
}

/* ── Состояние ─────────────────────────────────────── */
let state = {
  board: {},         // key "c,r" → { dominoIdx, half: 'a'|'b' }
  usedDominoes: new Set(),
  selectedDomino: null,
  orientation: 'h', // 'h' или 'v'
};

/* ── Строим карту cell→region ──────────────────────── */
const cellRegion = {};
const regionFirstCell = {};
PUZZLE.regions.forEach(region => {
  regionFirstCell[region.id] = region.cells[0];
  region.cells.forEach(([c, r]) => { cellRegion[`${c},${r}`] = region.id; });
});

/* ── Легенда ───────────────────────────────────────── */
const legendEl = document.getElementById('legend');
PUZZLE.regions.forEach(region => {
  if (region.rule.type === 'none') return;
  const col = COLORS[region.id % COLORS.length];
  const div = document.createElement('div');
  div.className = 'legend-item';
  div.innerHTML = `
    <div class="legend-dot" style="background:${col.bg};border-color:${col.border}"></div>
    <span>${ruleText(region.rule)}</span>
  `;
  legendEl.appendChild(div);
});

/* ── Сетка ─────────────────────────────────────────── */
const gridEl = document.getElementById('grid');
gridEl.style.gridTemplateColumns = `repeat(${PUZZLE.cols}, 58px)`;
gridEl.style.gridTemplateRows    = `repeat(${PUZZLE.rows}, 58px)`;

const cellEls = {};

for (let r = 0; r < PUZZLE.rows; r++) {
  for (let c = 0; c < PUZZLE.cols; c++) {
    const key = `${c},${r}`;
    const cell = document.createElement('div');
    cell.className = 'cell';

    const rid = cellRegion[key];
    if (rid !== undefined) {
      const col = COLORS[rid % COLORS.length];
      cell.style.background = col.bg;
      cell.style.borderColor = col.border;

      const [fc, fr] = regionFirstCell[rid];
      if (fc === c && fr === r) {
        const short = ruleShort(PUZZLE.regions[rid].rule);
        if (short) {
          const lbl = document.createElement('div');
          lbl.className = 'rule-lbl';
          lbl.textContent = short;
          cell.appendChild(lbl);
        }
      }
    }

    cell.onclick = () => cellClicked(c, r);
    cellEls[key] = cell;
    gridEl.appendChild(cell);
  }
}

/* ── Рука (домино) ─────────────────────────────────── */
const handEl = document.getElementById('hand');
const dominoEls = [];

PUZZLE.dominoes.forEach(([a, b], idx) => {
  const tile = document.createElement('div');
  tile.className = 'domino';
  tile.innerHTML = `
    <div class="d-half">${a}</div>
    <div class="d-sep"></div>
    <div class="d-half">${b}</div>
  `;
  tile.onclick = () => selectDomino(idx);
  handEl.appendChild(tile);
  dominoEls.push(tile);
});

/* ── Логика выбора и размещения ────────────────────── */
function selectDomino(idx) {
  if (state.usedDominoes.has(idx)) return;

  if (state.selectedDomino === idx) {
    deselect(); return;
  }
  if (state.selectedDomino !== null) dominoEls[state.selectedDomino].classList.remove('selected');

  state.selectedDomino = idx;
  dominoEls[idx].classList.add('selected');
  document.getElementById('btn-rotate').disabled = false;
  updateOrientLabel();
  setStatus('Нажмите на клетку для размещения (первая клетка)');
}

function deselect() {
  if (state.selectedDomino !== null) dominoEls[state.selectedDomino].classList.remove('selected');
  state.selectedDomino = null;
  document.getElementById('btn-rotate').disabled = true;
  document.getElementById('orient-lbl').textContent = '';
}

function rotateSelected() {
  state.orientation = state.orientation === 'h' ? 'v' : 'h';
  updateOrientLabel();
}

function updateOrientLabel() {
  document.getElementById('orient-lbl').textContent =
    state.orientation === 'h' ? '→ горизонт.' : '↓ вертикал.';
}

function cellClicked(c, r) {
  const key = `${c},${r}`;

  // Клик по занятой клетке — убрать домино
  if (state.board[key]) {
    removeDomino(state.board[key].dominoIdx);
    return;
  }

  if (state.selectedDomino === null) {
    setStatus('Сначала выберите костяшку снизу');
    return;
  }

  // Вторая клетка по ориентации
  const c2 = state.orientation === 'h' ? c + 1 : c;
  const r2 = state.orientation === 'h' ? r : r + 1;

  if (c2 >= PUZZLE.cols || r2 >= PUZZLE.rows) {
    setStatus('Костяшка не помещается — попробуйте повернуть');
    return;
  }

  const key2 = `${c2},${r2}`;
  if (state.board[key2]) {
    setStatus('Соседняя клетка занята');
    return;
  }

  // Размещаем
  const idx = state.selectedDomino;
  state.board[key]  = { dominoIdx: idx, half: 'a' };
  state.board[key2] = { dominoIdx: idx, half: 'b' };
  state.usedDominoes.add(idx);

  dominoEls[idx].classList.remove('selected');
  dominoEls[idx].classList.add('used');
  state.selectedDomino = null;
  document.getElementById('btn-rotate').disabled = true;
  document.getElementById('orient-lbl').textContent = '';

  renderBoard();
  validateAndCheck();
}

function removeDomino(idx) {
  Object.keys(state.board).forEach(key => {
    if (state.board[key]?.dominoIdx === idx) delete state.board[key];
  });
  state.usedDominoes.delete(idx);
  dominoEls[idx].classList.remove('used');
  renderBoard();
  setStatus('Костяшка убрана — можно переставить');
}

function resetGame() {
  state.board = {};
  state.usedDominoes.clear();
  deselect();
  state.orientation = 'h';
  dominoEls.forEach(el => el.classList.remove('used', 'selected'));
  renderBoard();
  setStatus('Игра сброшена. Выберите костяшку снизу');
  // Убираем win-подсветку
  Object.values(cellEls).forEach(el => el.classList.remove('win'));
}

/* ── Отрисовка состояния доски ─────────────────────── */
function renderBoard() {
  for (let r = 0; r < PUZZLE.rows; r++) {
    for (let c = 0; c < PUZZLE.cols; c++) {
      const key = `${c},${r}`;
      const cell = cellEls[key];
      cell.querySelector('.pip-circle')?.remove();

      const info = state.board[key];
      if (info) {
        const [a, b] = PUZZLE.dominoes[info.dominoIdx];
        const val = info.half === 'a' ? a : b;

        const pip = document.createElement('div');
        pip.className = 'pip-circle';
        pip.textContent = val;
        cell.appendChild(pip);
      }
    }
  }
}

/* ── Валидация ─────────────────────────────────────── */
function validateAndCheck() {
  const total = PUZZLE.dominoes.length;
  const placed = state.usedDominoes.size;

  if (placed < total) {
    setStatus(`Размещено ${placed} из ${total} костяшек`);
    return;
  }

  // Проверяем каждую зону
  const errors = [];
  PUZZLE.regions.forEach(region => {
    if (region.rule.type === 'none') return;

    const vals = region.cells.map(([c, r]) => {
      const info = state.board[`${c},${r}`];
      if (!info) return null;
      const [a, b] = PUZZLE.dominoes[info.dominoIdx];
      return info.half === 'a' ? a : b;
    }).filter(v => v !== null);

    if (!checkRule(region.rule, vals)) errors.push(region.name);
  });

  if (errors.length === 0) {
    setStatus('🎉 ПОБЕДА! Все условия выполнены!');
    Object.values(cellEls).forEach(el => el.classList.add('win'));
    if (tg) tg.MainButton.setText('✅ Готово!').show();
  } else {
    setStatus(`❌ Условие нарушено: ${errors.map(n => n.split(' ')[0]).join(', ')}`);
  }
}

function checkRule(rule, vals) {
  if (!vals.length) return true;
  switch (rule.type) {
    case 'sum':  return vals.reduce((s, v) => s + v, 0) === rule.value;
    case 'eq':   return vals.every(v => v === vals[0]);
    case 'neq':  return new Set(vals).size === vals.length;
    case 'gt':   return vals.every(v => v > rule.value);
    case 'lt':   return vals.every(v => v < rule.value);
    default:     return true;
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

// Инициализация
updateOrientLabel();
setStatus('Выберите костяшку снизу, затем нажмите на клетку');
</script>
</body>
</html>

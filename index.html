<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #222; color: white; text-align: center; padding-top: 50px; font-family: sans-serif; }
        .test-box { border: 2px solid #00ff00; padding: 20px; display: inline-block; }
    </style>
</head>
<body>
    <div class="test-box">
        <h1>Pips MVP: РАБОТАЕТ!</h1>
        <p>Если ты это видишь, значит хостинг настроен.</p>
        <button onclick="changeColor()">Нажми меня</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function changeColor() {
            document.body.style.backgroundColor = 'blue';
            // Проверка связи с Telegram
            tg.MainButton.setText("ПОБЕДА").show();
        }
    </script>
</body>
</html>

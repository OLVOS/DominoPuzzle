<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --cell-size: 42px; }
        body { font-family: sans-serif; background: #faf9f6; margin: 0; display: flex; flex-direction: column; align-items: center; user-select: none; }

        /* Сетка и слои */
        .game-container { position: relative; margin-top: 20px; }
        .grid { display: grid; grid-template-columns: repeat(7, var(--cell-size)); grid-template-rows: repeat(8, var(--cell-size)); gap: 2px; background: #ddd; border: 2px solid #ccc; }
        .cell { width: var(--cell-size); height: var(--cell-size); background: white; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; position: relative; z-index: 1; }

        /* Зоны */
        .zone-pink { background: #ffdae9; }
        .zone-blue { background: #d1d9e6; }

        /* Лейблы (условия) поверх всего */
        .target-label { position: absolute; width: 20px; height: 20px; background: #e91e63; color: white; border-radius: 50%;
                        font-size: 12px; display: flex; align-items: center; justify-content: center; z-index: 10; pointer-events: none; }
        .blue-label { background: #3f51b5; }

        /* Костяшки в руке */
        .hand { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 10px; }
        .domino { display: flex; border: 2px solid #444; border-radius: 4px; cursor: pointer; background: white; overflow: hidden; }
        .domino.selected { border-color: #007bff; box-shadow: 0 0 10px rgba(0,123,255,0.5); transform: scale(1.1); }
        .domino div { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; border-right: 1px solid #444; }
        .domino div:last-child { border-right: none; }

        .controls { margin-top: 15px; }
        .btn { padding: 10px 20px; border-radius: 8px; border: none; background: #007bff; color: white; font-weight: bold; }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="grid" id="grid"></div>
        </div>

    <div class="hand" id="hand"></div>

    <div class="controls">
        <button class="btn" onclick="location.reload()">Сбросить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const config = {
            zones: [
                { id: 'pink_6', target: 6, cells: [[4,5], [4,6]], color: 'zone-pink', lPos: [4.5, 5] },
                { id: 'blue_9', target: 9, cells: [[2,2], [3,2], [2,3]], color: 'zone-blue', lPos: [2.5, 2] }
            ],
            // Настоящие костяшки из твоего скриншота (пары)
            pips: [[1,5], [3,3], [0,1], [4,2], [6,0]]
        };

        let selectedPipIndex = null;
        const board = {}; // Состояние поля

        // Создаем сетку
        const gridEl = document.getElementById('grid');
        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 7; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `c-${x}-${y}`;

                const zone = config.zones.find(z => z.cells.some(c => c[0] === x && c[1] === y));
                if (zone) cell.classList.add(zone.color);

                cell.onclick = () => placeDomino(x, y);
                gridEl.appendChild(cell);
            }
        }

        // Рисуем лейблы сумм
        config.zones.forEach(z => {
            const label = document.createElement('div');
            label.className = `target-label ${z.id.includes('blue') ? 'blue-label' : ''}`;
            label.innerText = z.target;
            label.style.left = (z.lPos[0] * 44) + 'px'; // 44 = size + gap
            label.style.top = (z.lPos[1] * 44) + 'px';
            document.querySelector('.game-container').appendChild(label);
        });

        // Рисуем костяшки в руке
        const handEl = document.getElementById('hand');
        config.pips.forEach((pair, index) => {
            const d = document.createElement('div');
            d.className = 'domino';
            d.innerHTML = `<div>${pair[0]}</div><div>${pair[1]}</div>`;
            d.onclick = () => {
                document.querySelectorAll('.domino').forEach(el => el.classList.remove('selected'));
                d.classList.add('selected');
                selectedPipIndex = index;
            };
            handEl.appendChild(d);
        });

        function placeDomino(x, y) {
            if (selectedPipIndex === null) return;

            const pair = config.pips[selectedPipIndex];

            // Логика: ставим горизонтально (x и x+1)
            if (x < 6) {
                const c1 = document.getElementById(`c-${x}-${y}`);
                const c2 = document.getElementById(`c-${x+1}-${y}`);

                c1.innerText = pair[0];
                c2.innerText = pair[1];

                board[`${x},${y}`] = pair[0];
                board[`${x+1},${y}`] = pair[1];

                checkWin();
            }
        }

        function checkWin() {
            let win = true;
            config.zones.forEach(z => {
                const sum = z.cells.reduce((s, c) => s + (board[`${c[0]},${c[1]}`] || 0), 0);
                if (sum !== z.target) win = false;
            });

            if (win) {
                tg.showAlert("Победа! Вы решили Pips!");
                tg.MainButton.setText("ЗАВЕРШИТЬ").show();
            }
        }
    </script>
</body>
</html>

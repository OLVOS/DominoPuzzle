<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --cream: #f5efe3; --dark: #1b1208; --gold: #c8963e;
            --cell: 50px; --pip-dark: #1b1208; --pip-light: #f0e8d8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--cream); display: flex; flex-direction: column; align-items: center; touch-action: none; overflow: hidden; height: 100vh; }

        .header { margin: 15px 0; font-weight: bold; color: var(--dark); letter-spacing: 2px; }

        /* Игровое поле */
        #grid-wrap { background: #3b1e0c; padding: 8px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        #grid { display: grid; gap: 4px; }
        .cell { width: var(--cell); height: var(--cell); background: #e8e2d8; border-radius: 6px; position: relative; display: flex; align-items: center; justify-content: center; }
        .cell.zone-pink { background: #f7d6e0; border: 1px solid #c8457a; }
        .cell.zone-blue { background: #cfe3f7; border: 1px solid #2f78c1; }

        /* Костяшка на поле (DOMINO) */
        .domino-placed {
            position: absolute; background: var(--pip-dark); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; z-index: 10;
            border: 2px solid var(--gold); box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            cursor: pointer; transition: transform 0.2s;
        }

        /* Рукав и костяшки */
        #hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 20px; padding: 10px; width: 100%; max-height: 150px; overflow-y: auto; }
        .dom-tile {
            background: var(--pip-dark); border: 3px solid var(--gold); border-radius: 10px;
            width: 80px; height: 40px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; position: relative;
        }
        .dom-tile.selected { border-color: #f0c060; transform: scale(1.1); box-shadow: 0 0 15px rgba(240,192,96,0.6); }
        .dom-tile.used { opacity: 0.2; pointer-events: none; }

        /* Кнопки */
        .controls { display: flex; gap: 10px; margin-top: 20px; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; background: var(--dark); color: white; font-weight: bold; cursor: pointer; }
        .btn:disabled { opacity: 0.3; }

        /* Точки */
        .pip-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; width: 24px; height: 24px; }
        .dot { width: 6px; height: 6px; background: var(--pip-light); border-radius: 50%; visibility: hidden; }
        .dot.active { visibility: visible; }
        .sep { width: 2px; height: 30px; background: var(--gold); margin: 0 5px; opacity: 0.5; }
        .sep-v { width: 30px; height: 2px; background: var(--gold); margin: 5px 0; opacity: 0.5; }
    </style>
</head>
<body>

    <div class="header">PIPS PUZZLE</div>

    <div id="grid-wrap">
        <div id="grid"></div>
    </div>

    <div class="controls">
        <button id="btn-rot" class="btn" onclick="rotateSelected()" disabled>🔄 ПОВЕРНУТЬ</button>
        <button class="btn" onclick="resetGame()">↺ СБРОС</button>
    </div>

    <div id="hand"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        // 0: Вправо, 1: Вниз, 2: Влево, 3: Вверх
        const ORIENTS = [
            { dc: 1, dr: 0, rot: 0, cssW: 2, cssH: 1 },
            { dc: 0, dr: 1, rot: 90, cssW: 1, cssH: 2 },
            { dc: -1, dr: 0, rot: 180, cssW: 2, cssH: 1 },
            { dc: 0, dr: -1, rot: 270, cssW: 1, cssH: 2 }
        ];

        const PIP_MAP = {
            0: [], 1: [4], 2: [0, 8], 3: [0, 4, 8],
            4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
        };

        const config = {
            cols: 7, rows: 8,
            zones: [
                { target: 6, cells: [[4,5], [4,6]], color: 'zone-pink' },
                { target: 9, cells: [[2,2], [3,2], [2,3]], color: 'zone-blue' }
            ],
            dominoes: [[1,5], [3,3], [0,1], [4,2], [6,0]]
        };

        let selectedId = null;
        let curOrient = 0;
        let usedIndices = new Set();
        let boardState = {}; // "x,y" -> {val, id}

        function createPips(n) {
            const container = document.createElement('div');
            container.className = 'pip-container';
            for (let i = 0; i < 9; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot' + (PIP_MAP[n].includes(i) ? ' active' : '');
                container.appendChild(dot);
            }
            return container;
        }

        function initGrid() {
            const grid = document.getElementById('grid');
            grid.style.gridTemplateColumns = `repeat(${config.cols}, var(--cell))`;
            for (let r = 0; r < config.rows; r++) {
                for (let c = 0; c < config.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.id = `c-${c}-${r}`;
                    const zone = config.zones.find(z => z.cells.some(cc => cc[0] === c && cc[1] === r));
                    if (zone) cell.classList.add(zone.color);
                    cell.onclick = () => placeAt(c, r);
                    grid.appendChild(cell);
                }
            }
        }

        function renderHand() {
            const hand = document.getElementById('hand');
            hand.innerHTML = '';
            config.dominoes.forEach((pair, i) => {
                const tile = document.createElement('div');
                tile.className = 'dom-tile' + (selectedId === i ? ' selected' : '') + (usedIndices.has(i) ? ' used' : '');

                const inner = document.createElement('div');
                inner.style.display = 'flex';
                inner.style.alignItems = 'center';
                inner.style.transform = `rotate(${selectedId === i ? ORIENTS[curOrient].rot : 0}deg)`;

                inner.appendChild(createPips(pair[0]));
                inner.appendChild(document.createElement('div')).className = 'sep';
                inner.appendChild(createPips(pair[1]));

                tile.appendChild(inner);
                tile.onclick = () => selectTile(i);
                hand.appendChild(tile);
            });
        }

        function selectTile(id) {
            if (usedIndices.has(id)) return;
            selectedId = (selectedId === id) ? null : id;
            document.getElementById('btn-rot').disabled = selectedId === null;
            renderHand();
        }

        function rotateSelected() {
            if (selectedId === null) return;
            curOrient = (curOrient + 1) % 4;
            renderHand();
        }

        function placeAt(c, r) {
            // Если кликнули по уже занятой клетке, "поднимаем" доминошку
            if (boardState[`${c},${r}`] !== undefined) {
                const id = boardState[`${c},${r}`].id;
                liftTile(id);
                return;
            }

            if (selectedId === null) return;

            const o = ORIENTS[curOrient];
            const c2 = c + o.dc, r2 = r + o.dr;

            // Проверка границ и занятости
            if (c2 < 0 || c2 >= config.cols || r2 < 0 || r2 >= config.rows || boardState[`${c2},${r2}`]) return;

            // Размещаем визуально
            const pair = config.dominoes[selectedId];
            const dom = document.createElement('div');
            dom.className = 'domino-placed';
            dom.id = `placed-${selectedId}`;

            // Размер и позиция
            dom.style.width = `calc(var(--cell) * ${o.cssW})`;
            dom.style.height = `calc(var(--cell) * ${o.cssH})`;

            const inner = document.createElement('div');
            inner.style.display = 'flex';
            inner.style.flexDirection = (o.cssH > 1) ? 'column' : 'row';
            inner.style.alignItems = 'center';

            inner.appendChild(createPips(pair[0]));
            inner.appendChild(document.createElement('div')).className = (o.cssH > 1) ? 'sep-v' : 'sep';
            inner.appendChild(createPips(pair[1]));

            dom.appendChild(inner);

            // Позиционирование в сетке
            const startCell = document.getElementById(`c-${Math.min(c, c2)}-${Math.min(r, r2)}`);
            startCell.appendChild(dom);

            // Сохраняем состояние
            boardState[`${c},${r}`] = { val: pair[0], id: selectedId };
            boardState[`${c2},${r2}`] = { val: pair[1], id: selectedId };
            usedIndices.add(selectedId);

            const lastId = selectedId;
            selectedId = null;
            document.getElementById('btn-rot').disabled = true;
            renderHand();
            checkWin();
        }

        function liftTile(id) {
            // Удаляем с поля
            const el = document.getElementById(`placed-${id}`);
            if (el) el.remove();

            // Чистим состояние
            for (let key in boardState) {
                if (boardState[key].id === id) delete boardState[key];
            }
            usedIndices.delete(id);
            selectedId = id;
            document.getElementById('btn-rot').disabled = false;
            renderHand();
        }

        function checkWin() {
            let win = config.zones.every(z => {
                const sum = z.cells.reduce((s, cc) => s + (boardState[`${cc[0]},${cc[1]}`]?.val || 0), 0);
                return sum === z.target;
            });
            if (win && usedIndices.size > 0) tg.MainButton.setText("ПОБЕДА!").show();
        }

        function resetGame() {
            location.reload();
        }

        initGrid();
        renderHand();
    </script>
</body>
</html>

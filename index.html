<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Pips</title>
<style>
:root{--cream:#f5efe3;--dark:#1b1208;--gold:#c8963e;--gold2:#f0c060;--wood:#3b1e0c;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;}
html,body{height:100%;overflow:hidden;touch-action:none;}
body{font-family:'DM Mono',monospace;background:var(--cream);}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;
  overflow:hidden;transition:opacity .25s,transform .25s;}
.screen.hidden{opacity:0;pointer-events:none;transform:scale(.97);}

/* ══ MENU ══ */
#menu{background:radial-gradient(ellipse at 30% 20%,#2d1a06,#080503);
  justify-content:center;gap:12px;padding:24px 20px;}
.menu-title{font-family:'Playfair Display',serif;font-size:3.2rem;font-weight:900;
  color:var(--gold2);letter-spacing:6px;text-shadow:0 0 40px rgba(200,150,60,.45);line-height:1;}
.menu-sub{font-size:.58rem;letter-spacing:8px;color:#b89060;text-transform:uppercase;}
.divider{width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.level-list{width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:52vh;}
.level-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(200,150,60,.28);
  border-radius:12px;padding:11px 15px;display:flex;align-items:center;gap:11px;
  cursor:pointer;transition:all .15s;color:var(--cream);}
.level-card:active{background:rgba(200,150,60,.15);transform:scale(.98);}
.lc-badge{width:36px;height:36px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--gold),#7a4a10);
  display:flex;align-items:center;justify-content:center;
  font-family:'Playfair Display',serif;font-size:.95rem;font-weight:700;color:var(--dark);
  box-shadow:2px 2px 0 rgba(0,0,0,.45);}
.lc-info{flex:1;}.lc-name{font-size:.75rem;letter-spacing:1px;}
.lc-meta{font-size:.58rem;color:#a08050;margin-top:2px;}
.lc-stars{font-size:.8rem;color:var(--gold2);}
.btn-rnd{background:linear-gradient(135deg,var(--gold),#7a4a10);color:var(--dark);border:none;
  font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;
  letter-spacing:3px;padding:12px 26px;border-radius:12px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.4);width:100%;max-width:320px;}
.btn-rnd:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.4);}

/* ══ GAME ══ */
#game{background:var(--cream);justify-content:flex-start;padding:0 10px 10px;overflow-y:auto;}
.game-header{width:100%;display:flex;align-items:center;gap:8px;padding:10px 0 6px;flex-shrink:0;}
.btn-back{background:var(--dark);color:var(--gold2);border:none;font-size:.66rem;letter-spacing:2px;
  padding:6px 11px;border-radius:7px;cursor:pointer;flex-shrink:0;}
.gh-center{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;}
.game-title{font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;color:var(--dark);letter-spacing:2px;}
.game-timer{font-size:.88rem;color:var(--gold);letter-spacing:4px;}
.game-stars{font-size:.76rem;color:var(--gold);flex-shrink:0;}

#legend{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:6px;flex-shrink:0;}
.lg{display:flex;align-items:center;gap:5px;background:white;border:1px solid #ddd;
  border-radius:8px;padding:3px 9px;font-size:.62rem;color:#444;font-weight:500;}
.lg-dot{width:12px;height:12px;border-radius:3px;border:2px solid;flex-shrink:0;}

/* ── Grid ── */
#grid-outer{position:relative;flex-shrink:0;margin-bottom:7px;}
#grid-wrap{background:var(--wood);padding:7px;border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.07);
  position:relative;display:inline-block;}

#grid{display:grid;position:relative;z-index:1;}
.cell{border-radius:7px;cursor:pointer;position:relative;flex-shrink:0;}
.cell.active{background:#e8e2d8;border:2px solid #c0b8a8;}
.cell.inactive{background:transparent!important;border:none!important;pointer-events:none;}
.cell.hl-ok{background:#d0e8f8!important;border-color:#3a80d9!important;}
.cell.hl-bad{background:#f8d8d8!important;border-color:#c03030!important;}
.cell.err-zone{animation:errpulse 1.5s ease infinite;}
@keyframes errpulse{0%,100%{opacity:1}50%{opacity:.55}}
.cell.win-c{animation:winpulse .65s ease infinite alternate;}
@keyframes winpulse{
  from{box-shadow:0 0 0 2px #3a9c55 inset;}
  to{box-shadow:0 0 0 3px #3a9c55 inset,0 0 10px rgba(58,156,85,.3);}
}

/* ── Placed domino layer (below zone overlay) ── */
#dom-layer{position:absolute;left:7px;top:7px;z-index:8;pointer-events:none;}

/* ── Zone color overlay (ABOVE dominos, below badges) ── */
#zone-overlay{position:absolute;left:7px;top:7px;z-index:15;pointer-events:none;}
.zone-cell-overlay{
  position:absolute;
  border-radius:6px;
  border:2.5px solid;
  /* semi-transparent fill so pip dots still visible */
  opacity:0;  /* normally invisible */
  transition:opacity .15s;
  pointer-events:none;
}
.zone-cell-overlay.err{opacity:.35!important;}

/* ── Rule badge overlay ── */
#rule-overlay{position:absolute;left:7px;top:7px;z-index:25;pointer-events:none;}
.rule-badge{
  position:absolute;transform:translate(-50%,-50%);
  font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.5px;
  padding:3px 7px;border-radius:6px;border:2px solid;
  box-shadow:0 2px 8px rgba(0,0,0,.7),0 0 0 1.5px rgba(255,255,255,.15);
  white-space:nowrap;backdrop-filter:blur(4px);
  line-height:1.3;
}

/* ── Status ── */
#status{font-size:.64rem;letter-spacing:.5px;color:#777;min-height:14px;
  text-align:center;margin-bottom:5px;flex-shrink:0;padding:0 8px;}

/* ── Controls ── */
#controls{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;
  justify-content:center;flex-shrink:0;align-items:center;}
.ctrl{background:var(--dark);color:var(--gold2);border:none;
  font-family:'DM Mono',monospace;font-size:.65rem;letter-spacing:1px;
  padding:7px 13px;border-radius:8px;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.35);transition:all .1s;}
.ctrl:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35);}
.ctrl:disabled{background:#c0c0c0;color:#888;box-shadow:none;cursor:default;}
.ctrl.warn{background:#7a1818;}
.ctrl.lite{background:#e4dcd0;color:var(--wood);}
.opill{background:rgba(0,0,0,.1);border-radius:8px;padding:5px 10px;
  font-size:.9rem;font-weight:700;color:var(--dark);min-width:28px;text-align:center;}

/* ══ HAND TRAY ══ */
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;
  max-width:400px;padding:4px 2px;overflow-y:auto;max-height:170px;flex-shrink:0;}

/* Fixed-size slot — never changes size */
.hand-slot{
  flex-shrink:0;
  width:76px;height:76px;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;cursor:pointer;
  border:2px solid transparent;
  background:rgba(0,0,0,.05);
  transition:border-color .15s,background .15s;
}
.hand-slot.sel{border-color:var(--gold2);background:rgba(240,192,96,.12);}
.hand-slot.used{opacity:.2;pointer-events:none;}

/* ══ UNIVERSAL DOMINO TILE ══ */
.dom-tile{
  background:var(--dark);
  border:2px solid var(--gold);
  border-radius:7px;
  box-shadow:2px 3px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07);
  overflow:hidden;
  position:relative;
  flex-shrink:0;
}
/* Grid placed tile */
.dom-tile.placed{
  position:absolute;
  pointer-events:auto;
  cursor:pointer;
  transition:border-color .12s,box-shadow .12s;
}
.dom-tile.placed.gsel{
  border-color:var(--gold2);
  box-shadow:0 0 0 2.5px rgba(240,192,96,.6),2px 3px 0 rgba(0,0,0,.5);
}
/* Ghost */
#ghost{
  position:fixed;z-index:9999;pointer-events:none;
  opacity:.9;transform:rotate(-5deg) scale(1.08);
  visibility:hidden; /* use visibility not display to keep layout */
}
#ghost.on{visibility:visible;}

/* pip face */
.pip-face{
  background:#f0e8d8;border-radius:4px;
  position:relative;overflow:hidden;flex-shrink:0;
}

/* dom-inner: flex layout inside tile */
.dom-inner{width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
.dom-inner.h{flex-direction:row;}
.dom-inner.v{flex-direction:column;}
.dom-sep{background:var(--gold);border-radius:2px;flex-shrink:0;}
.dom-inner.h .dom-sep{width:2px;align-self:stretch;margin:0 4px;}
.dom-inner.v .dom-sep{height:2px;align-self:stretch;margin:4px 0;}

/* Win */
#win-ov{position:fixed;inset:0;z-index:1000;background:rgba(8,5,2,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:13px;opacity:0;pointer-events:none;transition:opacity .4s;}
#win-ov.on{opacity:1;pointer-events:all;}
.win-t{font-family:'Playfair Display',serif;font-size:2.3rem;font-weight:900;
  color:var(--gold2);letter-spacing:4px;animation:wf 2s ease infinite;}
@keyframes wf{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.win-time{font-size:1.3rem;color:var(--gold);letter-spacing:4px;}
.win-s{font-size:.63rem;letter-spacing:3px;color:#b89060;text-align:center;}
.win-btn{background:var(--gold);color:var(--dark);border:none;
  font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;
  letter-spacing:2px;padding:11px 24px;border-radius:10px;cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.3);}
</style>
</head>
<body>

<!-- MENU -->
<div class="screen" id="menu">
  <div class="menu-title">PIPS</div>
  <div class="menu-sub">Daily Domino Puzzle</div>
  <div class="divider"></div>
  <div class="level-list" id="level-list"></div>
  <div class="divider"></div>
  <button class="btn-rnd" onclick="startRandom()">⚄ СЛУЧАЙНЫЙ УРОВЕНЬ</button>
</div>

<!-- GAME -->
<div class="screen hidden" id="game">
  <div class="game-header">
    <button class="btn-back" onclick="goMenu()">← МЕНЮ</button>
    <div class="gh-center">
      <div class="game-title" id="gtitle">PIPS</div>
      <div class="game-timer" id="timer">00:00</div>
    </div>
    <div class="game-stars" id="gstars"></div>
  </div>
  <div id="legend"></div>
  <div id="grid-outer">
    <div id="grid-wrap">
      <div id="grid"></div>
      <div id="dom-layer"></div>
      <div id="zone-overlay"></div>
      <div id="rule-overlay"></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="controls">
    <button class="ctrl" id="btn-rot" onclick="doRotate()" disabled>🔄 ПОВЕРНУТЬ</button>
    <div class="opill" id="opill">—</div>
    <button class="ctrl warn" id="btn-lift" onclick="doLift()" style="display:none">↑ В РУКУ</button>
    <button class="ctrl lite" onclick="resetPuzzle()">↺ СБРОС</button>
  </div>
  <div id="hand"></div>
</div>

<!-- Ghost (visibility-controlled, not display) -->
<div id="ghost" class="dom-tile"></div>

<!-- Win -->
<div id="win-ov">
  <div class="win-t">✦ ПОБЕДА ✦</div>
  <div class="win-time" id="wtime"></div>
  <div class="win-s" id="wsub"></div>
  <button class="win-btn" onclick="goMenu()">← МЕНЮ</button>
</div>

<script>
/* ══ TELEGRAM ══ */
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();}

const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const fmtT=s=>`${pad(Math.floor(s/60))}:${pad(s%60)}`;

/* ══ PIP PATTERNS (3×3 grid positions) ══ */
const PIPS={0:[],1:[[1,1]],2:[[0,0],[2,2]],3:[[0,0],[1,1],[2,2]],
  4:[[0,0],[2,0],[0,2],[2,2]],5:[[0,0],[2,0],[1,1],[0,2],[2,2]],
  6:[[0,0],[0,1],[0,2],[2,0],[2,1],[2,2]]};

function makePip(n,sz){
  const f=document.createElement('div');
  f.className='pip-face';f.style.width=sz+'px';f.style.height=sz+'px';
  const r=Math.max(2.5,sz*.13),step=sz/3;
  (PIPS[Math.min(6,Math.max(0,n))]||[]).forEach(([gx,gy])=>{
    const d=document.createElement('div');
    const cx=gx*step+step/2,cy=gy*step+step/2;
    d.style.cssText=`position:absolute;border-radius:50%;background:#1b1208;
      width:${r*2}px;height:${r*2}px;left:${cx-r}px;top:${cy-r}px;
      box-shadow:0 1px 1px rgba(0,0,0,.2);`;
    f.appendChild(d);
  });
  return f;
}

/* ══ FILL DOM TILE ══
   Puts inner content into `el`.
   Sets el width/height. Never touches el.style.display.
   oi: 0=→ 1=↓ 2=← 3=↑
   pip A is "first end", pip B is "second end".
   flip: oi>=2 → show B first, then A.
*/
function fillTile(el,a,b,oi,pipSz,tileW,tileH){
  el.innerHTML='';
  el.style.width=tileW+'px';
  el.style.height=tileH+'px';
  const isV=oi===1||oi===3;
  const flip=oi===2||oi===3;
  const p1=flip?b:a, p2=flip?a:b;
  const pad=Math.max(5,Math.round(pipSz*.2));
  const inner=document.createElement('div');
  inner.className='dom-inner '+(isV?'v':'h');
  inner.style.padding=pad+'px';
  inner.appendChild(makePip(p1,pipSz));
  const sep=document.createElement('div');sep.className='dom-sep';
  inner.appendChild(sep);
  inner.appendChild(makePip(p2,pipSz));
  el.appendChild(inner);
}

/* ══ ORIENT TABLE ══ */
const ORI=[
  {label:'→',dc:1,dr:0},{label:'↓',dc:0,dr:1},
  {label:'←',dc:1,dr:0},{label:'↑',dc:0,dr:1},
];
// Second cell given first cell + orient
function sec2(c,r,oi){const{dc,dr}=ORI[oi];return[c+dc,r+dr];}
// Which halves map to which cells
function halves(oi){const flip=oi>=2;return{h1:flip?'b':'a',h2:flip?'a':'b'};}

/* ══ ZONE COLORS ══ */
const ZC=[
  {bg:'#f7d6e0',bd:'#c8457a'},
  {bg:'#cfe3f7',bd:'#2f78c1'},
  {bg:'#d0f0d8',bd:'#2f9c50'},
  {bg:'#ead6f5',bd:'#7a38c0'},
  {bg:'#fde8cc',bd:'#c07028'},
];

/* ══ RULES ══ */
const rS=r=>({sum:`=${r.v}`,eq:'=',neq:'≠',gt:`>${r.v}`,lt:`<${r.v}`,none:''}[r.type]||'');
const rT=r=>({sum:`сумма = ${r.v}`,eq:'все равны',neq:'все разные',
  gt:`> ${r.v}`,lt:`< ${r.v}`,none:'свободно'}[r.type]||'');
function chk(rule,vals){
  if(!vals.length)return true;
  switch(rule.type){
    case'sum':return vals.reduce((s,v)=>s+v,0)===rule.v;
    case'eq': return vals.every(v=>v===vals[0]);
    case'neq':return new Set(vals).size===vals.length;
    case'gt': return vals.every(v=>v>rule.v);
    case'lt': return vals.every(v=>v<rule.v);
    default:  return true;
  }
}

/* ══════════════════════════════
   LEVELS  (all verified: even cell count, solutions checked)
══════════════════════════════ */
const LEVELS=[
  /* 0 — TUTORIAL 3×2 = 6 cells, 3 dominos
     Grid: [3][3][0]
           [1][2][4]
     Dom0(3,3)H@(0,0): cells(0,0)=3,(1,0)=3
     Dom1(1,2)H@(0,1): cells(0,1)=1,(1,1)=2
     Dom2(0,4)V@(2,0): cells(2,0)=0,(2,1)=4
  */
  {name:'TUTORIAL',stars:1,cols:3,rows:2,
   dominoes:[[3,3],[1,2],[0,4]],
   regions:[
     {rule:{type:'eq'},       cells:[[0,0],[1,0]]},  // 3,3 → equal ✓
     {rule:{type:'sum',v:3},  cells:[[0,1],[1,1]]},  // 1+2=3 ✓
     {rule:{type:'sum',v:4},  cells:[[2,0],[2,1]]},  // 0+4=4 ✓
  ]},

  /* 1 — L-ФОРМА 10 active cells, 5 dominos
     activeCells:
       [0,0][1,0][2,0]
       [0,1][1,1][2,1]
       [0,2][1,2][2,2][3,2]
     Solution:
       [2][2][4]   dom1(2,2)H@(0,0), dom2(4,3)H@(2,0) wait let me be careful
     Dom0(0,2)V@(0,0): (0,0)=0,(0,1)=2
     Dom1(2,4)H@(1,0): (1,0)=2,(2,0)=4
     Dom2(1,3)H@(1,1): (1,1)=1,(2,1)=3
     Dom3(2,0)H@(0,2): (0,2)=2,(1,2)=0  -- wait need H: dc=1
       Actually H means second cell is c+1. So Dom3 at (0,2)H: cells (0,2) and (1,2)
     Dom4(2,3)H@(2,2): cells (2,2) and (3,2) → 2,3
     Grid:
       [0][2][4]
       [2][1][3]
       [2][0][2][3]
  */
  {name:'L-ФОРМА',stars:2,cols:4,rows:3,
   activeCells:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2],[3,2]],
   dominoes:[[0,2],[2,4],[1,3],[2,0],[2,3]],
   regions:[
     {rule:{type:'sum',v:2},  cells:[[0,0],[0,1]]},  // 0+2=2 ✓
     {rule:{type:'sum',v:6},  cells:[[1,0],[2,0]]},  // 2+4=6 ✓
     {rule:{type:'neq'},      cells:[[1,1],[2,1]]},  // 1,3 ≠ ✓
     {rule:{type:'sum',v:2},  cells:[[0,2],[1,2]]},  // 2+0=2 ✓
     {rule:{type:'gt',v:1},   cells:[[2,2],[3,2]]},  // 2>1,3>1 ✓
  ]},

  /* 2 — КРЕСТ 12 active cells, 6 dominos
     activeCells:
                [2,0]
           [1,1][2,1][3,1]
     [0,2][1,2][2,2][3,2][4,2]
           [1,3][2,3][3,3]
     = 1+3+5+3 = 12 cells ✓  (no bottom tip)

     Dom0(2,1)V@(2,0): (2,0)=2,(2,1)=1
     Dom1(3,0)H@(1,1): (1,1)=3,(2,1) -- wait (2,1) is taken. Let me redo.

     Let me use orient ← (oi=2) for some:
     Dom0(1,2)V@(2,0): oi=1 → (2,0)=1,(2,1)=2
     Dom1(3,3)H@(1,1): oi=0 → (1,1)=3,(2,1)... but (2,1) has dom0's b half.
     Hmm let me plan more carefully.

     I'll plan a valid tiling:
     Pair (2,0)↔(2,1): dom A
     Pair (1,1)↔(1,2): dom B
     Pair (3,1)↔(3,2): dom C
     Pair (0,2)↔(1,2)... wait (1,2) used by B
     Let me try:
     Pair (2,0)↔(2,1): domA at (2,0) oi=1
     Pair (1,1)↔(1,2): domB at (1,1) oi=1
     Pair (3,1)↔(3,2): domC at (3,1) oi=1
     Pair (0,2)↔(1,2)... (1,2)=domB. No.
     Pair (0,2): needs neighbor. (0,2)'s H-neighbor is (1,2)=domB. V-neighbor (0,3) doesn't exist.
     So I need to change the tiling.

     Let me try horizontal pairs:
     (1,1)↔(2,1): domB H
     (0,2)↔(1,2): domD H
     (2,0)↔... only V neighbor (2,1) taken. So (2,0) must pair V with something not (2,1).
     No other neighbor. This is problematic.

     Alternative: remove [2,0] and add [2,4] → but that was the original 13-cell version.

     Let me use a 14-cell cross:
     [1,0][2,0][3,0]
     [0,1][1,1][2,1][3,1][4,1]  -- 5 wide
     [1,2][2,2][3,2]
     = 3+5+3 = 11... still odd.

     Add [2,3]:
     [1,0][2,0][3,0]
     [0,1][1,1][2,1][3,1][4,1]
     [1,2][2,2][3,2]
                [2,3]
     = 3+5+3+1=12 ✓

     Tiling:
     (1,0)↔(2,0)H: domA
     (3,0)↔(3,1)V: domB
     (0,1)↔(1,1)H: domC
     (2,1)↔(2,2)V: domD
     (4,1)↔(3,2)← : dom E oi=2, first cell (4,1), second (3,1)... no (3,1) taken by B.

     This is getting complex. Let me just use a simpler cross shape.

     SIMPLER: 4×3 cross-ish:
     [1,0][2,0]
     [0,1][1,1][2,1][3,1]

/* ══ RANDOM GENERATOR ══ */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function shu(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}}

function generateRandom(diff=1){
  for(let attempt=0;attempt<20;attempt++){
    const lv=tryGenRandom(diff);
    if(lv)return lv;
  }
  return LEVELS[0]; // fallback
}
function tryGenRandom(diff){
  const sizes=[[3,4],[4,4],[4,5],[5,5]];
  const[cols,rows]=sizes[Math.min(diff,3)];
  const ac=makeShape(cols,rows);
  if(!ac||ac.length<6)return null;

  const setA=new Set(ac.map(([c,r])=>`${c},${r}`));
  ac.sort((a,b)=>a[1]!==b[1]?a[1]-b[1]:a[0]-b[0]);

  // Tile with dominos using backtracking
  const tileOf={},placed=[];
  function tile(i){
    if(i>=ac.length)return true;
    const[c,r]=ac[i];const k=`${c},${r}`;
    if(tileOf[k]!==undefined)return tile(i+1);
    // Shuffle neighbor directions for variety
    const dirs=[[1,0],[0,1]];shu(dirs);
    const nbrs=dirs.filter(([dc,dr])=>{
      const k2=`${c+dc},${r+dr}`;
      return setA.has(k2)&&tileOf[k2]===undefined;
    });
    for(const[dc,dr]of nbrs){
      const di=placed.length;const k2=`${c+dc},${r+dr}`;
      tileOf[k]=di;tileOf[k2]=di;placed.push([[c,r],[c+dc,r+dr]]);
      if(tile(i+1))return true;
      placed.pop();delete tileOf[k];delete tileOf[k2];
    }
    return false;
  }
  if(!tile(0))return null;

  // Assign pip values
  const domVals=placed.map(()=>[ri(0,5),ri(0,5)]);
  const cVal=(c,r)=>{
    const di=tileOf[`${c},${r}`];
    const[[ac2,ar]]=placed[di];
    return domVals[di][ac2===c&&ar===r?0:1];
  };

  // Zone BFS partition — ensure every cell is in exactly one zone
  const zCount=Math.max(2,Math.min(5,Math.floor(ac.length/4)));
  const zOf={};
  const seeds=[];const sh2=[...ac];shu(sh2);
  seeds.push(sh2[0]);
  for(const cell of sh2){
    if(seeds.length>=zCount)break;
    if(seeds.every(s=>Math.abs(s[0]-cell[0])+Math.abs(s[1]-cell[1])>=2))seeds.push(cell);
  }
  seeds.forEach(([c,r],i)=>{zOf[`${c},${r}`]=i;});
  const bfsQ=[...seeds.map(([c,r],i)=>({c,r,z:i}))];let bi=0;
  while(bi<bfsQ.length){
    const{c,r,z}=bfsQ[bi++];
    for(const[nc,nr]of[[c+1,r],[c-1,r],[c,r+1],[c,r-1]]){
      const k2=`${nc},${nr}`;
      if(setA.has(k2)&&zOf[k2]===undefined){zOf[k2]=z;bfsQ.push({c:nc,r:nr,z});}
    }
  }
  // Any missed cell → zone 0
  ac.forEach(([c,r])=>{if(zOf[`${c},${r}`]===undefined)zOf[`${c},${r}`]=0;});

  const zCells=Array.from({length:zCount},()=>[]);
  ac.forEach(([c,r])=>zCells[zOf[`${c},${r}`]].push([c,r]));

  // Build regions with rules based on solution values
  const regions=zCells.map(cells=>{
    const vals=cells.map(([c,r])=>cVal(c,r));
    return{rule:pickRule(vals),cells};
  });

  return{name:'RANDOM',stars:diff+2,cols,rows,activeCells:ac,dominoes:domVals,regions};
}

function makeShape(cols,rows){
  const target=Math.floor(cols*rows*.7);
  // Ensure target is even
  const t=target%2===0?target:target-1;
  const active=new Set();const front=[];
  const sc=Math.floor(cols/2),sr=Math.floor(rows/2);
  active.add(`${sc},${sr}`);front.push([sc,sr]);
  while(active.size<t&&front.length){
    const idx=Math.floor(Math.random()*Math.min(front.length,5));
    const[c,r]=front.splice(idx,1)[0];
    const nbrs=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]]
      .filter(([nc,nr])=>nc>=0&&nc<cols&&nr>=0&&nr<rows&&!active.has(`${nc},${nr}`));
    shu(nbrs);
    for(const nb of nbrs){
      if(active.size>=t)break;
      active.add(`${nb[0]},${nb[1]}`);front.push(nb);
    }
  }
  const arr=[...active].map(k=>k.split(',').map(Number));
  // Fix odd count by removing a leaf
  if(arr.length%2===1){
    const sa=new Set(active);
    for(let i=arr.length-1;i>=0;i--){
      const[c,r]=arr[i];
      const deg=[[c+1,r],[c-1,r],[c,r+1],[c,r-1]].filter(([nc,nr])=>sa.has(`${nc},${nr}`)).length;
      if(deg<=1){arr.splice(i,1);sa.delete(`${c},${r}`);break;}
    }
  }
  return arr.length>=4&&arr.length%2===0?arr:null;
}

function pickRule(vals){
  if(!vals.length)return{type:'none'};
  const sum=vals.reduce((s,v)=>s+v,0);
  const mn=Math.min(...vals),mx=Math.max(...vals);
  const opts=[];
  // Always include sum
  opts.push({type:'sum',v:sum});
  if(vals.length>1&&vals.every(v=>v===vals[0]))opts.push({type:'eq'});
  if(vals.length>1&&new Set(vals).size===vals.length)opts.push({type:'neq'});
  if(mn>0)opts.push({type:'gt',v:mn-1});
  if(mx<5)opts.push({type:'lt',v:mx+1});
  // Prefer non-sum for variety (sum rules are the safest fallback)
  const nonSum=opts.filter(o=>o.type!=='sum');
  return nonSum.length?nonSum[Math.floor(Math.random()*nonSum.length)]:opts[0];
}

function buildGame(){
  $('gtitle').textContent=puzzle.name;
  $('gstars').textContent='★'.repeat(puzzle.stars);

  const avail=Math.min(window.innerWidth,440)-20-14;
  CELL=Math.max(34,Math.min(58,Math.floor((avail+GAP)/puzzle.cols)-GAP));
  STEP=CELL+GAP;

  activeSet.clear();
  const ac=puzzle.activeCells||allC(puzzle.cols,puzzle.rows);
  ac.forEach(([c,r])=>activeSet.add(`${c},${r}`));

  cellReg={};
  puzzle.regions.forEach((region,ri2)=>region.cells.forEach(([c,r])=>{cellReg[`${c},${r}`]=ri2;}));

  // Legend
  const lg=$('legend');lg.innerHTML='';
  puzzle.regions.forEach((r,i)=>{
    if(r.rule.type==='none')return;
    const col=ZC[i%ZC.length];
    const d=document.createElement('div');d.className='lg';
    d.innerHTML=`<div class="lg-dot" style="background:${col.bg};border-color:${col.bd}"></div><span>${rT(r.rule)}</span>`;
    lg.appendChild(d);
  });

  // Grid
  const grid=$('grid');grid.innerHTML='';
  grid.style.gridTemplateColumns=`repeat(${puzzle.cols},${CELL}px)`;
  grid.style.gridTemplateRows=`repeat(${puzzle.rows},${CELL}px)`;
  grid.style.gap=GAP+'px';
  cellEls={};

  for(let r=0;r<puzzle.rows;r++){
    for(let c=0;c<puzzle.cols;c++){
      const key=`${c},${r}`;
      const cell=document.createElement('div');
      cell.style.width=CELL+'px';cell.style.height=CELL+'px';
      cell.dataset.c=c;cell.dataset.r=r;
      if(activeSet.has(key)){
        cell.className='cell active';
        const ri2=cellReg[key];
        if(ri2!==undefined){
          const col=ZC[ri2%ZC.length];
          cell.style.background=col.bg;
          cell.style.borderColor=col.bd;
          cell.style.borderStyle='solid';
          cell.style.borderWidth='2px';
        }
        cell.onclick=()=>onCellClick(c,r);
        cellEls[key]=cell;
      } else {
        cell.className='cell inactive';
      }
      grid.appendChild(cell);
    }
  }

  buildZoneOverlay();
  buildRuleOverlay();
  buildHand();
  clearSel();
  setSt('Нажмите на костяшку — она выделится и кнопка поворота активируется');
}

/* Zone overlay: thin colored frame over each zone cell.
   Normally invisible (opacity:0), shown when that zone has errors. */
function buildZoneOverlay(){
  const ov=$('zone-overlay');ov.innerHTML='';
  zoneCellOverlays={};
  const M=3; // inset margin so zone border shows around domino
  puzzle.regions.forEach((region,ri2)=>{
    const col=ZC[ri2%ZC.length];
    region.cells.forEach(([c,r])=>{
      const key=`${c},${r}`;
      const div=document.createElement('div');
      div.className='zone-cell-overlay';
      div.style.left=(c*STEP+M)+'px';
      div.style.top=(r*STEP+M)+'px';
      div.style.width=(CELL-M*2)+'px';
      div.style.height=(CELL-M*2)+'px';
      div.style.borderColor=col.bd;
      div.style.background=col.bg;
      ov.appendChild(div);
      zoneCellOverlays[key]=div;
    });
  });
}

function buildRuleOverlay(){
  const ov=$('rule-overlay');ov.innerHTML='';
  puzzle.regions.forEach((region,ri2)=>{
    const sh2=rS(region.rule);if(!sh2)return;
    const maxC=Math.max(...region.cells.map(([c])=>c));
    const minR=Math.min(...region.cells.map(([,r])=>r));
    const x=(maxC+1)*STEP-GAP/2;
    const y=minR*STEP;
    const badge=document.createElement('div');badge.className='rule-badge';
    badge.textContent=sh2;badge.style.left=x+'px';badge.style.top=y+'px';
    const col=ZC[ri2%ZC.length];
    badge.style.borderColor=col.bd;badge.style.color=col.bd;badge.style.background=col.bg;
    ov.appendChild(badge);
  });
}

function allC(cols,rows){const a=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)a.push([c,r]);return a;}

/* ══ HAND ══ */
const H_SZ=20; // pip face size in hand tile

function buildHand(){
  const hand=$('hand');hand.innerHTML='';slotEls=[];tileEls=[];
  puzzle.dominoes.forEach(([a,b],di)=>{
    const slot=document.createElement('div');
    slot.className='hand-slot';
    if(usedDom.has(di))slot.classList.add('used');

    const tile=document.createElement('div');
    tile.className='dom-tile';
    const{w,h}=domSz(0,H_SZ);
    fillTile(tile,a,b,0,H_SZ,w,h);

    slot.appendChild(tile);
    slot.onclick=e=>{e.stopPropagation();onHandSlotClick(di);};
    setupDrag(slot,di);
    hand.appendChild(slot);
    slotEls.push(slot);tileEls.push(tile);
  });
}

// Compute tile width/height for given orient and pip size
function domSz(oi,pipSz){
  const isV=oi===1||oi===3;
  const pad=Math.max(4,Math.round(pipSz*.18));
  const body=pipSz*2+2+8; // 2 pips + sep + gap×2
  const thin=pipSz+pad*2+4;
  const long=body+pad*2+4;
  return isV?{w:thin,h:long}:{w:long,h:thin};
}

// Re-fill ONLY the selected tile in hand with current orientIdx
function refreshSelHandTile(){
  if(selDi===null)return;
  const[a,b]=puzzle.dominoes[selDi];
  const oi=selMode==='hand'?orientIdx:0; // grid-sel: show natural in hand
  const{w,h}=domSz(oi,H_SZ);
  fillTile(tileEls[selDi],a,b,oi,H_SZ,w,h);
}

/* ══ INTERACTION CORE ══

   STATE MACHINE:
   ┌──────────────────────────────────────────────────────────┐
   │ selMode=null                                              │
   │   Click hand slot → selMode='hand', selDi=di             │
   │   Click placed tile → selMode='grid', selDi=di           │
   │                                                          │
   │ selMode='hand'                                            │
   │   Rotate → update orientIdx, refresh hand tile visual     │
   │   Click field cell → place domino                         │
   │   Click same slot → deselect                              │
   │   Click other slot → switch selection                     │
   │   Lift btn → n/a (already in hand)                        │
   │                                                          │
   │ selMode='grid'                                            │
   │   Rotate → attempt rotate-in-place; if impossible, msg   │
   │   Click same tile → deselect                              │
   │   Click empty cell → MOVE to new position                 │
   │   Lift btn → move to hand                                 │
   └──────────────────────────────────────────────────────────┘
*/

function onHandSlotClick(di){
  if(usedDom.has(di))return;
  if(selMode==='hand'&&selDi===di){clearSel();return;}
  // Switch to this hand domino
  clearSelVisual();
  selMode='hand';selDi=di;
  slotEls[di].classList.add('sel');
  refreshSelHandTile();
  updateCtrl();
  setSt('Выделено. 🔄 повернуть → нажмите на поле для размещения');
}

function onCellClick(c,r){
  const key=`${c},${r}`;
  const info=board[key];

  if(info){
    const di=info.di;
    // Click on a placed domino
    if(selMode==='grid'&&selDi===di){
      // Clicking same selected grid tile → deselect
      clearSel();
      return;
    }
    // Select this grid tile
    clearSelVisual();
    selMode='grid';selDi=di;
    // Restore orientIdx from its placement
    orientIdx=placements[di].oi;
    slotEls[di].classList.add('sel');
    highlightGridTile(di,true);
    updateCtrl();
    setSt('Выделено. 🔄 повернуть на месте | ↑ в руку | нажмите пустую клетку для перемещения');
    return;
  }

  // Click on empty cell
  if(selDi===null){setSt('Нажмите на костяшку — она выделится');return;}

  if(selMode==='hand'){
    // Place from hand
    const[c2,r2]=sec2(c,r,orientIdx);
    if(!canPlace(c,r,c2,r2))return;
    placeFromHand(selDi,c,r);
  } else if(selMode==='grid'){
    // Move placed tile to new position
    const[c2,r2]=sec2(c,r,orientIdx);
    if(!canPlace(c,r,c2,r2))return;
    moveGridTile(selDi,c,r);
  }
}

function canPlace(c,r,c2,r2,showMsg=true){
  const k=`${c},${r}`,k2=`${c2},${r2}`;
  if(!activeSet.has(k)){if(showMsg)setSt('Клетка неактивна');return false;}
  if(!activeSet.has(k2)){if(showMsg)setSt('Нет соседней клетки — повернуть?');return false;}
  if(board[k]){if(showMsg)setSt('Клетка занята');return false;}
  if(board[k2]){if(showMsg)setSt('Соседняя клетка занята');return false;}
  return true;
}

function placeFromHand(di,c,r){
  const oi=orientIdx;
  const{dc,dr}=ORI[oi];
  const c2=c+dc,r2=r+dr;
  const{h1,h2}=halves(oi);
  board[`${c},${r}`]={di,half:h1};
  board[`${c2},${r2}`]={di,half:h2};
  placements[di]={c,r,oi};
  usedDom.add(di);

  // Reset hand tile visual
  const[a,b]=puzzle.dominoes[di];
  const{w,h}=domSz(0,H_SZ);
  fillTile(tileEls[di],a,b,0,H_SZ,w,h);
  slotEls[di].classList.remove('sel');
  slotEls[di].classList.add('used');

  selMode=null;selDi=null;
  clearHL();updateCtrl();tStart();renderBoard();validate();
}

function moveGridTile(di,c,r){
  // Remove old placement
  const old=placements[di];
  const{dc:odc,dr:odr}=ORI[old.oi];
  delete board[`${old.c},${old.r}`];
  delete board[`${old.c+odc},${old.r+odr}`];
  delete placements[di];

  // Place at new position
  const oi=orientIdx;
  const{dc,dr}=ORI[oi];
  const c2=c+dc,r2=r+dr;
  const{h1,h2}=halves(oi);
  board[`${c},${r}`]={di,half:h1};
  board[`${c2},${r2}`]={di,half:h2};
  placements[di]={c,r,oi};

  clearSelVisual();
  selMode=null;selDi=null;
  clearHL();updateCtrl();renderBoard();validate();
}

/* Rotate selected tile */
function doRotate(){
  if(selDi===null)return;
  const newOi=(orientIdx+1)%4;

  if(selMode==='hand'){
    // Just update visual
    orientIdx=newOi;
    refreshSelHandTile();
    updateCtrl();
  } else if(selMode==='grid'){
    // Attempt rotate-in-place
    const{c,r,oi:oldOi}=placements[selDi];
    const{dc:odc,dr:odr}=ORI[oldOi];
    const oldK1=`${c},${r}`;
    const oldK2=`${c+odc},${r+odr}`;
    const{dc:ndc,dr:ndr}=ORI[newOi];
    const newK2=`${c+ndc},${r+ndr}`;

    // Check if rotation is possible:
    // newK2 must be active and either empty or equal to oldK2 (same tile)
    if(!activeSet.has(newK2)){
      setSt('Нельзя повернуть — нет места. Переместите сначала');
      return;
    }
    if(board[newK2]&&board[newK2].di!==selDi){
      setSt('Нельзя повернуть — клетка занята. Переместите сначала');
      return;
    }

    // Apply rotation
    const di=selDi;
    const{h1,h2}=halves(newOi);
    delete board[oldK1];delete board[oldK2];
    board[oldK1]={di,half:h1};
    board[newK2]={di,half:h2};
    placements[di]={c,r,oi:newOi};
    orientIdx=newOi;
    updateCtrl();
    renderBoard();
    // Re-highlight the grid tile
    highlightGridTile(di,true);
    validate();
  }
}

/* Lift selected grid tile to hand */
function doLift(){
  if(selMode!=='grid'||selDi===null)return;
  const di=selDi;
  const{c,r,oi}=placements[di];
  const{dc,dr}=ORI[oi];
  delete board[`${c},${r}`];
  delete board[`${c+dc},${r+dr}`];
  delete placements[di];
  usedDom.delete(di);

  clearSelVisual();
  // Now select it in hand
  selMode='hand';selDi=di;
  // Keep orientIdx as it was when on grid
  slotEls[di].classList.remove('used');
  slotEls[di].classList.add('sel');
  refreshSelHandTile();
  updateCtrl();
  renderBoard();
  setSt('В руку. Разверните и нажмите на поле для размещения');
}

/* Clear selection state + visuals */
function clearSel(){
  clearSelVisual();
  selMode=null;selDi=null;
  clearHL();updateCtrl();
  setSt('Нажмите на костяшку — она выделится и кнопка поворота активируется');
}

function clearSelVisual(){
  if(selDi!==null){
    slotEls[selDi]?.classList.remove('sel');
    highlightGridTile(selDi,false);
    // Reset hand tile to oi=0 look (only if not used)
    if(!usedDom.has(selDi)){
      const[a,b]=puzzle.dominoes[selDi];
      const{w,h}=domSz(0,H_SZ);
      fillTile(tileEls[selDi],a,b,0,H_SZ,w,h);
    }
  }
}

/* Highlight/unhighlight the placed tile for di */
function highlightGridTile(di,on){
  // Find the placed .dom-tile for this di in dom-layer
  const layer=$('dom-layer');
  layer.querySelectorAll('.dom-tile.placed').forEach(el=>{
    if(+el.dataset.di===di){
      el.classList.toggle('gsel',on);
    }
  });
}

function updateCtrl(){
  const hasSel=selDi!==null;
  $('btn-rot').disabled=!hasSel;
  $('btn-lift').style.display=(selMode==='grid')?'':'none';
  $('opill').textContent=hasSel?ORI[orientIdx].label:'—';
}

function resetPuzzle(){
  board={};placements={};usedDom=new Set();tReset();
  selMode=null;selDi=null;orientIdx=0;
  puzzle.dominoes.forEach(([a,b],di)=>{
    slotEls[di]?.classList.remove('sel','used');
    const{w,h}=domSz(0,H_SZ);
    fillTile(tileEls[di],a,b,0,H_SZ,w,h);
  });
  clearHL();updateCtrl();
  renderBoard();setSt('Сброс.');
}

/* ══ RENDER BOARD ══
   Each placed domino → ONE unified .dom-tile in #dom-layer.
   Tile is CELL-6px inset from edges so zone color shows around it.
*/
function renderBoard(){
  const layer=$('dom-layer');layer.innerHTML='';
  Object.values(cellEls).forEach(el=>el.classList.remove('win-c'));

  const M=3; // margin so zone color shows
  const gridPip=Math.max(18,Math.min(32,CELL-18));

  Object.entries(placements).forEach(([di_s,{c,r,oi}])=>{
    const di=+di_s;
    const[a,b]=puzzle.dominoes[di];
    const isV=oi===1||oi===3;
    const tW=isV?(CELL-M*2):(CELL*2+GAP-M*2);
    const tH=isV?(CELL*2+GAP-M*2):(CELL-M*2);

    const tile=document.createElement('div');
    tile.className='dom-tile placed';
    tile.dataset.di=di;
    tile.style.left=(c*STEP+M)+'px';
    tile.style.top=(r*STEP+M)+'px';
    tile.style.pointerEvents='auto';
    if(selMode==='grid'&&selDi===di)tile.classList.add('gsel');

    fillTile(tile,a,b,oi,gridPip,tW,tH);

    // Click to select/deselect grid tile (handled via cell click, but also direct)
    tile.addEventListener('click',e=>{
      e.stopPropagation();
      // Find anchor cell
      onCellClick(c,r);
    });

    // Drag from grid
    tile.addEventListener('pointerdown',e=>{
      if(isDrag)return;
      e.preventDefault();e.stopPropagation();
      // First select it
      if(!(selMode==='grid'&&selDi===di)){
        clearSelVisual();
        selMode='grid';selDi=di;
        orientIdx=placements[di].oi;
        slotEls[di].classList.add('sel');
        highlightGridTile(di,true);
        updateCtrl();
      }
      startDrag(e,di);
    },{passive:false});

    layer.appendChild(tile);
  });
}

/* ══ HOVER HIGHLIGHT ══ */
let hlKeys=[];
function clearHL(){hlKeys.forEach(k=>cellEls[k]?.classList.remove('hl-ok','hl-bad'));hlKeys=[];}
function hlPreview(c,r){
  clearHL();if(selDi===null)return;
  const k=`${c},${r}`;const[c2,r2]=sec2(c,r,orientIdx);const k2=`${c2},${r2}`;
  // When grid-sel, the currently occupied cells are "free" to move to
  const okSrc=selMode==='grid'?new Set(
    Object.keys(board).filter(bk=>board[bk].di===selDi)
  ):new Set();
  const ok=activeSet.has(k)&&activeSet.has(k2)&&
    (!board[k]||okSrc.has(k))&&(!board[k2]||okSrc.has(k2));
  cellEls[k]?.classList.add(ok?'hl-ok':'hl-bad');
  if(ok)cellEls[k2]?.classList.add('hl-ok');
  hlKeys=[k,k2];
}
$('grid').addEventListener('pointermove',e=>{
  if(isDrag||!selDi)return;
  const el=e.target.closest?.('.cell.active');
  if(el)hlPreview(+el.dataset.c,+el.dataset.r);
},{passive:true});
$('grid-wrap').addEventListener('pointerleave',()=>{if(!isDrag)clearHL();});

/* ══ VALIDATE ══ */
function validate(){
  // Clear zone error state
  Object.values(zoneCellOverlays).forEach(el=>el.classList.remove('err'));

  if(usedDom.size<puzzle.dominoes.length){
    setSt(`${usedDom.size}/${puzzle.dominoes.length} размещено`);return;
  }

  const errRegions=[];
  puzzle.regions.forEach((region,ri2)=>{
    if(region.rule.type==='none')return;
    const vals=region.cells.map(([c,r])=>{
      const info=board[`${c},${r}`];if(!info)return null;
      const[a,b]=puzzle.dominoes[info.di];
      return info.half==='a'?a:b;
    }).filter(v=>v!==null);
    if(!chk(region.rule,vals))errRegions.push(ri2);
  });

  if(!errRegions.length){
    Object.values(cellEls).forEach(el=>el.classList.add('win-c'));
    tStop();
    $('wtime').textContent=fmtT(timerSecs);
    $('wsub').textContent=`${puzzle.name} · ${puzzle.dominoes.length} костяшек`;
    $('win-ov').classList.add('on');
    tg?.HapticFeedback?.notificationOccurred('success');
  } else {
    // Highlight error zones
    errRegions.forEach(ri2=>{
      puzzle.regions[ri2].cells.forEach(([c,r])=>{
        const key=`${c},${r}`;
        if(zoneCellOverlays[key])zoneCellOverlays[key].classList.add('err');
      });
    });
    const names=errRegions.map(ri2=>{
      const col=ZC[ri2%ZC.length];
      return `<span style="color:${col.bd}">${rS(puzzle.regions[ri2].rule)}</span>`;
    });
    $('status').innerHTML=`❌ Ошибка в зонах: ${names.join(', ')}`;
  }
}

function setSt(msg){$('status').textContent=msg;}

/* ══ GHOST ══ */
const ghost=$('ghost');

function updateGhostContent(){
  if(selDi===null)return;
  const[a,b]=puzzle.dominoes[selDi];
  const gPip=H_SZ+4;
  const{w,h}=domSz(orientIdx,gPip);
  fillTile(ghost,a,b,orientIdx,gPip,w,h);
}

/* ══ DRAG ══ */
let isDrag=false,dragDi=-1;

function setupDrag(slot,di){
  slot.addEventListener('pointerdown',e=>{
    if(usedDom.has(di))return;
    e.preventDefault();
    if(!(selMode==='hand'&&selDi===di)){
      clearSelVisual();
      selMode='hand';selDi=di;
      orientIdx=0; // reset orient when picking from hand fresh
      slotEls[di].classList.add('sel');
      refreshSelHandTile();
      updateCtrl();
    }
    startDrag(e,di);
  },{passive:false});
}

function startDrag(e,di){
  isDrag=true;dragDi=di;
  updateGhostContent();
  ghost.classList.add('on');
  mghost(e.clientX,e.clientY);
  document.addEventListener('pointermove',onDM,{passive:true});
  document.addEventListener('pointerup',onDU);
  document.addEventListener('pointercancel',()=>endDrag());
}
function mghost(x,y){ghost.style.left=(x-48)+'px';ghost.style.top=(y-28)+'px';}
function onDM(e){
  if(!isDrag)return;
  mghost(e.clientX,e.clientY);
  ghost.style.visibility='hidden';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  ghost.style.visibility='';
  const cell=el?.closest?.('.cell.active');
  if(cell)hlPreview(+cell.dataset.c,+cell.dataset.r);else clearHL();
}
function onDU(e){
  if(!isDrag)return;
  clearHL();
  ghost.style.visibility='hidden';
  const el=document.elementFromPoint(e.clientX,e.clientY);
  ghost.style.visibility='';
  const cell=el?.closest?.('.cell.active');
  if(cell){
    const c=+cell.dataset.c,r=+cell.dataset.r;
    const[c2,r2]=sec2(c,r,orientIdx);
    const okSrc=selMode==='grid'?new Set(Object.keys(board).filter(k=>board[k].di===dragDi)):new Set();
    const k=`${c},${r}`,k2=`${c2},${r2}`;
    const ok=activeSet.has(k)&&activeSet.has(k2)&&
      (!board[k]||okSrc.has(k))&&(!board[k2]||okSrc.has(k2));
    if(ok){
      if(selMode==='grid')moveGridTile(dragDi,c,r);
      else placeFromHand(dragDi,c,r);
    } else {setSt('Нельзя — повернуть 🔄 или другое место');}
  }
  endDrag();
}
function endDrag(){
  isDrag=false;ghost.classList.remove('on');
  document.removeEventListener('pointermove',onDM);
  document.removeEventListener('pointerup',onDU);
}

/* ══ INIT ══ */
renderMenu();
</script>
